        `toVariantId` phải cùng sản phẩm với dòng hiện tại và còn hàng, nếu không `422 validation` (`field: toVariantId`) / `409 stock-changed`. Đã có dòng `toVariantId` thì gộp: số lượng = tổng hai dòng cắt theo `min(5, tồn)`; `notice.code = merged` (kèm `adjustedTo` khi bị cắt). Nguyên tử trong một giao dịch.
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
