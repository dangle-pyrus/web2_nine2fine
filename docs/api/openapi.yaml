                transferAmount: { type: integer, minimum: 0 }
                referenceCode: { type: [string, 'null'] }
                description: { type: [string, 'null'] }
      responses:
        '200':
          description: Đã ghi nhận.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, const: true }
