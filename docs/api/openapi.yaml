    - **Đơn giữ `completed`:** KHÔNG thêm giá trị `OrderStatus`. Yêu cầu trả hàng là thực thể riêng với 6 trạng thái `requested` -> `approved` -> `received` -> `refunded`; `requested` | `approved` -> `rejected`; `requested` -> `cancelled` (khách). Mỗi chuyển là so-sánh-rồi-đổi nguyên tử; ngoài bảng / lặp lại / thua cuộc đua -> `409 invalid-transition` (+`currentReturnState`). Tối đa 1 yêu cầu không-`cancelled` mỗi đơn (ràng buộc ở DB).
    - **Phiên và quyền:** khách thành viên cookie `n2f_sid` (chỉ đơn của chính mình; đơn người khác hoặc không có -> `404`, không lộ); khách vãng lai cookie `n2f_oa` gắn đúng đơn [Should]; admin cookie `n2f_asid`. Quyền mới: `returns.process` (staff + admin: xem, duyệt, từ chối / đóng, nhận hàng) và `returns.refund` (CHỈ admin: xác nhận hoàn tiền + xem số tài khoản đầy đủ khi `received`). Thiếu quyền -> `403` trước khi đọc thân. Mọi phản hồi (kể cả 401 / 403 / 404 của nhóm này) `Cache-Control: no-store`; ảnh `private, no-store`.
    - **Tiền (BR-RET-30, một công thức một nơi):** theo `order_items.line_discount`; dự kiến lúc gửi, CHỐT lúc nhận hàng (số lượng đạt), admin chỉ xác nhận đã chuyển (`amount` phải bằng số chốt; không có ô sửa tay). Hoàn tiền thật là thủ công, ngoài hệ thống. `payment_status` đơn đổi CHỈ ở bước `refunded` (`refunded` nếu mọi dòng đơn hoàn đủ, ngược lại `partially_refunded`).
    - **Số tài khoản nhận hoàn (BR-RET-16, 17):** đơn COD bắt buộc `bank`, `accountNumber`, `accountName`; đơn `bank-transfer` bỏ qua. Mọi phản hồi cho khách và staff chỉ có ngân hàng, 4 số cuối, tên; admin thấy đủ số CHỈ ở `received`; không bao giờ trong email, sự kiện đơn, nhật ký, log, CSV, tên tệp; XOÁ số đầy đủ trong cùng giao dịch khi yêu cầu sang `refunded` | `rejected` | `cancelled`.
    - **Ảnh riêng tư (BR-RET-14, 15):** tải bằng thân byte thô (như ảnh sản phẩm) vào kho RIÊNG TƯ, KHÔNG phải bucket công khai `product-images`; xem qua endpoint có kiểm quyền ở MỖI lần (máy chủ trả byte, không `302`, không URL ký); không bao giờ qua `/media/{id}`.
    - **Mã lỗi mới:** `not-returnable` 409, `return-window-closed` 409, `return-exists` 409. Dùng lại `unauthenticated`, `forbidden`, `origin-not-allowed`, `not-found`, `validation` (+`field` phẳng, +`fieldErrors` ở tạo yêu cầu / nhận hàng), `invalid-image`, `invalid-transition` (+trường mới `currentReturnState`), `idempotency-conflict`, `rate-limited`, `unavailable`.
    - **Giới hạn tần suất:** tạo yêu cầu 10 / giờ / tài khoản (khách vãng lai: / IP); tải ảnh 30 / giờ / tài khoản (vãng lai: / đơn); khách đọc / huỷ / dự kiến dùng bộ đếm đơn hiện có (120 / 60 giây); admin chung bộ đếm admin (đọc 120, ghi 60 / 60 giây).
    - **Giờ:** hạn trả = 23:59:59 giờ VN của ngày thứ 30 kể từ ngày giao (ngày giao VN = ngày 0), máy chủ tính (`Order.canReturn`, `Order.returnDeadline`); thời điểm ISO UTC; tiền số nguyên đồng.
    - **Không có (Won't):** đổi hàng, cổng hoàn tiền, nhân viên tạo hộ yêu cầu, sửa tay số tiền, hoàn nhiều đợt, tạo lại sau khi bị từ chối / đã hoàn, hoàn lượt voucher, lý do "khác" / "không như mô tả", tự xoá ảnh theo lịch, sửa số ngày / phí gửi trả ở Cài đặt.
    ## Slice 10 - Gói P1: trả hàng vãng lai, đánh giá, wishlist, gợi ý, nội dung, khuyến mãi (status: locked 2026-11-13, Orchestrator; mặc định PO S10-Q1..Q12, Thắng vắng)
    Tag `reviews`, `admin-reviews`, `wishlist`, `recommendations`, `content`, `admin-content`, `admin-sales`, `collections`, `admin-collections` (mới) + `returns`, `return-photos` (5 operation vãng lai chuyển từ draft sang locked) + thay đổi cộng thêm ở `catalog`, `admin-products`, `admin-returns`, `order`. BR/AC `docs/product/PRD.md` Slice 10 (BR-P1, BR-RET-60..66, BR-REV, BR-WISH, BR-REC, BR-MOM, BR-PROMO, BR-CMS; AC cùng tiền tố); kế hoạch + bảng + thứ tự lát + file theo lát: `docs/api/p1-bundle-implementation-plan.md`. **Mỗi khu có cờ FE riêng** (`reviewsMode`, `wishlistMode`, `recommendationsMode`, `contentMode`, `promotionsMode`; trả hàng vãng lai dùng `returnsMode`); phát hành / hoàn tác độc lập, migration chỉ cộng thêm (`20261113000100_p1_bundle`). Lát 10.8 (bộ sưu tập, "Khôi phục mặc định") và mọi operation đánh `x-priority: should` CÓ THỂ CẮT: bỏ chúng thì phần còn lại không đổi.
    - **Operation theo lát:** 10.2 trả hàng vãng lai (5, `/orders/{orderCode}/return*`); 10.3 nội dung (`GET /content/home`, `GET /admin/content/home`, `PUT /admin/content/home`, `GET /admin/size-charts`, `PUT /admin/size-charts/{category}`; đổi `GET /size-charts/{category}`); 10.4 wishlist (4, `/account/wishlist*`); 10.5 đánh giá (`GET /products/{productId}/reviews` ĐỔI, `GET /reviews/eligibility`, `POST /reviews`, `GET /admin/reviews`, `POST .../hide`, `POST .../show`, `PUT .../reply`); 10.6 gợi ý (`GET /recommendations`); 10.7 khuyến mãi (trường `salePrice` / `saleStartsAt` / `saleEndsAt` ở `PUT /admin/products/{id}`, `discountPercent` ở `Product`, `sale=true` ở `GET /products`; Should: `POST /admin/sales/bulk/preview`, `POST /admin/sales/bulk`); 10.8 (Should) bộ sưu tập (`GET /collections`, `GET /collections/{slug}`, `GET|POST /admin/collections`, `GET|PUT|DELETE /admin/collections/{collectionId}`) + `POST /admin/content/home/reset`.
    - **Đường dẫn đánh giá của thành viên nằm NGOÀI `/products/**`** (`/reviews/**`): `/products/**` là vùng công khai chỉ đọc, phản hồi không phụ thuộc người dùng (Slice 2, AC-CAT-44..46); eligibility và gửi đánh giá phụ thuộc phiên nên không thể ở đó. Chỉ danh sách đánh giá công khai ở lại `/products/{productId}/reviews`.
    - **Phiên và quyền:** wishlist, eligibility, gửi đánh giá: cookie `n2f_sid` (member). Wishlist luôn `Cache-Control: no-store` (kể cả 401). Mọi `/admin/**` mới: cookie `n2f_asid`; vai trò và `is_active` đọc từ DB mỗi yêu cầu; mọi phản hồi (kể cả 401 / 403) `no-store`. Quyền mới (BR-P1-03): `reviews.moderate` (staff + admin: danh sách, ẩn, hiện, trả lời), `content.view` (staff + admin: đọc nội dung trang chủ / bảng size / bộ sưu tập), `content.edit` (chỉ admin: lưu trang chủ, lưu bảng size, bộ sưu tập, "Khôi phục mặc định"). Đợt giảm giá ở `PUT /admin/products/{id}` cần `products.write`, và khi thân có bất kỳ trường `sale*` thì còn cần `promotions.write` (= `promotions.edit` ở PRD; cả hai chỉ admin); hàng loạt: `promotions.write`. Thiếu quyền -> `403 forbidden` kiểm TRƯỚC khi đọc thân, không đổi dữ liệu.
    - **Mã lỗi mới (3, đều 409):** `not-eligible` (chưa đủ điều kiện đánh giá), `already-reviewed` (đã đánh giá sản phẩm này), `wishlist-full` (đủ 100 mục). Dùng lại: `unauthenticated`, `forbidden`, `origin-not-allowed`, `not-found`, `validation` (+`field`, +`fieldErrors` ở thân nhiều trường), `version-conflict` (+ `error.current` mới ở nội dung trang chủ / bảng size), `duplicate`, `rate-limited`, `idempotency-conflict`, `not-returnable`, `return-window-closed`, `return-exists`, `invalid-transition`, `invalid-image`, `unavailable`.
    - **Giới hạn tần suất (`429 rate-limited` + `Retry-After` + `retryAfterSeconds`):** gửi đánh giá 5 / giờ / tài khoản; ghi wishlist (`PUT`, `DELETE`, `merge`) 60 / phút / tài khoản (riêng, không chung bộ 30 / 60 giây của `/account/**` khác); trả hàng vãng lai: tạo 5 / giờ / grant (`n2f_oa`) và 10 / giờ / IP, ảnh 30 / giờ / grant và 60 / giờ / IP, dự kiến / huỷ / xem ảnh dùng bộ đếm đơn hiện có (120 / 60 giây); đọc công khai (`reviews`, `recommendations`, `content`, `collections`, `size-charts`) 120 / 60 giây / IP (bộ đếm catalog); eligibility 120 / 60 giây / tài khoản (khách: IP); admin dùng bộ đếm sẵn có (đọc 120, ghi 60 / 60 giây / tài khoản).
    - **Cache công khai:** `GET /products/{productId}/reviews` `public, max-age=10`; `GET /recommendations` `public, max-age=30`; `GET /content/home` `public, max-age=60`; `GET /size-charts/{category}` `public, max-age=60` (ĐỔI từ 3600 để khách thấy bản mới <= 60 giây, BR-CMS-03); `GET /collections*` `public, max-age=60`; `GET /products*` giữ `public, max-age=10`. Không `Set-Cookie`, không `401`, cookie gửi kèm bị bỏ qua. `GET /reviews/eligibility`, mọi `/account/**`, mọi `/admin/**`: `no-store`.
    - **Giá hiệu lực (BR-PROMO-02, 03, 04; MỘT hàm `effectivePrice(product, T)` dùng ở mọi nơi):** đợt giảm của sản phẩm = (`salePrice`, `saleStartsAt`, `saleEndsAt`); "đang chạy" khi `saleStartsAt <= T <= saleEndsAt` với T = giờ máy chủ lúc xử lý (không tác vụ nền, không cache giá). Đang chạy: `price` trả về = `salePrice`, `compareAtPrice` = `price` gốc (đè giá gạch nhập tay), `discountPercent` = floor((1 - salePrice / price gốc) x 100), `saleEndsAt` hiển thị. Ngoài đợt: `price` gốc, `compareAtPrice` nhập tay như cũ, không có `discountPercent` / `saleEndsAt`. Áp dụng thống nhất cho: `GET /products` (lọc `maxPrice`, sắp `price-asc` / `price-desc`, `sale=true`), `GET /products/{slug}`, `GET /recommendations`, giỏ (`unitPrice` / `compareAtPrice` của dòng), `POST /checkout/quote`, `POST /orders` (`unit_price` = giá hiệu lực LÚC ĐẶT, `compare_at_price` của dòng = giá gốc khi trong đợt; đơn đã đặt KHÔNG đổi khi hết đợt, trả hàng / doanh thu dùng `unit_price` đã lưu), "đang giảm" của `excludeSaleItems` (= trong đợt HOẶC `compareAtPrice` > `price`). Giá đổi giữa báo giá và đặt đơn: cơ chế `price-changed` sẵn có (Slice 3), không đặt ngầm.
    - **Đợt giảm (BR-PROMO-01, 05):** `salePrice` nguyên, `1.000 <= salePrice < price`; ngày bắt đầu = 00:00:00 giờ VN, ngày kết thúc = 23:59:59 giờ VN (gồm cả ngày đó), tối đa 90 ngày (ngày kết thúc <= bắt đầu + 89), `saleEndsAt >= saleStartsAt`. Ở `PUT /admin/products/{id}`: khoá vắng = giữ nguyên đợt; cả ba = `null` = gỡ đợt; cả ba có giá trị = đặt (ghi đè đợt cũ); thiếu một hoặc sai khoảng -> `422` theo trường. Sửa `price` làm `salePrice >= price` mới -> `422`, `field: salePrice`. Cột có CHECK ở DB làm lưới an toàn.
    - **Đã đổi ở contract cũ (đều cộng thêm trừ mục 1, 2, 3):** (1) `GET /products/{productId}/reviews`: từ "luôn `200 []`" sang trang dữ liệu thật; sản phẩm không `ACTIVE` / không có -> `404`. (2) BR-CAT-17 thôi áp cho đánh giá ở FE khi `reviewsMode = http` ("Báo khi có hàng" vẫn ẩn). (3) `GET /size-charts/{category}` `max-age` 3600 -> 60. (4) `Product` thêm `rating`, `discountPercent`, `saleEndsAt`; `price` / `compareAtPrice` là giá hiệu lực; `GET /products` thêm `sale`. (5) `AdminProduct*` thêm `salePrice`, `saleStartsAt`, `saleEndsAt`, `saleState`. (6) `AdminReturn` / `AdminReturnSummary` thêm `source`; `AdminOrderSummary.returnPending` (Should) chốt. (7) `Order.canReturn` / `returnDeadline` / `return` có cả cho đơn khách vãng lai xem bằng `n2f_oa`. (8) 5 operation `/orders/{orderCode}/return*` từ draft thành locked, quyền CHỈ `n2f_oa` (bỏ nhánh `n2f_sid`: chủ đơn thành viên dùng `/account/**`; đơn thuộc tài khoản thành viên qua grant -> `404`). (9) `ErrorCode` thêm 3 mã, `ErrorResponse.error` thêm `current`. (10) `SizeChart` thêm `updatedAt`.
    - **Không có (Won't):** sửa / xoá đánh giá của khách, ảnh / video / "hữu ích" cho đánh giá, đánh giá của khách vãng lai, thư mời đánh giá; thống kê / chia sẻ wishlist; ML / cá nhân hoá / "xem gần đây"; thêm / xoá / đổi mã Moment; nháp / xem trước / lịch đăng nội dung; mua X tặng Y, bậc số lượng, flash sale, mã tự áp, nhiều đợt / sản phẩm, giá theo biến thể. `PUT` / `DELETE` ngoài danh sách -> `404 not-found`.
