        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /checkout/quote:
    post:
      tags: [checkout]
      operationId: quoteCheckout
      summary: Báo giá phía máy chủ (BR-CART-08, BR-CHK-10, BR-VOU-05..08)
      description: |
        Dùng cho cả làm tươi giỏ khách (không cần địa chỉ) lẫn checkout. Không đổi dữ liệu, không giữ hàng, không trừ lượt voucher. Cần `X-Requested-With` vì là `POST` có body.
        - Giá, tồn, trạng thái bán lấy từ DB; mọi giá trong body bị bỏ qua (AC-CHK-10). Mỗi dòng trả `effectiveQuantity = min(quantity, 5, tồn)`; `pricing` tính trên `effectiveQuantity` (dòng hết hàng / ngừng bán = 0).
        - Vượt hạn mức **cấu trúc** (hơn 30 dòng, hoặc tổng `effectiveQuantity` quá 20) -> `422 validation`, `field: items` (AC-CART-05).
        - `voucherCodes` tối đa 2 mã (1 mã giảm + 1 mã free-ship; hai mã cùng loại thì mã đứng sau thay mã đứng trước). Mã bị từ chối **không** làm hỏng báo giá: nằm trong `rejectedVouchers` kèm `reason`, `pricing` tính không có mã đó (BR-VOU-08). Mã không tồn tại cộng vào bộ đếm chống dò (BR-VOU-09).
        - Chưa có `address`: `shipping.addressRequired = true`; phí vẫn tính theo mức đồng giá nhưng FE hiện "tính sau khi nhập địa chỉ" (BR-CHK-06, CHK-PAY-02).
        - `contact.phone` / `contact.email` dùng để nhận diện khách vãng lai khi kiểm lượt riêng của mã và điều kiện COD; thành viên dùng tài khoản.
        - Giới hạn: 120 yêu cầu / 60 giây / IP (chung nhóm với giỏ và kiểm mã).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Báo giá. AC-CART-08..10, AC-CHK-10, AC-VOU-01, 06, 07.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /vouchers/check:
    post:
      tags: [voucher]
      operationId: checkVoucher
      summary: Kiểm một mã giảm giá trên đơn hiện tại (BR-VOU-03, 04, 09)
      description: |
        Áp thử `code` lên các `items` (cùng ngữ nghĩa với `quote`) cùng các mã đã áp (`voucherCodes`). Mã không đạt **không** là lỗi HTTP: `200` với `result` là `VoucherRejection` để FE giữ nguyên mã khách gõ. `quote` là báo giá sau khi áp (có mã nếu đạt, không có nếu không đạt). Không trừ lượt.
        Kiểm theo thứ tự BR-VOU-03 và dừng ở điều kiện đầu tiên không đạt (AC-VOU-03). Mã không tồn tại tính vào bộ đếm 10 lần / 15 phút / IP; vượt -> `429 rate-limited` (`retryAfterSeconds` <= 900) kể cả cho mã đúng (AC-VOU-11); 9 lần sai chưa khoá.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, items]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 1, maxLength: 40, description: 'Server trim, bỏ khoảng trắng, chuyển chữ hoa. Dài hơn 20 ký tự sau chuẩn hoá = không tồn tại.' }
                items: { $ref: '#/components/schemas/QuoteItems' }
                voucherCodes: { $ref: '#/components/schemas/VoucherCodes' }
                address: { $ref: '#/components/schemas/QuoteAddress' }
                contact: { $ref: '#/components/schemas/QuoteContact' }
      responses:
        '200':
          description: Kết quả kiểm mã và báo giá mới.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [result, quote]
                additionalProperties: false
                properties:
                  result:
                    oneOf:
                      - $ref: '#/components/schemas/VoucherApplied'
                      - $ref: '#/components/schemas/VoucherRejection'
                  quote: { $ref: '#/components/schemas/Quote' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Giỏ của thành viên, đã làm tươi giá / tồn (BR-CART-08, 09)
      description: |
        Chỉ đọc, không sửa giỏ. Giỏ không sửa trong 30 ngày (tính từ lần sửa cuối) bị coi là rỗng và xoá (AC-CART-12). Mỗi dòng trả `maxQuantity` và `availability` hiện tại; FE tự so với bản chụp giá cục bộ để hiện "Giá đã thay đổi từ X thành Y" (máy chủ không lưu giá đã thấy). Giới hạn: 120 yêu cầu / 60 giây / IP.
      security:
        - storefrontSession: []
      responses:
        '200':
          description: Giỏ.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/lines:
    post:
      tags: [cart]
      operationId: addCartLine
      summary: Thêm vào giỏ (BR-CART-01..03)
      description: |
        Thêm lại phiên bản đã có thì **cộng** vào dòng cũ, cắt ở `min(5, tồn)` (`notice` ghi lại việc cắt). Dòng thứ 31 -> `422 validation` (`field: variantId`, "Giỏ hàng tối đa 30 sản phẩm khác nhau.", AC-CART-04). Phiên bản không bán / hết hàng -> `409 stock-changed` (không thêm).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              additionalProperties: false
              properties:
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/StockChanged' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/lines/{variantId}:
    put:
      tags: [cart]
      operationId: setCartLineQuantity
      summary: Đặt số lượng một dòng (BR-CART-02)
      description: |
        Đặt (không cộng) số lượng; vượt `min(5, tồn)` thì cắt và `notice` ghi `stock-limit` / `per-variant-limit`. Dòng không có trong giỏ -> `404 not-found`. Muốn xoá dùng `DELETE`.
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [cart]
      operationId: removeCartLine
      summary: Xoá một dòng (BR-CART-02). Hoàn tác 5 giây là việc của FE bằng cách thêm lại đúng số lượng.
      description: Dòng không có trong giỏ vẫn `200` (idempotent).
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/lines/{variantId}/change-variant:
    post:
      tags: [cart]
      operationId: changeCartLineVariant
      summary: Đổi màu / size trong cùng sản phẩm (BR-CART-05)
      description: |
        `toVariantId` phải cùng sản phẩm với dòng hiện tại và còn hàng, nếu không `422 validation` (`field: toVariantId`) / `409 stock-changed`. Đã có dòng `toVariantId` thì gộp: số lượng = tổng hai dòng cắt theo `min(5, tồn)`; `notice.code = merged` (kèm `adjustedTo` khi bị cắt). Nguyên tử trong một giao dịch.
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toVariantId]
              additionalProperties: false
              properties:
                toVariantId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StockChanged' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/merge:
    post:
      tags: [cart]
      operationId: mergeGuestCart
      summary: Gộp giỏ khách vào giỏ tài khoản sau đăng nhập (BR-CART-10)
      description: |
        Bắt buộc `Idempotency-Key`: gửi lại sau mất kết nối không nhân đôi (AC-CART-15). `lines` là phần **cần cộng thêm** (FE chỉ gửi phần khách thêm lúc chưa đăng nhập, không gửi lại phần đã đồng bộ từ máy chủ, AC-CART-18). Cùng phiên bản -> cộng số lượng cắt theo `min(5, tồn)`; khác -> thêm dòng; phiên bản không còn bán bị bỏ qua (`skippedVariantIds`). Vượt 30 dòng: máy chủ xoá các dòng có `updatedAt` cũ nhất cho tới khi còn 30 và trả chúng ở `evicted` để FE chuyển vào Yêu thích (AC-CART-14). `mergedVariantIds` là các dòng vừa mang sang (FE chỉ chọn chúng, AC-CART-13); `addedCount` = số dòng vừa mang sang, FE báo một lần "Đã thêm N sản phẩm từ giỏ hàng trước khi đăng nhập.".
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              additionalProperties: false
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    required: [variantId, quantity]
                    additionalProperties: false
                    properties:
                      variantId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: 'Giỏ sau khi gộp (cũng là phản hồi của lần gửi lại cùng khoá, kèm header `Idempotency-Replayed` = true).'
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema:
                type: object
                required: [cart, mergedVariantIds, skippedVariantIds, addedCount, evicted]
                additionalProperties: false
                properties:
                  cart: { $ref: '#/components/schemas/CartView' }
                  mergedVariantIds: { type: array, items: { type: string, format: uuid } }
                  skippedVariantIds: { type: array, items: { type: string, format: uuid } }
                  addedCount: { type: integer, minimum: 0 }
                  evicted:
                    type: array
                    items:
                      type: object
                      required: [variantId, productId, quantity]
                      additionalProperties: false
                      properties:
                        variantId: { type: string, format: uuid }
                        productId: { type: string, format: uuid }
                        quantity: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders:
    post:
      tags: [order]
      operationId: placeOrder
      summary: Đặt hàng (BR-CHK-12..18, 20, 21; BR-VOU-10..12)
      description: |
        Công khai: khách vãng lai đặt được; cookie phiên sai / hết hạn / bị thu hồi -> đơn khách, không `401` (AC-CHK-02). Phiên member hợp lệ -> đơn gắn tài khoản; đơn khách trùng email / SĐT với tài khoản **không** tự gắn (BR-CHK-27).
        Một giao dịch DB duy nhất: kiểm lại mọi thứ -> trừ lượt voucher -> trừ tồn từng dòng (chỉ khi còn đủ) -> tạo đơn + dòng đơn chụp giá -> xoá khỏi giỏ thành viên đúng các dòng đã mua. Thứ tự lỗi xem "Quy ước Slice 3". Thất bại ở bất kỳ bước nào: không đơn, không trừ tồn, không trừ lượt.
        Trạng thái ban đầu: COD -> `to_ship` + `pending`; `bank-transfer` -> `to_pay` + `pending` kèm `paymentDueAt` = lúc đặt + 30 phút (không gia hạn). `bank-transfer` chỉ khi `bankTransferEnabled` `[giả định chờ Thắng]`.
        Email xác nhận gửi nền sau khi đơn commit; email lỗi không bao giờ làm đơn thất bại (BR-CHK-28). Giới hạn: 10 yêu cầu / 10 phút / IP.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - storefrontSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: Đơn mới tạo.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReceipt' }
        '200':
          description: 'Gửi lại cùng `Idempotency-Key` + cùng nội dung trong 24 giờ: đúng đơn đã tạo (trạng thái hiện tại), không tác dụng phụ.'
          headers:
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReceipt' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409':
          description: |
            Một trong: `stock-changed` (kèm `stockIssues`, AC-CHK-13), `voucher-changed` (kèm `removedVoucherCodes`, AC-VOU-12/13), `price-changed` (AC-CHK-12), `idempotency-conflict` (AC-CHK-18), `possible-duplicate` (kèm `existingOrderCode`, Should, AC-CHK-20). Trừ `idempotency-conflict` và `possible-duplicate`, luôn kèm `quote` mới nhất.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`validation` (kèm `field`, ví dụ `contact.phone`, `address.street`, `acceptedTerms`, `paymentMethod`, `items`, `Idempotency-Key`) hoặc `invalid-address` (`field: address.wardCode`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [order]
      operationId: listMyOrders
      summary: Đơn của thành viên, mới nhất trước (BR-CHK-27)
      description: Chỉ đơn gắn với người đang đăng nhập (đơn khách trùng email không hiện). 10 đơn mỗi lần "Xem thêm". Phiên hỏng -> `401 unauthenticated` (AC-CHK-33).
      security:
        - storefrontSession: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Một trang đơn (sắp `placedAt` giảm dần, hoà bằng mã đơn).
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders/lookup/codes:
    post:
      tags: [order]
      operationId: requestOrderLookupCode
      summary: Khách gửi mã đơn + email để nhận OTP tra cứu (BR-CHK-26)
      description: |
        Luôn `200` cùng nội dung dù mã đơn / email có khớp hay không; chỉ gửi OTP khi khớp (chống dò đơn, AC-CHK-31). OTP 8 số, hiệu lực 10 phút, gửi lại sau 60 giây, hạn mức gửi như BR-AUTH-04..09 `[giả định chờ Thắng]`; lưu băm trong `auth_action_tokens` (`purpose = guest_order_lookup`). Email so sánh sau trim + chữ thường. Giới hạn: 10 yêu cầu / 15 phút / IP (chung với `lookup/verify`).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderCode, email]
              additionalProperties: false
              properties:
                orderCode: { $ref: '#/components/schemas/OrderCodeInput' }
                email: { $ref: '#/components/schemas/Email' }
      responses:
        '200':
          description: Đã xử lý (có thể không gửi thư).
          content:
            application/json:
              schema:
                type: object
                required: [resendAfterSeconds]
                additionalProperties: false
                properties:
                  resendAfterSeconds: { type: integer, minimum: 0, maximum: 60 }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders/lookup/verify:
    post:
      tags: [order]
      operationId: verifyOrderLookup
      summary: Nhập OTP để xem đơn khách (BR-CHK-26)
      description: |
        Đúng cả ba (mã đơn + email + OTP) -> `200` kèm đơn và `Set-Cookie: n2f_oa` (HttpOnly, SameSite=Lax, `Path=/api/orders`, `Max-Age=1800`; gắn đúng đơn này; cookie mới thay cookie cũ). OTP chỉ dùng một lần. Sai bất kỳ thứ nào -> **cùng** `404 not-found` với thông điệp "Không tìm thấy đơn hàng phù hợp" (không phân biệt, AC-CHK-31). Sai OTP nhiều lần: khoá theo email như BR-AUTH-08 (`429 code-locked`). Mã đơn, email, OTP chỉ nằm trong body, không nằm trong URL; phản hồi không có `userId`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderCode, email, code]
              additionalProperties: false
              properties:
                orderCode: { $ref: '#/components/schemas/OrderCodeInput' }
                email: { $ref: '#/components/schemas/Email' }
                code: { $ref: '#/components/schemas/Code' }
      responses:
        '200':
          description: Chi tiết đơn.
          headers:
            Set-Cookie: { schema: { type: string, description: '`n2f_oa=<token>; HttpOnly; SameSite=Lax; Path=/api/orders; Max-Age=1800[; Secure]`' } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderCode}:
    get:
      tags: [order]
      operationId: getOrder
      summary: Chi tiết một đơn (chủ đơn hoặc khách đã xác minh OTP, BR-CHK-26, 27)
      description: 'Quyền xem: xem "Quy ước Slice 3". Đơn `to_pay` đã quá `paymentDueAt` được máy chủ huỷ ngay khi đọc (không chờ tác vụ nền) rồi trả `cancelled`.'
      security:
        - storefrontSession: []
        - orderAccess: []
      parameters:
        - { name: orderCode, in: path, required: true, schema: { $ref: '#/components/schemas/OrderCodeInput' } }
      responses:
        '200':
          description: Chi tiết đơn.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderCode}/cancel:
    post:
      tags: [order]
      operationId: cancelOrder
      summary: Khách huỷ đơn (BR-CHK-23, BR-VOU-12)
      description: |
        Được huỷ khi `to_pay` (bất kỳ lúc nào) hoặc `to_ship` `[giả định chờ Thắng]`; trạng thái khác (`to_receive`, `completed`, `cancel_requested`, đã `cancelled`) -> `409 not-cancellable` và không hoàn gì thêm (AC-CHK-16, 29). Một giao dịch: `status = cancelled`, `cancelledBy = customer`, trả tồn đúng số đã trừ (đúng một lần), trả lượt voucher nếu mã còn hạn (AC-VOU-15). `paymentStatus` giữ nguyên (đơn đã `paid` được kế toán hoàn thủ công, email báo 1-3 ngày làm việc). Gửi email "đơn đã huỷ" nền. Quyền: chủ đơn hoặc cookie `n2f_oa` (trong 30 phút).

        **Slice 4 (locked, đổi hành vi; S4-Q1), BR-ADM-29:** từ lát 4.5, khách ở `to_ship` **không** huỷ ngay: đơn sang `cancel_requested` (`200` trả `Order` với `status = cancel_requested`, `cancelRequest.outcome = pending`); lưu thời điểm + `reason` (<= 250 ký tự, dài hơn -> `422 validation`); tồn, lượt voucher, `paymentStatus` giữ nguyên; không có `cancelledBy`. Đang `cancel_requested`, hoặc yêu cầu đã từng bị từ chối (mỗi đơn một yêu cầu, S4-Q6), hoặc `to_receive` / `completed` / `cancelled` -> `409 not-cancellable`. `to_pay` vẫn huỷ thẳng như trên. Khách yêu cầu huỷ và nhân viên bàn giao cùng lúc: một bên thắng, bên kia `409` (`not-cancellable` ở phía khách). Trước lát 4.5, `to_ship` vẫn huỷ thẳng; phát hành cùng lát 4.5 với `ASSUMPTIONS.toShipCancelMode = 'request'` (cờ `'direct'` để lật nếu Thắng đổi ý). Khách gọi hotline xin huỷ đơn `to_ship` thì nhân viên huỷ lý do `customer_request` (không qua yêu cầu huỷ).
      parameters:
        - { name: orderCode, in: path, required: true, schema: { $ref: '#/components/schemas/OrderCodeInput' } }
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
        - orderAccess: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 250, description: 'Lý do (tuỳ chọn), lưu vào lịch sử đơn.' }
      responses:
        '200':
          description: 'Đơn sau khi huỷ (`to_pay`), hoặc đơn ở `cancel_requested` (`to_ship`, Slice 4).'
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotCancellable' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderCode}/payment:
    get:
      tags: [order]
      operationId: getOrderPayment
      summary: Trang thanh toán chuyển khoản QR của một đơn (BR-CHK-21)
      description: |
        Chỉ cho đơn `bank-transfer`; chủ đơn hoặc cookie `n2f_oa`. Khi `bankTransferEnabled = false` hoặc đơn là COD -> `404 not-found`. Trả `status`: `awaiting` (đang chờ, còn hạn), `paid` (đã nhận đủ), `expired` (hết 30 phút, đơn đã `cancelled`). FE poll mỗi 5 giây tới khi khác `awaiting`. `transferContent` = mã đơn.
      security:
        - storefrontSession: []
        - orderAccess: []
      parameters:
        - { name: orderCode, in: path, required: true, schema: { $ref: '#/components/schemas/OrderCodeInput' } }
      responses:
        '200':
          description: Phiên thanh toán.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders/{orderCode}/payment/simulate:
    post:
      tags: [order]
      operationId: simulateOrderPayment
      summary: Giả lập tiền về cho đơn chuyển khoản (chỉ khi máy chủ bật PAYMENT_SIMULATOR)
      description: |
        Chế độ demo cho đồ án, không liên kết ngân hàng. Tắt (mặc định) -> `404 not-found`. Quyền như `GET /orders/{orderCode}/payment` (chủ đơn hoặc cookie `n2f_oa`).
        `pay` = chuyển đúng số còn thiếu, `pay-partial` = một nửa số còn thiếu (làm tròn xuống 1.000 ₫), cả hai đi qua đúng luồng đối soát của webhook SePay (`payment_transactions.provider = simulator`); `expire` = hết hạn ngay (đơn huỷ, hoàn tồn). Đơn không còn `awaiting` thì không làm gì, trả phiên hiện tại.
      security:
        - storefrontSession: []
        - orderAccess: []
      parameters:
        - { name: orderCode, in: path, required: true, schema: { $ref: '#/components/schemas/OrderCodeInput' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: false
              properties:
                action: { type: string, enum: [pay, pay-partial, expire] }
      responses:
        '200':
          description: Phiên thanh toán sau khi giả lập.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /payments/sepay/webhook:
    post:
      tags: [order]
      operationId: sepayWebhook
      summary: SePay báo tiền về tài khoản nhận (BR-CHK-21) — chỉ máy chủ SePay gọi
      description: |
        Không phải API cho FE. Đứng trước kiểm Origin / CSRF, không cookie. Xác thực `Authorization: Apikey <SEPAY_WEBHOOK_KEY>` (so sánh hằng thời gian); thiếu khoá cấu hình thì mọi yêu cầu `401`.
        Mã đơn tách bằng `/N2F\d{10}/i` từ `code` rồi `content` + `description`. Idempotent theo `id` (SePay gửi lại không cộng tiền hai lần).
        Đơn `to_pay` nhận đủ (cộng dồn các lần) -> `paid` + `to_ship`, sự kiện `payment_received`, email "Đã nhận thanh toán"; thiếu -> giữ `to_pay`, `GET /orders/{orderCode}/payment` trả `shortfall`; thừa / sau khi đã đủ / sau khi huỷ -> ghi sự kiện để kế toán hoàn tay (không khôi phục đơn đã huỷ). Không khớp đơn -> lưu `unmatched`.
        Luôn `200 {success:true}` khi đã ghi nhận (kể cả trùng, không khớp, tiền ra) để SePay không gửi lại; lỗi máy chủ `5xx` để SePay thử lại.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, transferType, transferAmount]
              properties:
                id: { oneOf: [{ type: integer }, { type: string, pattern: '^\d{1,30}$' }] }
                gateway: { type: [string, 'null'] }
                transactionDate: { type: [string, 'null'], description: '"YYYY-MM-DD HH:mm:ss" giờ Việt Nam.' }
                accountNumber: { type: [string, 'null'] }
                code: { type: [string, 'null'] }
                content: { type: [string, 'null'] }
