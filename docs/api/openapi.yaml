      description: |
        Slice 9, status: locked (khách vãng lai: locked từ Slice 10, 2026-11-13). **Thân yêu cầu là byte thô của đúng 1 tệp** (như `POST /admin/uploads/product-images`; không multipart), `Content-Type` bất kỳ trong `image/jpeg`, `image/png`, `image/webp`, `application/octet-stream`. Định dạng xác định theo NỘI DUNG (magic bytes). Giới hạn: <= 5 MB, cạnh ngắn >= 200 px, cạnh dài <= 8.000 px; sai -> `422 invalid-image` `reason` = `format` | `size` | `dimensions` (thứ tự kiểm: size, format, dimensions). Gỡ metadata (EXIF / GPS / XMP / COM) trước khi lưu; khoá lưu do máy chủ sinh (`rp-<32 hex>.<ext>`). Ảnh lưu ở **kho RIÊNG TƯ** (không phải bucket công khai `product-images`; không bao giờ qua `GET /media/{id}`). Giới hạn 30 tệp / giờ / tài khoản (`429 rate-limited`; đếm mọi lần gọi tới được thân). Ảnh chưa gắn vào yêu cầu chỉ gắn được trong 24 giờ, bởi chính người tải; không tự xoá theo lịch.
