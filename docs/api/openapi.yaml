      x-status: locked
      summary: Thành viên gửi yêu cầu trả hàng cho đơn của mình (BR-RET-09..18, 21, 30)
      description: |
        Slice 9, status: locked (khách vãng lai: locked từ Slice 10, 2026-11-13). Chỉ phiên `n2f_sid` của CHỦ đơn; đơn không có hoặc của người khác -> `404 not-found` (không phân biệt). Bắt buộc `Idempotency-Key`: cùng khoá + cùng nội dung -> `200` kèm `Idempotency-Replayed: true`, không tạo thêm; cùng khoá khác nội dung -> `409 idempotency-conflict`; thiếu / sai dạng -> `422`, `field: Idempotency-Key`. Giới hạn 10 yêu cầu / giờ / tài khoản (đếm mọi lần gọi tới được thân), vượt -> `429 rate-limited`.

        **Thứ tự kiểm:** phiên 401 -> `X-Requested-With` 403 -> giới hạn 429 -> `Idempotency-Key` 422 -> thân (MỌI lỗi theo trường một lần, `error.fieldErrors`, `field` phẳng như dưới) 422 -> đơn 404 -> giao dịch (khoá dòng đơn): điều kiện đơn `409 not-returnable` (chưa `completed`, thiếu `deliveredAt`, `paymentStatus` khác `paid`, kể cả `refunded` / `partially_refunded`), quá hạn `409 return-window-closed` (hạn = 23:59:59 giờ VN của ngày thứ 30 kể từ ngày giao, ngày giao = ngày 0, máy chủ tính), đã có yêu cầu không-`cancelled` `409 return-exists` (ràng buộc duy nhất ở DB; 20 yêu cầu đồng thời: đúng 1 thành công) -> kiểm theo dữ liệu (`lines`, `photos`, tiền) 422.

        **Trường thân (phẳng):** `lines` (>= 1, mỗi dòng `variantId` của đơn + `quantity` nguyên 1..số đã mua, không trùng; sai -> `field: lines`); `reason` (6 mã, sai / thiếu -> `field: reason`); `detail` (NFC, cắt hai đầu, không ký tự điều khiển ngoài xuống dòng; lỗi của shop bắt buộc 10..500, lỗi của khách tuỳ chọn <= 500; -> `field: detail`); `conditionAck` (lý do lỗi của khách bắt buộc `true`, -> `field: conditionAck`); `photos` (mảng id ảnh đã tải bằng `POST /account/return-photos`: lỗi của shop bắt buộc >= 1, tối đa 5, ảnh phải do CHÍNH tài khoản này tải trong 24 giờ qua và chưa gắn yêu cầu nào; sai -> `field: photos`); `bank` (2..60), `accountNumber` (bỏ khoảng trắng còn 6..19 chữ số), `accountName` (2..50, chữ cái và khoảng trắng, lưu IN HOA): BẮT BUỘC khi đơn COD, đơn `bank-transfer` thì BỎ QUA (không lưu). Trường lạ bị loại.

        Tiền theo BR-RET-30 trên số lượng đã chọn (`amount` dự kiến, `final = false`); tiền hàng trừ phí gửi trả <= 0 (lý do lỗi của khách) -> `422`, `field: lines`. Số tài khoản không bao giờ có trong phản hồi (chỉ ngân hàng, 4 số cuối, tên). Thêm đúng 1 sự kiện đơn `return_requested` và gửi email "Đã nhận yêu cầu trả hàng".
      security:
        - storefrontSession: []
