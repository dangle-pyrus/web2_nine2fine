    get:
      tags: [recommendations]
      operationId: listRecommendations
      x-status: locked
      summary: Gợi ý sản phẩm cho PDP (1 sản phẩm) và giỏ (nhiều sản phẩm) bằng một hàm xác định (BR-REC-01..03)
      description: |
        Slice 10 (lát 10.6), status: locked. Công khai chỉ đọc như catalog: không cookie, không `401`, không `Set-Cookie`, KHÔNG dùng dữ liệu người dùng (khách và thành viên nhận cùng kết quả), `Cache-Control: public, max-age=30` (thay đổi tồn kho / `sales_rank` phản ánh <= 30 giây). `POST` / `PUT` / `PATCH` / `DELETE` -> `404 not-found`. Giới hạn catalog 120 / 60 giây / IP.

        **Đầu vào:** `ids` = danh sách id (UUID) HOẶC slug sản phẩm cách nhau dấu phẩy, 0..10 phần tử sau khi bỏ phần rỗng (> 10 -> `422`, `field: ids`); id / slug lạ, sản phẩm không `ACTIVE` bị BỎ QUA. Không còn id hợp lệ (vắng, rỗng, hoặc toàn id lạ) = như giỏ rỗng -> danh sách bán chạy. `limit` nguyên 1..8, mặc định 4 (0, 9, không phải số -> `422`, `field: limit`).

        **MỘT hàm (cùng dữ liệu + cùng tham số -> cùng kết quả và thứ tự, kể cả giữa các tiến trình):** (A) cho một sản phẩm X: loại X, loại sản phẩm không `ACTIVE`, loại sản phẩm hết hàng ở MỌI biến thể; lấy lần lượt đến đủ `limit`, không trùng: (1) cùng danh mục VÀ >= 1 Moment chung, xếp số Moment chung giảm; (2) cùng danh mục còn lại; (3) cùng Moment khác danh mục; (4) bán chạy toàn shop. Trong mỗi bước xếp `salesRank` tăng rồi `slug` tăng. (B) cho nhiều sản phẩm (giỏ): mỗi sản phẩm sinh danh sách (A) 8 mục; điểm = số danh sách chứa sản phẩm đó; xếp điểm giảm, rồi `salesRank` tăng, rồi `slug` tăng; loại mọi sản phẩm đang trong `ids`; cắt `limit`. (C) rỗng: bán chạy (`salesRank` tăng, `slug`). Kết quả ít hơn `limit` thì trả ít hơn (KHÔNG bù sản phẩm sai điều kiện), có thể `items: []` (FE ẩn cả khối). Should (BR-REC-05): bước 0 "mua cùng" (>= 3 đơn `completed` chung trong 365 ngày) và "cùng bộ sưu tập" trước bước (1); nếu chưa làm thì bỏ qua, thứ tự còn lại không đổi.
        Phần tử dùng cùng `Product` của catalog (giá hiệu lực, `discountPercent`, `rating`, nhãn).
      parameters:
        - { name: ids, in: query, schema: { type: string, maxLength: 800 }, description: 'UUID hoặc slug, cách nhau dấu phẩy, tối đa 10 phần tử. Vắng = bán chạy.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 8, default: 4 } }
      responses:
        '200':
          description: Danh sách gợi ý (có thể rỗng).
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=30' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationList' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
