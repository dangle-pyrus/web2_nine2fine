components:
  securitySchemes:
    storefrontSession:
      type: apiKey
      in: cookie
      name: n2f_sid
      description: Token phiên mờ, HttpOnly, SameSite=Lax, Path=/api.
    adminSession:
      type: apiKey
      in: cookie
      name: n2f_asid
      description: Token phiên admin mờ, HttpOnly, SameSite=Lax, Path=/api/admin.
    orderAccess:
      type: apiKey
      in: cookie
      name: n2f_oa
      description: 'Quyền xem / huỷ đúng 1 đơn khách trong 30 phút sau khi nhập đúng OTP (`POST /orders/lookup/verify`). HttpOnly, SameSite=Lax, Path=/api/orders. Slice 3.'
  parameters:
    AddressId:
      name: addressId
      in: path
      required: true
      description: UUID của địa chỉ; sai dạng -> `404 not-found`.
      schema: { type: string }
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, const: n2f }
      description: Bắt buộc ở mọi yêu cầu ghi (lớp CSRF 3). Thiếu -> `403 origin-not-allowed`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
      description: 'Khoá một lần thao tác (BR-CHK-15), sinh một lần cho mỗi lượt checkout và dùng lại khi Thử lại. Hiệu lực 24 giờ. Thiếu / sai dạng -> `422 validation`, `field: Idempotency-Key`.'
    AdminOrderCode:
      name: orderCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrderCodeInput' }
      description: 'Slice 4. Mã đơn, chữ thường và `#` được chấp nhận; sai dạng hoặc không có -> `404 not-found`.'
    AdminIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
      description: 'Slice 4. Tuỳ chọn. FE sinh một khoá cho mỗi ý định bấm nút (dùng lại khi "Thử lại" cùng thao tác). Cùng khoá + cùng người + cùng đường dẫn + cùng body trong 24 giờ -> `200` kết quả lần đầu (`Idempotency-Replayed: true`); khác nội dung -> `409 idempotency-conflict`. Sai dạng -> `422 validation`, `field: Idempotency-Key`.'
    ProductId:
      name: productId
      in: path
      required: true
      description: 'Slice 6. UUID sản phẩm; sai dạng hoặc không có -> `404 not-found`.'
      schema: { type: string }
    VariantId:
      name: variantId
      in: path
      required: true
      description: 'Slice 6. UUID biến thể; sai dạng hoặc không có -> `404 not-found`.'
      schema: { type: string }
    PromotionId:
      name: promotionId
      in: path
      required: true
      description: 'Slice 6. UUID voucher; sai dạng hoặc không có -> `404 not-found`.'
      schema: { type: string }
    StockIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
      description: 'Slice 6, BẮT BUỘC cho điều chỉnh tồn (BR-INV-33). FE sinh một khoá cho mỗi ý định, dùng lại khi "Thử lại". Cùng khoá + cùng người + cùng đường dẫn + cùng body trong 24 giờ -> `200` kết quả lần đầu (`Idempotency-Replayed: true`), không áp lần hai; khác nội dung -> `409 idempotency-conflict`. Thiếu / sai dạng -> `422 validation`, `field: Idempotency-Key`.'
    CustomerId:
      name: customerId
      in: path
      required: true
      description: 'Slice 7. UUID khách (`role = member`); sai dạng, không có, hoặc là staff / admin -> `404 not-found`.'
      schema: { type: string }
    StaffId:
      name: staffId
      in: path
      required: true
      description: 'Slice 7. UUID nhân viên (`role` in `staff`, `admin`); sai dạng, không có, hoặc là khách -> `404 not-found`.'
      schema: { type: string }
    AccountId:
      name: accountId
      in: path
      required: true
      description: 'Slice 7. UUID tài khoản bất kỳ (khách hoặc nhân viên); sai dạng hoặc không có -> `404 not-found`.'
      schema: { type: string }
    StaffCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
      description: 'Slice 7, BẮT BUỘC cho tạo nhân viên: FE sinh một khoá cho mỗi ý định, dùng lại khi "Thử lại" để mất mạng giữa chừng không làm lần bấm sau nhận `409 duplicate`. Cùng khoá + cùng người + cùng đường dẫn + cùng nội dung trong 24 giờ -> `200` kết quả lần đầu (`Idempotency-Replayed: true`); khác nội dung -> `409 idempotency-conflict`. Thiếu / sai dạng -> `422 validation`, `field: Idempotency-Key`.'
    ReturnId:
      name: returnId
      in: path
      required: true
      description: 'Slice 9. UUID yêu cầu trả hàng; sai dạng hoặc không có -> `404 not-found`.'
      schema: { type: string }
    ReturnPhotoId:
      name: photoId
      in: path
      required: true
      description: 'Slice 9. UUID ảnh trả hàng; sai dạng, không có, hoặc không có quyền xem -> `404 not-found` (không phân biệt).'
      schema: { type: string }
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: 'Slice 10. UUID đánh giá; sai dạng hoặc không có -> `404 not-found`.'
      schema: { type: string }
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: 'Slice 10 (Should). UUID bộ sưu tập; sai dạng hoặc không có -> `404 not-found`.'
      schema: { type: string }
  headers:
    RetryAfter:
      description: Số giây chờ, bằng `error.retryAfterSeconds`.
      schema: { type: integer, minimum: 1 }
    SetCookieSession:
      description: '`n2f_sid=<token>; HttpOnly; SameSite=Lax; Path=/api; Max-Age=<s>[; Secure]`'
      schema: { type: string }
    SetCookieAdminSession:
      description: '`n2f_asid=<token>; HttpOnly; SameSite=Lax; Path=/api/admin; Max-Age=<s>[; Secure]`'
      schema: { type: string }
    SetCookieCleared:
      description: Cookie phiên tương ứng bị xoá (`Max-Age=0`).
      schema: { type: string }
  responses:
    SessionCreated:
      description: Đăng nhập thành công, hồ sơ công khai + cookie (AC-AUTH-40, 61).
      headers:
        Set-Cookie: { $ref: '#/components/headers/SetCookieSession' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthUser' }
    Validation:
      description: '`validation`, kèm `field` khi gắn được vào một trường (AC-AUTH-02).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    OriginNotAllowed:
      description: '`origin-not-allowed`: thiếu / sai `Origin` hoặc thiếu `X-Requested-With` (AC-AUTH-92).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: '`rate-limited` (AC-AUTH-05, 06).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`not-found`: tài nguyên hoặc đường dẫn không tồn tại. Cũng là phản hồi của mọi route `/api/**` không khai báo (thay cho `validation` cũ).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: '`unavailable`: lỗi máy chủ; không có stack trace, SQL, tên bảng (AC-AUTH-93, 94).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: '`unauthenticated`: không có phiên / quyền xem đơn hợp lệ, hoặc phiên đã hết hạn / bị thu hồi (AC-CHK-33). FE chuyển `/auth/login?returnUrl=...` và giữ giỏ.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    StockChanged:
      description: '`stock-changed`: thiếu hàng hoặc ngừng bán; kèm `stockIssues` cho **mọi** dòng thiếu (BR-CHK-13).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyConflict:
      description: '`idempotency-conflict`: cùng `Idempotency-Key` nhưng nội dung khác trong 24 giờ (AC-CHK-18).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotCancellable:
      description: '`not-cancellable`: đơn không ở trạng thái huỷ được hoặc đã huỷ (AC-CHK-16, 29).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CartMutated:
      description: Giỏ sau thao tác (và ghi chú nếu số lượng bị cắt / gộp).
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema:
            type: object
            required: [cart, notice]
            additionalProperties: false
            properties:
              cart: { $ref: '#/components/schemas/CartView' }
              notice: { oneOf: [{ $ref: '#/components/schemas/CartNotice' }, { type: 'null' }] }
    AdminOrderUpdated:
      description: 'Slice 4. Đơn sau thao tác (dạng admin). Gửi lại cùng `Idempotency-Key` + cùng nội dung: cùng kết quả đầu tiên, header `Idempotency-Replayed: true`, không tác dụng phụ.'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Idempotency-Replayed: { schema: { type: string, const: 'true' }, description: 'Chỉ có khi là bản phát lại.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminOrder' }
    AdminForbidden:
      description: '`forbidden` (phiên admin hợp lệ nhưng thiếu quyền, ví dụ staff huỷ `other`; đơn không đổi, không sự kiện) hoặc `origin-not-allowed` (thiếu / sai `Origin` hoặc `X-Requested-With`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AdminConflict:
      description: |
        Slice 4. Một trong (mọi trường hợp: không đổi dữ liệu, không sự kiện, không email; luôn kèm `currentStatus`):
        - `order-state-changed`: `expectedStatus` khác trạng thái hiện tại; kèm `order` (đơn hiện tại). FE tải lại, báo "Đơn vừa được cập nhật bởi người khác." (BR-ADM-14, 15).
        - `invalid-transition`: bước không hợp lệ ở trạng thái / điều kiện hiện tại (BR-ADM-13), kể cả thao tác lần hai (đã xác nhận, đã xử lý hàng hoàn, đã bàn giao...).
        - `condition-not-met`: đúng trạng thái nhưng thiếu điều kiện (bàn giao đơn cần gọi chưa xác nhận; huỷ `unreachable` chưa có 3 lần gọi liên tiếp trong 24 giờ 00 phút, ví dụ lần cuối cách lần đầu 24 giờ 01 phút).
        - `idempotency-conflict`: cùng `Idempotency-Key` nhưng nội dung khác.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CatalogValidation:
      description: |
        Slice 6. Một trong:
        - `validation` (+ `field`, ví dụ `name`, `price`, `slug`, `variants[2].sku`, `images`, `quantity`, `reason`, `note`, `code`, `totalLimit`, `q`, `limit`).
        - `publish-incomplete` (+ `missing[]`, và `productId` khi đổi hàng loạt): vào `active` mà thiếu điều kiện (BR-INV-14, 15, 21). Không đổi gì.
        - `invalid-image` (+ `reason`: `format` | `size` | `dimensions`) khi tải ảnh (BR-INV-24).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CatalogConflict:
      description: |
        Slice 6. Mọi trường hợp: không đổi dữ liệu, không dòng nhật ký.
        - `duplicate` (+ `field`: `slug`, `code`, `variants[i].sku`).
        - `version-conflict`: `updatedAt` gửi lên khác bản hiện tại (BR-INV-05).
        - `stock-changed` (+ `available`, `reserved`): điều chỉnh kiểu `set` mà `expectedAvailable` khác số hiện tại (BR-INV-33).
        - `product-in-use`: xoá sản phẩm đã từng công khai hoặc đã có đơn (BR-INV-18).
        - `variant-in-use` (+ `sku`): bỏ biến thể đã có dòng đơn (BR-INV-21).
        - `voucher-in-use`: xoá voucher đã có lượt dùng, hoặc đổi loại / giá trị / giảm tối đa của voucher đã dùng (BR-INV-40, 42).
        - `idempotency-conflict`: cùng `Idempotency-Key` nhưng nội dung khác.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AdminProductDetail:
      description: 'Slice 6. Sản phẩm (dạng admin).'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProduct' }
    AdminPromotionDetail:
      description: 'Slice 6. Khuyến mãi (dạng admin).'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminPromotion' }
    AdminInventoryItemUpdated:
      description: 'Slice 6. Dòng tồn kho sau điều chỉnh. Gửi lại cùng `Idempotency-Key` + cùng nội dung: cùng kết quả đầu tiên, header `Idempotency-Replayed: true`, không áp lần hai, không thêm dòng nhật ký.'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Idempotency-Replayed: { schema: { type: string, const: 'true' }, description: 'Chỉ có khi là bản phát lại.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminInventoryItem' }
    UsersValidation:
      description: |
        Slice 7. `validation` (+ `field`: `q`, `tier`, `view`, `sort`, `page`, `limit`, `reason`, `name`, `email`, `role`, `Idempotency-Key`). Không đổi gì, không nhật ký, không thư.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UsersConflict:
      description: |
        Slice 7. Mọi trường hợp: không đổi dữ liệu, không nhật ký, không thư.
        - `duplicate` (+ `field: email`): email đã có ở bất kỳ tài khoản nào (BR-USR-19).
        - `self-change`: admin tự khoá / tự đổi vai trò chính mình (BR-USR-23a).
        - `last-admin`: thao tác sẽ để lại 0 admin hoạt động, gồm cả hai admin thao tác đồng thời (BR-USR-23b, c).
        - `idempotency-conflict`: cùng `Idempotency-Key` nhưng nội dung khác.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AdminCustomerUpdated:
      description: 'Slice 7. Khách sau thao tác (dạng admin, đủ trường). Gửi lại cùng `Idempotency-Key` + cùng nội dung: cùng kết quả đầu, header `Idempotency-Replayed: true`, không tác dụng phụ.'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Idempotency-Replayed: { schema: { type: string, const: 'true' }, description: 'Chỉ có khi là bản phát lại.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminCustomer' }
    AdminStaffUpdated:
      description: 'Slice 7. Nhân viên sau thao tác. Gửi lại cùng `Idempotency-Key` + cùng nội dung: cùng kết quả đầu, header `Idempotency-Replayed: true`, không tác dụng phụ.'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Idempotency-Replayed: { schema: { type: string, const: 'true' }, description: 'Chỉ có khi là bản phát lại.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminStaffMember' }
    InsightsValidation:
      description: |
        Slice 8. `validation` (+ `field`): `range`, `from`, `to`, `sort`, `targetType`, `page`, `limit` (query); đường dẫn trường thân `PUT /admin/settings/store` (`updatedAt`, `info.legalName`, `info.hotline`, `info.social.facebook`, `operations.shippingFee`, `cart.maxPerVariant`...). Thân cài đặt sai nhiều trường: kèm `error.fieldErrors` (mọi lỗi). Không đổi dữ liệu, không nhật ký.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SettingsConflict:
      description: |
        Slice 8. `version-conflict`: `updatedAt` gửi lên khác bản hiện tại và thân khác giá trị hiện tại (BR-SET-07). Không ghi, không nhật ký. FE tải lại `GET /admin/settings/store`, giữ bản đang nhập để so.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ReturnValidation:
      description: |
        Slice 9. `validation` (+ `field`; `fieldErrors` đủ MỌI lỗi theo trường một lần ở `createReturnRequest` / `estimateReturnAmount` / `adminReceiveReturn`): `lines`, `reason`, `detail`, `conditionAck`, `photos`, `bank`, `accountNumber`, `accountName`, `Idempotency-Key` (thân yêu cầu khách); `note`, `lines` (nhận hàng), `amount`, `refundReference` (admin); `state`, `q`, `sort`, `page`, `limit` (query danh sách). `invalid-image` 422 kèm `reason` = `format` | `size` | `dimensions` (tải ảnh). Thông điệp KHÔNG bao giờ lặp lại giá trị đã nhập (đặc biệt số tài khoản).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ReturnConflict:
      description: |
        Slice 9. `not-returnable` (đơn chưa `completed` / thiếu `deliveredAt` / `paymentStatus` khác `paid`), `return-window-closed` (quá hạn 30 ngày), `return-exists` (đơn đã có yêu cầu không-`cancelled`), `invalid-transition` (kèm `currentReturnState`; chuyển trạng thái ngoài bảng, lặp lại, hoặc thua cuộc đua), `idempotency-conflict` (cùng `Idempotency-Key`, khác nội dung). Không để lại thay đổi hay sự kiện.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AdminReturnUpdated:
      description: 'Slice 9. Yêu cầu sau thao tác (dạng admin, đủ trường, `allowedActions` mới).'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminReturn' }
    FieldValidation:
      description: |
        Slice 10. `validation` (+ `field` = trường đầu tiên; `fieldErrors` liệt kê MỌI lỗi theo trường một lần ở thân nhiều trường: gửi đánh giá, lưu trang chủ, lưu bảng size, bộ sưu tập, giảm hàng loạt). `field` là tên tham số / trường (`productId`, `rating`, `fit`, `height`, `title`, `body`, `reason`, `view`, `limit`, `page`, `updatedAt`, `category`, `percent`, `startsOn`, `endsOn`, `slug`, `name`, `productIds`...) hoặc đường dẫn đầy đủ có chỉ số (`blocks[2].title`, `moments[1].lines[0]`, `body[2].values.Ngực`). Thông điệp KHÔNG lặp lại giá trị đã nhập. Không đổi dữ liệu.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ReviewConflict:
      description: |
        Slice 10. `already-reviewed` (tài khoản đã có đánh giá cho sản phẩm này, kể cả đang bị ẩn; kiểm TRƯỚC) hoặc `not-eligible` (chưa nhận hàng / quá 365 ngày / đã trả hết). Không tạo bản ghi. FE có câu riêng cho từng mã (BR-REV-08).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    WishlistFull:
      description: '`wishlist-full`: đã đủ 100 mục `ACTIVE` (mục của sản phẩm ẩn không tính). DB không đổi. FE: "Danh sách yêu thích đã đủ 100 sản phẩm".'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ContentConflict:
      description: |
        Slice 10. Mọi trường hợp: không đổi dữ liệu.
        - `version-conflict`: `updatedAt` gửi lên khác bản hiện tại. Ở nội dung trang chủ / bảng size / bộ sưu tập kèm `error.current` (bản hiện tại, cùng kiểu với phản hồi `200` của chính thao tác) để FE hiện giá trị máy chủ và giữ bản đang nhập; ở kiểm duyệt đánh giá chỉ báo lỗi, FE tải lại danh sách.
        - `duplicate` (`field: slug`): slug bộ sưu tập đã có (Should).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AdminReviewUpdated:
      description: 'Slice 10. Đánh giá sau thao tác (dạng admin, `updatedAt` mới).'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminReview' }
  schemas:
    Email:
      type: string
      minLength: 6
      maxLength: 254
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      description: Server trim + lowercase rồi mới kiểm; giữ dấu chấm và phần `+` (BR-AUTH-01).
      examples: ['minh@example.com']
    Code:
      type: string
      pattern: '^[0-9]{8}$'
      description: 8 chữ số, có thể bắt đầu bằng 0. Server bỏ khoảng trắng và `-` trước khi kiểm. Chỉ so băm HMAC (BR-AUTH-04).
      examples: ['04817392']
    CodePurpose:
      type: string
      enum: [login, register, reset-password]
    PersonName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[\\p{L}\\p{M}][\\p{L}\\p{M} '-]*$"
      description: Sau trim + gộp khoảng trắng + NFC. Chữ cái (kể cả có dấu), khoảng trắng, `'`, `-` (BR-AUTH-10). Regex Unicode (cờ `u`).
    NewPassword:
      type: string
      minLength: 8
      maxLength: 64
      pattern: '^(?=.*[A-Z])(?=.*[0-9]).+$'
      description: BR-AUTH-20. Không bỏ khoảng trắng; ngoài regex, server kiểm không trùng email (không phân biệt hoa thường). Không bao giờ trả lại trong phản hồi.
    Role:
      type: string
      enum: [member, staff, admin]
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, role]
      additionalProperties: false
      description: Hồ sơ công khai (BR-AUTH-25). Không có hash, trạng thái, hasPassword.
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string, description: Tên gọi }
        lastName: { type: string, description: Họ và tên đệm }
        role: { $ref: '#/components/schemas/Role' }
    ErrorCode:
      type: string
      description: |
        Mã lỗi ổn định (BR-AUTH-36). Map HTTP / AC:
        | code | HTTP | AC |
        | validation | 422 | AC-AUTH-02, 27, 28, 32, 33, 51, 51b, 52(FE), 53 |
        | underage | 422 | AC-AUTH-32b |
        | invalid-code | 422 | AC-AUTH-09..12, 17, 19, 21, 38, 59 |
        | code-locked | 429 | AC-AUTH-20, 21, 22 |
        | rate-limited | 429 | AC-AUTH-05, 06, 15, 16, 48 |
        | password-locked | 429 | AC-AUTH-44, 47, 58 |
        | invalid-credentials | 401 | AC-AUTH-42, 43, 49 |
        | account-disabled | 403 | AC-AUTH-26, 50 |
        | email-registered | 409 | AC-AUTH-37 |
        | unauthenticated | 401 | AC-AUTH-64, 68, 75, 88 |
        | forbidden | 403 | AC-AUTH-84, 85, 88 |
        | origin-not-allowed | 403 | AC-AUTH-92 |
        | not-found | 404 | AC-CAT-03, 26, 27, 32, 46 (route lạ, sản phẩm / bảng size không có) |
        | invalid-address | 422 | AC-CHK-06 |
        | stock-changed | 409 | AC-CHK-13, 15 (kèm `stockIssues`) |
        | price-changed | 409 | AC-CHK-12 (kèm `quote`) |
        | voucher-changed | 409 | AC-VOU-12, 13 (kèm `quote`, `removedVoucherCodes`) |
        | idempotency-conflict | 409 | AC-CHK-18 |
        | possible-duplicate | 409 | AC-CHK-20 (Should, kèm `existingOrderCode`) |
        | not-cancellable | 409 | AC-CHK-16, 29; AC-ADM-27, 36, 37, 39 (Slice 4, phía khách) |
        | invalid-transition | 409 | AC-ADM-13, 16, 18, 19, 22..24, 26, 27, 33, 34, 38, 40, 50 (Slice 4; kèm `currentStatus`) |
        | order-state-changed | 409 | AC-ADM-14..17, 40 (Slice 4; kèm `order`, `currentStatus`) |
        | condition-not-met | 409 | AC-ADM-20, 24 (Slice 4) |
        | invalid-password | 422 | AC-ACC-11 (Slice 5; `field: currentPassword`) |
        | publish-incomplete | 422 | AC-INV-16, 17 (Slice 6, draft; kèm `missing`, `productId`) |
        | invalid-image | 422 | AC-INV-25 (Slice 6, draft; kèm `reason`: `format` / `size` / `dimensions`) |
        | duplicate | 409 | AC-INV-14, 21, 41 (Slice 6, draft; kèm `field`) |
        | version-conflict | 409 | AC-INV-06 (Slice 6, draft) |
        | product-in-use | 409 | AC-INV-20 (Slice 6, draft) |
        | variant-in-use | 409 | AC-INV-23 (Slice 6, draft; kèm `sku`) |
        | voucher-in-use | 409 | AC-INV-42, 44 (Slice 6, draft) |
        | stock-changed (dùng lại) | 409 | AC-INV-34 (Slice 6: điều chỉnh `set`; kèm `available`, `reserved`, không có `stockIssues`) |
        | self-change | 409 | AC-USR-37, 38, 41 (Slice 7, draft; admin tự khoá / tự đổi vai trò) |
        | last-admin | 409 | AC-USR-40, 41 (Slice 7, draft; thao tác để lại 0 admin hoạt động) |
        | duplicate (dùng lại) | 409 | AC-USR-33 (Slice 7: `field: email`) |
        | version-conflict (dùng lại) | 409 | AC-SET-08 (Slice 8, draft; `PUT /admin/settings/store`) |
        | validation (dùng lại) | 422 | AC-INS-10, AC-DSH-01, AC-RPT-01, 02, 05, AC-SET-02..06, 09, AC-AUD-02 (Slice 8, draft; `field` theo tên tham số / đường dẫn trường) |
        | not-returnable | 409 | AC-RET-10 (Slice 9, draft; đơn chưa `completed`, thiếu `deliveredAt`, hoặc `paymentStatus` khác `paid`) |
        | return-window-closed | 409 | AC-RET-10 (Slice 9, draft; quá 23:59:59 giờ VN ngày thứ 30 kể từ ngày giao) |
        | return-exists | 409 | AC-RET-09 (Slice 9, draft; đơn đã có yêu cầu không-`cancelled`) |
        | invalid-transition (dùng lại) | 409 | AC-RET-08, 19, 33..39 (Slice 9, draft; kèm `currentReturnState`, không có `currentStatus`) |
        | validation / invalid-image / idempotency-conflict (dùng lại) | 422 / 422 / 409 | AC-RET-11..14, 16, 18, 21, 31, 33..37 (Slice 9, draft; `field` phẳng: `lines`, `reason`, `detail`, `conditionAck`, `photos`, `bank`, `accountNumber`, `accountName`, `note`, `amount`, `refundReference`) |
        | not-eligible | 409 | AC-REV-01 (Slice 10, locked; `POST /reviews`) |
        | already-reviewed | 409 | AC-REV-03 (Slice 10, locked; `POST /reviews`) |
        | wishlist-full | 409 | AC-WISH-03 (Slice 10, locked; `PUT /account/wishlist/{productId}`) |
        | version-conflict (dùng lại) | 409 | AC-REV-06, AC-PROMO-05, AC-CMS-02, 04 (Slice 10, locked; kèm `current` ở nội dung / bảng size) |
        | unavailable | 500 | AC-AUTH-93, 94 |
      enum:
        - validation
        - underage
        - invalid-code
        - code-locked
        - rate-limited
        - password-locked
        - invalid-credentials
        - account-disabled
        - email-registered
        - unauthenticated
        - forbidden
        - origin-not-allowed
        - not-found
        - invalid-address
        - stock-changed
        - price-changed
        - voucher-changed
        - idempotency-conflict
        - possible-duplicate
        - not-cancellable
        - invalid-transition
        - order-state-changed
        - condition-not-met
        - invalid-password
        - publish-incomplete
        - invalid-image
        - duplicate
        - version-conflict
        - product-in-use
        - variant-in-use
        - voucher-in-use
        - self-change
        - last-admin
        - not-returnable
        - return-window-closed
        - return-exists
        - not-eligible
        - already-reviewed
        - wishlist-full
        - unavailable
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Câu tiếng Việt hiển thị thẳng (thông điệp theo PRD BR-AUTH-08, 17, 18, 19). Không chứa dữ liệu nhạy cảm; FE có thể dùng bản của mình theo `code`.
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Có khi `code` in (`rate-limited`, `code-locked`, `password-locked`).
            field:
              type: string
              description: 'Tên trường trong body (`email`, `code`, `firstName`, `lastName`, `birthDate`, `acceptedTerms`, `newPassword`) khi `code` in (`validation`, `underage`). Catalog: tên tham số query (`sort`, `gender`, `maxPrice`, `available`, `page`, `limit`, `q`, `ids`). Slice 6: đường dẫn có chỉ số, ví dụ `variants[2].sku`, `images`, `items[0].threshold`, `quantity`, `reason`, `note`, `code`, `totalLimit`, `slug`. Slice 7: `q`, `tier`, `view`, `sort`, `reason`, `name`, `email`, `role`, `Idempotency-Key`. Slice 8: `range`, `from`, `to`, `sort`, `targetType`, `page`, `limit`; thân cài đặt cửa hàng: `updatedAt`, `info.<tên>`, `info.social.<tên>`, `operations.<tên>`, `cart.<tên>`.'
            fieldErrors:
              type: array
              minItems: 1
              description: 'Slice 8, `PUT /admin/settings/store` (`validation`): MỌI lỗi theo trường (AC-SET-02); phần tử đầu trùng `field` / `message` ở trên. Slice 9: thêm ở `createReturnRequest`, `estimateReturnAmount`, `adminReceiveReturn`. Slice 10: thêm ở `createReview`, `adminSaveHomeContent`, `adminSaveSizeChart`, bộ sưu tập, giảm hàng loạt (đường dẫn đầy đủ có chỉ số). `message` không bao giờ lặp lại giá trị đã nhập.'
              items:
                type: object
                required: [field, message]
                additionalProperties: false
                properties:
                  field: { type: string }
                  message: { type: string }
            quote:
              description: 'Slice 3: báo giá mới nhất, có ở `price-changed`, `voucher-changed`, `stock-changed` (đặt hàng).'
              $ref: '#/components/schemas/Quote'
            stockIssues:
              type: array
              description: 'Slice 3, `stock-changed`: mọi dòng thiếu. `available` = còn lại (0 = hết hàng hoặc ngừng bán).'
              items:
                type: object
                required: [variantId, available]
                additionalProperties: false
                properties:
                  variantId: { type: string, format: uuid }
                  available: { type: integer, minimum: 0 }
            removedVoucherCodes:
              type: array
              description: 'Slice 3, `voucher-changed`: các mã bị gỡ.'
              items: { type: string }
            existingOrderCode:
              description: 'Slice 3, `possible-duplicate`: mã đơn trước đó.'
              $ref: '#/components/schemas/OrderCode'
            currentStatus:
              description: 'Slice 4: trạng thái hiện tại của đơn, có ở `invalid-transition`, `order-state-changed`, `condition-not-met` (BR-ADM-13).'
              $ref: '#/components/schemas/OrderStatus'
            currentReturnState:
              description: 'Slice 9 (draft): trạng thái hiện tại của yêu cầu trả hàng, có ở `invalid-transition` của thao tác trả hàng (thay cho `currentStatus`).'
              $ref: '#/components/schemas/ReturnState'
            order:
              description: 'Slice 4: đơn hiện tại (dạng admin), luôn có ở `order-state-changed` để FE vẽ lại không gọi thêm (BR-ADM-14).'
              $ref: '#/components/schemas/AdminOrder'
            missing:
              type: array
              description: 'Slice 6, `publish-incomplete`: điều kiện còn thiếu để vào `active`.'
              items: { type: string, enum: [images, variants, name, type, category, price] }
            productId:
              type: string
              description: 'Slice 6, `publish-incomplete` khi đổi hàng loạt: sản phẩm đầu tiên không đủ điều kiện.'
            reason:
              type: string
              enum: [format, size, dimensions]
              description: 'Slice 6, `invalid-image`.'
            sku:
              type: string
              description: 'Slice 6, `variant-in-use`: SKU của biến thể có đơn.'
            available:
              type: integer
              minimum: 0
              description: 'Slice 6, `stock-changed` của điều chỉnh tồn: Có thể bán hiện tại.'
            reserved:
              type: integer
              minimum: 0
              description: 'Slice 6, `stock-changed` của điều chỉnh tồn: Đang giữ hiện tại.'
            current:
              description: 'Slice 10, `version-conflict` của `PUT /admin/content/home`, `PUT /admin/size-charts/{category}`, `PUT /admin/collections/{id}`, `POST /admin/content/home/reset`: bản hiện tại của máy chủ (cùng kiểu với phản hồi `200` của chính thao tác: `AdminHomeContent`, `AdminSizeChart` hoặc `AdminCollection`) để FE hiện giá trị máy chủ và giữ bản đang nhập.'
              type: object
              additionalProperties: true
    Category:
      type: string
      enum: [tops, bottoms, dresses, outerwear]
      description: Slug danh mục (khớp `Category` của FE).
    Moment:
      type: string
      enum: [work, dinner, event, weekend]
    Gender:
      type: string
      enum: [nam, nu]
      description: Sản phẩm unisex có cả hai giá trị.
    SortOrder:
      type: string
      enum: [featured, newest, price-asc, price-desc, bestselling]
      default: featured
    StockStatus:
      type: string
      enum: [OUT_OF_STOCK, LOW_STOCK, IN_STOCK]
      description: 'Suy từ `inventory` (BR-CAT-04): 0 -> OUT_OF_STOCK; 1..5 -> LOW_STOCK; >= 6 -> IN_STOCK.'
    Color:
      type: object
      required: [name, hex]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 50, examples: ['Đen'] }
        hex: { type: string, pattern: '^#[0-9a-fA-F]{6}$', examples: ['#242323'] }
    ProductVariant:
      type: object
      required: [id, sku, size, color, inventory, stockStatus]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: 'Ổn định qua các lần seed. Đổi từ dạng `01-0-S` của mock.' }
        sku: { type: string, maxLength: 64, examples: ['N2F-01-0-S'] }
        size: { type: string, enum: [S, M, L, XL] }
        color: { $ref: '#/components/schemas/Color' }
        inventory: { type: integer, minimum: 0, description: 'Tồn kho hiển thị, không phải giữ hàng (BR-CAT-11).' }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
    ProductFit:
      type: object
      required: [summary, model]
      additionalProperties: false
      properties:
        summary: { type: string }
        model: { type: string }
    StylingLook:
      type: object
      required: [time, moment, tip]
      additionalProperties: false
      properties:
        time: { type: string, examples: ['09:00'] }
        moment: { type: string, examples: ['At work'] }
        tip: { type: string }
    Product:
      type: object
      description: 'Khớp interface `Product` của FE (`frontend/src/app/features/catalog/models/product.ts`) trừ `id`, `variants[].id` (UUID) và `variants[].stockStatus` (mới). Slice 10: `rating` có khi sản phẩm có đánh giá `visible`; `price` / `compareAtPrice` là giá hiệu lực. Chuỗi / mảng nội dung thiếu là `""` / `[]`, không bao giờ `null` (BR-CAT-10); trường tuỳ chọn (`compareAtPrice`, `badge`, `colorMedia`) bị bỏ khi không có.'
      required: [id, slug, name, type, category, moments, genders, price, mediaId, gallery, variants, description, material, care, fit, looks, createdAt, salesRank]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, minLength: 1, maxLength: 120, description: 'Dòng loại dưới tên, ví dụ "Áo blazer · Dáng suông".' }
        category: { $ref: '#/components/schemas/Category' }
        moments: { type: array, items: { $ref: '#/components/schemas/Moment' }, minItems: 1 }
        genders: { type: array, items: { $ref: '#/components/schemas/Gender' }, minItems: 1 }
        price: { type: integer, minimum: 1000, maximum: 100000000, description: 'VND. Slice 10: GIÁ HIỆU LỰC (giá giảm khi đang trong đợt, ngược lại giá gốc).' }
        compareAtPrice: { type: integer, description: 'Chỉ có khi > `price`. Slice 10: đang trong đợt giảm = `price` GỐC (đè giá gạch nhập tay); ngoài đợt = giá gạch nhập tay như cũ.' }
        mediaId: { type: string, maxLength: 100, description: Ảnh bìa (khoá media manifest). }
        gallery: { type: array, items: { type: string }, minItems: 1 }
        colorMedia:
          type: object
          additionalProperties: { type: string }
          description: Ảnh bìa theo tên màu.
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' }, minItems: 1, description: 'Sắp theo màu (thứ tự seed) rồi S, M, L, XL.' }
        badge: { type: string, maxLength: 20 }
        description: { type: string }
        material: { type: string }
        care: { type: array, items: { type: string } }
        fit: { $ref: '#/components/schemas/ProductFit' }
        looks: { type: array, items: { $ref: '#/components/schemas/StylingLook' } }
        createdAt: { type: string, format: date, description: 'Ngày ISO `YYYY-MM-DD`, giữ như FE hiện có (C13).' }
        salesRank: { type: integer, minimum: 1, description: '1 = bán chạy nhất. Số lưu sẵn ở Slice 2.' }
        rating: { type: object, required: [average, count], additionalProperties: false, description: 'Slice 10 (BR-REV-06). Chỉ có khi có >= 1 đánh giá `visible`; `average` 1 chữ số thập phân half-up. Cùng số ở PLP, PDP và `ProductReviewPage.summary`.', properties: { average: { type: number, minimum: 1, maximum: 5 }, count: { type: integer, minimum: 1 } } }
        discountPercent: { type: integer, minimum: 0, maximum: 99, description: 'Slice 10 (BR-PROMO-06). Chỉ có khi đang CHẠY đợt giảm: floor((1 - giá giảm / giá gốc) x 100) do máy chủ tính (499.000 / 500.000 -> 0; FE ẩn nhãn khi 0).' }
        saleEndsAt: { type: string, format: date-time, description: 'Slice 10 (Should, BR-PROMO-07). Chỉ có khi đang chạy đợt giảm: 23:59:59 giờ VN của ngày kết thúc (ISO UTC) cho nhãn "Giảm giá đến dd/MM".' }
    ProductPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' }, maxItems: 48 }
        total: { type: integer, minimum: 0, description: Số sản phẩm khớp toàn bộ bộ lọc. }
        page: { type: integer, minimum: 1, description: Trang đã dùng (echo). }
        limit: { type: integer, minimum: 1, maximum: 48, description: Kích thước trang đã dùng (echo). }
    SizeChartRow:
      type: object
      required: [size, values]
      additionalProperties: false
      properties:
        size: { type: string }
        values: { type: object, additionalProperties: { type: string }, description: 'Nhãn số đo -> giá trị (cm), ví dụ "82–86".' }
    SizeChart:
      type: object
      required: [body, garment, bodyColumns, garmentColumns]
      additionalProperties: false
      properties:
        body: { type: array, items: { $ref: '#/components/schemas/SizeChartRow' } }
        garment: { type: array, items: { $ref: '#/components/schemas/SizeChartRow' } }
        bodyColumns: { type: array, items: { type: string } }
        garmentColumns: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time, description: 'Slice 10. Thời điểm admin lưu bảng lần cuối; vắng khi chưa từng sửa qua API admin.' }
    Location:
      type: object
      required: [code, name]
      additionalProperties: false
      description: Tỉnh / thành hoặc phường / xã (danh mục 2 cấp sau 01/07/2025; nguồn dữ liệu ghi ở plan mục 3).
      properties:
        code: { type: string, maxLength: 10, examples: ['79'] }
        name: { type: string, maxLength: 100, examples: ['Thành phố Hồ Chí Minh'] }
    OrderCodeInput:
      type: string
      minLength: 1
      maxLength: 20
      description: 'Mã đơn do khách gõ. Server trim, bỏ `#`, chuyển chữ hoa rồi mới kiểm `^N2F[0-9]{10}$`; sai dạng ở `lookup/*` vẫn đi theo luồng "không tìm thấy" (không 422) để không phân biệt (BR-CHK-26). Ở các đường dẫn `/orders/{orderCode}` sai dạng -> `404 not-found`.'
      examples: ['n2f2611040427', '#N2F2611040427']
    OrderCode:
      type: string
      pattern: '^N2F[0-9]{10}$'
      description: 'N2F + YYMMDD (giờ Việt Nam) + 4 số ngẫu nhiên, không đổi, không tái sử dụng (BR-CHK-17).'
      examples: ['N2F2611040427']
    VnPhone:
      type: string
      pattern: '^(\+84|0)(3|5|7|8|9)[0-9]{8}$'
      description: 'Di động Việt Nam. Server trim, bỏ khoảng trắng, đổi `+84` thành `0` rồi lưu / trả `0xxxxxxxxx` (BR-CHK-04).'
      examples: ['0912345678']
    QuoteItems:
      type: array
      minItems: 1
      maxItems: 30
      description: 'Mỗi `variantId` xuất hiện tối đa một lần (trùng -> `422 validation`, `field: items`).'
      items:
        type: object
        required: [variantId, quantity]
        additionalProperties: false
        properties:
          variantId: { type: string, format: uuid }
          quantity: { type: integer, minimum: 1, maximum: 99, description: 'Quá 5 hoặc quá tồn: `quote` cắt (xem `effectiveQuantity`); `POST /orders` với quantity > 5 -> `422 validation`.' }
    VoucherCodes:
      type: array
      maxItems: 2
      items: { type: string, minLength: 1, maxLength: 40 }
      description: 'Tối đa 1 mã giảm + 1 mã free-ship (BR-VOU-01). Quá 2 phần tử -> `422 validation`, `field: voucherCodes`.'
    QuoteAddress:
      type: object
      required: [provinceCode, wardCode]
      additionalProperties: false
      properties:
        provinceCode: { type: string, maxLength: 10 }
        wardCode: { type: string, maxLength: 10 }
    QuoteContact:
      type: object
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/VnPhone' }
    PaymentMethod:
      type: string
      enum: [cod, bank-transfer]
    QuoteRequest:
      type: object
      required: [items]
      additionalProperties: false
      description: Mọi trường giá / tổng gửi kèm bị bỏ qua (trường lạ bị loại).
      properties:
        items: { $ref: '#/components/schemas/QuoteItems' }
        voucherCodes: { $ref: '#/components/schemas/VoucherCodes' }
        address: { $ref: '#/components/schemas/QuoteAddress' }
        contact: { $ref: '#/components/schemas/QuoteContact' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
    Availability:
      type: string
      enum: [available, low-stock, out-of-stock, discontinued]
      description: '`low-stock` khi tồn 1..5; `out-of-stock` khi 0; `discontinued` khi sản phẩm không `ACTIVE` hoặc biến thể không tồn tại (BR-CART-08).'
    RefreshedLine:
      type: object
      required: [variantId, productId, slug, name, mediaId, color, size, unitPrice, requestedQuantity, maxQuantity, effectiveQuantity, availability, inventory]
      additionalProperties: false
      description: Một dòng đã làm tươi từ DB. Với dòng `discontinued` chỉ `variantId`, `requestedQuantity`, `availability`, `maxQuantity = 0`, `effectiveQuantity = 0` là bảo đảm có giá trị; các trường còn lại là `""` / `0`.
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        mediaId: { type: string }
        color: { type: string }
        size: { type: string }
        unitPrice: { type: integer, minimum: 0, description: Giá hiện tại sau khuyến mãi (đã gồm VAT). }
        compareAtPrice: { type: integer }
        requestedQuantity: { type: integer, minimum: 1 }
        maxQuantity: { type: integer, minimum: 0, description: 'min(5, tồn); 0 nếu hết / ngừng bán.' }
        effectiveQuantity: { type: integer, minimum: 0, description: 'min(requestedQuantity, maxQuantity).' }
        availability: { $ref: '#/components/schemas/Availability' }
        inventory: { type: integer, minimum: 0 }
        limitedBy:
          type: string
          enum: [stock, per-variant-limit]
          description: Có khi `effectiveQuantity < requestedQuantity`; `stock` -> câu "Chỉ còn N sản phẩm cho màu, size này.", `per-variant-limit` -> câu "Mỗi đơn mua tối đa 5 sản phẩm cùng màu, size...".
    Policy:
      type: object
      required: [maxPerVariant, maxItemsPerOrder, maxCartLines, shippingFee, freeShippingThreshold, codMaxTotal, bankHoldMinutes, bankTransferEnabled, cartRetentionDays]
      additionalProperties: false
      description: Tham số vận hành đọc từ DB (bảng `store_settings`), thay `store-policy.ts` của FE ở chế độ http.
      properties:
        maxPerVariant: { type: integer, examples: [5] }
        maxItemsPerOrder: { type: integer, examples: [20] }
        maxCartLines: { type: integer, examples: [30] }
        shippingFee: { type: integer, examples: [30000] }
        freeShippingThreshold: { type: integer, examples: [1000000] }
        codMaxTotal: { type: integer, examples: [5000000] }
        bankHoldMinutes: { type: integer, examples: [30] }
        bankTransferEnabled: { type: boolean, description: '`[giả định chờ Thắng]` false cho tới khi có dịch vụ đối soát.' }
        cartRetentionDays: { type: integer, examples: [30] }
    CartView:
      type: object
      required: [lines, policy, expiresAt]
      additionalProperties: false
      properties:
        lines:
          type: array
          maxItems: 30
          description: Sắp theo `updatedAt` giảm dần (dòng mới thêm / sửa lên đầu), hoà bằng `variantId`.
          items:
            allOf:
              - $ref: '#/components/schemas/RefreshedLine'
              - type: object
                required: [updatedAt]
                properties:
                  updatedAt: { type: string, format: date-time }
        policy: { $ref: '#/components/schemas/Policy' }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'Lần sửa cuối + 30 ngày; null khi giỏ rỗng.' }
    CartNotice:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, enum: [stock-limit, per-variant-limit, merged] }
        variantId: { type: string, format: uuid }
        adjustedTo: { type: integer, minimum: 1, description: Số lượng sau khi cắt. }
    VoucherKind:
      type: string
      enum: [discount, free-shipping]
      description: '`discount` (giảm theo % hoặc số tiền) hoặc `free-shipping`. Phân loại phía FE; loại %/số tiền là chi tiết nội bộ.'
    VoucherApplied:
      type: object
      required: [applied, code, kind, label, amount]
      additionalProperties: false
      properties:
        applied: { type: boolean, const: true }
        code: { type: string, description: 'Chữ hoa chuẩn.' }
        kind: { $ref: '#/components/schemas/VoucherKind' }
        label: { type: string, description: 'Tên hiển thị, ví dụ "Giảm 15% đơn đầu tiên".' }
        amount: { type: integer, minimum: 0, description: 'Tiền giảm hàng (`discount`); 0 với `free-shipping` (giảm phí nằm ở `pricing.shippingDiscount`).' }
    VoucherReason:
      type: string
      enum: [not-found, not-started, expired, exhausted, login-required, per-user-limit, first-order-only, category-mismatch, excluded-sale-items, min-spend, shipping-already-free]
      description: |
        Thứ tự kiểm BR-VOU-03; thông điệp FE (BR-VOU-04): not-found "Mã giảm giá không tồn tại."; not-started "Mã này áp dụng từ {startsAt}."; expired (hết hạn **hoặc** bị tắt) "Mã giảm giá đã hết hạn."; exhausted "Mã giảm giá đã hết lượt sử dụng."; login-required "Đăng nhập để dùng mã này."; per-user-limit "Bạn đã dùng mã này đủ số lần cho phép."; first-order-only "Mã chỉ áp dụng cho đơn hàng đầu tiên."; category-mismatch "Mã chỉ áp dụng cho {categoryName}." (Should); excluded-sale-items "Mã không áp dụng cho sản phẩm đang giảm giá." (Should); min-spend "Mua thêm {missingAmount}₫ để dùng mã này (đơn tối thiểu {minSubtotal}₫)."; shipping-already-free "Đơn của bạn đã được miễn phí giao hàng.".
    VoucherRejection:
      type: object
      required: [applied, code, reason]
      additionalProperties: false
      properties:
        applied: { type: boolean, const: false }
        code: { type: string, description: 'Đúng mã khách gõ (đã trim, chữ hoa) để FE giữ trong ô.' }
        reason: { $ref: '#/components/schemas/VoucherReason' }
        startsAt: { type: string, format: date-time, description: 'Có khi `not-started`.' }
        missingAmount: { type: integer, description: 'Có khi `min-spend`.' }
        minSubtotal: { type: integer, description: 'Có khi `min-spend`.' }
        categoryName: { type: string, description: 'Có khi `category-mismatch`.' }
    Pricing:
      type: object
      required: [subtotal, discount, shippingFee, shippingDiscount, total]
      additionalProperties: false
      description: 'Khớp `OrderPricing` của FE. `total = subtotal - discount + shippingFee - shippingDiscount` (BR-VOU-05). Miễn phí giao (ngưỡng hoặc mã) -> `shippingDiscount = shippingFee`.'
      properties:
        subtotal: { type: integer, minimum: 0 }
        discount: { type: integer, minimum: 0 }
        shippingFee: { type: integer, minimum: 0 }
        shippingDiscount: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    PaymentOption:
      type: object
      required: [method, available]
      additionalProperties: false
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        available: { type: boolean }
        reason:
          type: string
          enum: [over-limit, too-many-refusals, too-many-open-orders, not-enabled]
          description: 'Có khi `available = false`. `over-limit` = tổng > 5.000.000 ₫; `too-many-refusals` = SĐT có từ 2 đơn COD bị từ chối trong 6 tháng; `too-many-open-orders` = đang có 3 đơn COD chưa giao; `not-enabled` = QR chưa bật.'
    Quote:
      type: object
      required: [lines, pricing, vouchers, rejectedVouchers, shipping, estimatedDelivery, paymentMethods, policy]
      additionalProperties: false
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/RefreshedLine' } }
        lineDiscounts:
          type: array
          description: 'Phần giảm chia cho từng dòng (BR-VOU-06): theo tỷ lệ giá trị, làm tròn xuống đồng, phần dư vào dòng giá trị lớn nhất (hoà: `variantId` nhỏ nhất). Chỉ các dòng có phần giảm > 0.'
          items:
            type: object
            required: [variantId, amount]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              amount: { type: integer, minimum: 1 }
        pricing: { $ref: '#/components/schemas/Pricing' }
        vouchers: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/VoucherApplied' } }
        rejectedVouchers: { type: array, items: { $ref: '#/components/schemas/VoucherRejection' } }
        shipping:
          type: object
          required: [fee, freeReason, addressRequired]
          additionalProperties: false
          properties:
            fee: { type: integer, minimum: 0, description: 'Phí tiêu chuẩn (30.000), chưa trừ miễn phí.' }
            freeReason: { type: [string, 'null'], enum: [threshold, voucher, null], description: 'Lý do miễn phí để hiện "Miễn phí (đơn từ 1.000.000₫ / mã free-ship)". Ngưỡng thắng mã (BR-VOU-03 mục 9).' }
            addressRequired: { type: boolean, description: 'true khi request chưa có `address`.' }
        estimatedDelivery:
          type: object
          required: [from, to]
          additionalProperties: false
          description: 'Giả định đơn vào `to_ship` ngay lúc báo giá (BR-CHK-11). Ngày ISO `YYYY-MM-DD`.'
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        paymentMethods: { type: array, items: { $ref: '#/components/schemas/PaymentOption' } }
        policy: { $ref: '#/components/schemas/Policy' }
    Recipient:
      type: object
      required: [name, phone, email]
      additionalProperties: false
      description: '`name`/`phone` là của người nhận, `email` là của người đặt (BR-CHK-04, 05). Server trim; `name` 2-50 ký tự, có ít nhất 1 chữ cái; `email` <= 100 ký tự, lưu chữ thường.'
      properties:
        name: { type: string, minLength: 2, maxLength: 50 }
        phone: { $ref: '#/components/schemas/VnPhone' }
        email: { $ref: '#/components/schemas/Email' }
    OrderAddress:
      type: object
      required: [provinceCode, wardCode, street]
      additionalProperties: false
      properties:
        provinceCode: { type: string, maxLength: 10 }
        wardCode: { type: string, maxLength: 10, description: 'Phải thuộc `provinceCode`, sai -> `422 invalid-address`.' }
        street: { type: string, minLength: 5, maxLength: 200 }
    Invoice:
      type: object
      required: [companyName, taxCode, address, email]
      additionalProperties: false
      description: Hoá đơn công ty (BR-CHK-07); chỉ lưu, không sửa sau khi đặt.
      properties:
        companyName: { type: string, minLength: 2, maxLength: 200 }
        taxCode: { type: string, pattern: '^[0-9]{10}(-[0-9]{3})?$' }
        address: { type: string, minLength: 5, maxLength: 200 }
        email: { $ref: '#/components/schemas/Email' }
    ExpectedTotals:
      type: object
      required: [lines, pricing]
      additionalProperties: false
      description: 'Số khách đang thấy. Chỉ để đối chiếu (BR-CHK-12): khác bất kỳ giá dòng nào hoặc bất kỳ trường `pricing` nào -> `409 price-changed`.'
      properties:
        lines:
          type: array
          items:
            type: object
            required: [variantId, unitPrice]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              unitPrice: { type: integer, minimum: 0 }
        pricing: { $ref: '#/components/schemas/Pricing' }
    PlaceOrderRequest:
      type: object
      required: [items, contact, address, paymentMethod, invoice, acceptedTerms, expected]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          description: 'Mỗi `variantId` một lần; `quantity` 1..5; tổng quantity <= 20 (vượt -> `422 validation`, `field: items`).'
          items:
            type: object
            required: [variantId, quantity]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 5 }
        voucherCodes: { $ref: '#/components/schemas/VoucherCodes' }
        contact: { $ref: '#/components/schemas/Recipient' }
        address: { $ref: '#/components/schemas/OrderAddress' }
        note: { type: string, maxLength: 250, description: Ghi chú cho shipper; trim; rỗng = không có. }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        invoice: { oneOf: [{ $ref: '#/components/schemas/Invoice' }, { type: 'null' }], description: 'null = hoá đơn cá nhân.' }
        acceptedTerms: { type: boolean, description: 'Phải `true`, nếu không `422 validation` `field: acceptedTerms`; máy chủ lưu thời điểm đồng ý (BR-CHK-08).' }
        expected: { $ref: '#/components/schemas/ExpectedTotals' }
        confirmDuplicate: { type: boolean, default: false, description: 'Should (BR-CHK-16): `true` khi khách đã xác nhận đặt tiếp sau `possible-duplicate`.' }
    OrderStatus:
      type: string
      enum: [to_pay, to_ship, to_receive, completed, cancel_requested, cancelled]
      description: 'Tên COMMON-01 `[giả định chờ Thắng]`. Ánh xạ FE: to_pay -> pending-payment; to_ship -> processing; to_receive -> shipping / delivering; completed -> completed; cancel_requested -> (FE thêm); cancelled -> cancelled.'
    PaymentStatus:
      type: string
      enum: [pending, paid, failed, refunded, partially_refunded]
    CancelledBy:
      type: string
      enum: [customer, shop, system]
    OrderLine:
      type: object
      required: [variantId, productId, canReview, productSlug, name, color, size, sku, quantity, unitPrice, mediaId, lineDiscount]
      additionalProperties: false
      description: Bản chụp tại lúc đặt; đổi giá / tên sau đó không ảnh hưởng (BR-CHK-18).
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: [string, 'null'], format: uuid, description: 'BR-REV-09 (cộng thêm 2026-11-13). `null` nếu sản phẩm đã xoá.' }
        canReview: { type: boolean, description: 'BR-REV-09 (cộng thêm). `true` chỉ khi chủ đơn thành viên xem đơn `completed` trong 365 ngày (cùng hàm với `GET /reviews/eligibility`) và chưa đánh giá sản phẩm này; đơn vãng lai / người khác xem luôn `false`.' }
        productSlug: { type: string }
        name: { type: string }
        color: { type: string }
        size: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 5 }
        unitPrice: { type: integer, minimum: 0 }
        compareAtPrice: { type: integer }
        mediaId: { type: string }
        lineDiscount: { type: integer, minimum: 0, description: 'Phần giảm voucher đã chia cho dòng này (BR-VOU-06).' }
    OrderTimelineEntry:
      type: object
      required: [at, title]
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
        title: { type: string }
        detail: { type: string, description: 'Slice 4: lý do đã được làm sạch cho khách (câu chuẩn hoặc lý do do chính khách nhập); đơn `to_receive` kèm đơn vị + mã vận đơn.' }
        actor: { type: string, enum: [customer, nine2fine], description: 'Slice 4. Người thực hiện: `customer` hiện "Khách", `nine2fine` cho nhân viên và hệ thống (không lộ tên nhân viên, BR-ADM-12). Dòng cũ (Slice 3) cũng được điền theo `actor` của sự kiện.' }
    Order:
      type: object
      required: [id, placedAt, status, paymentStatus, paymentMethod, items, pricing, vouchers, recipient, shippingAddress, estimatedDelivery, canCancel, canReturn, timeline]
      additionalProperties: false
      description: 'Chi tiết đơn. Không có `userId`, UUID nội bộ hay dữ liệu thanh toán nhạy cảm. Nhất quán: `pricing` ở đây, ở email, ở trang thành công là cùng một bộ số.'
      properties:
        id: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentDueAt: { type: string, format: date-time, description: 'Chỉ khi `to_pay`.' }
        paidAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        pricing: { $ref: '#/components/schemas/Pricing' }
        vouchers:
          type: array
          items:
            type: object
            required: [code, kind, amount]
            additionalProperties: false
            properties:
              code: { type: string }
              kind: { $ref: '#/components/schemas/VoucherKind' }
              amount: { type: integer, minimum: 0 }
        recipient:
          type: object
          required: [name, phone, email]
          additionalProperties: false
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
        shippingAddress:
          type: object
          required: [street, ward, province]
          additionalProperties: false
          description: 'Tên tỉnh / phường chụp tại lúc đặt.'
          properties:
            street: { type: string }
            ward: { type: string }
            province: { type: string }
        note: { type: string }
        invoice: { $ref: '#/components/schemas/Invoice' }
        estimatedDelivery:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        cancelledBy: { $ref: '#/components/schemas/CancelledBy' }
        cancelledAt: { type: string, format: date-time }
        cancelReason: { type: string }
        canCancel: { type: boolean, description: 'true khi `status = to_pay`, hoặc `status = to_ship` và chưa từng gửi yêu cầu huỷ (Slice 4: ở `to_ship` là "gửi yêu cầu huỷ", xem `cancelMode`).' }
        cancelMode:
          type: string
          enum: [cancel, request]
          description: 'Slice 4. Có khi `canCancel = true`: `cancel` = huỷ ngay (`to_pay`); `request` = gửi yêu cầu huỷ chờ shop duyệt (`to_ship`, S4-Q1). FE đổi chữ nút theo trường này.'
        cancelRequest:
          type: object
          required: [requestedAt, outcome]
          additionalProperties: false
          description: 'Slice 4. Có khi khách đã gửi yêu cầu huỷ (đang chờ, hoặc đã bị từ chối). Yêu cầu được duyệt thì đơn `cancelled`. Khi `outcome = rejected` khách không gửi lại được (S4-Q6): FE hướng dẫn gọi hotline.'
          properties:
            requestedAt: { type: string, format: date-time }
            outcome: { type: string, enum: [pending, rejected, approved] }
            rejectReason: { type: string, description: 'Lý do shop từ chối (cũng có trong email); chỉ khi `outcome = rejected`.' }
        shipment:
          type: object
          required: [carrier, trackingNumber, handedOverAt]
          additionalProperties: false
          description: 'Slice 4. Có từ khi bàn giao vận chuyển (`to_receive`, `completed`, và `cancelled` từ `to_receive`). Không có tên nhân viên.'
          properties:
            carrier: { type: string }
            trackingNumber: { type: string }
            handedOverAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, description: 'Slice 4. Thời điểm giao xong / thu tiền; chỉ khi `completed`.' }
        canReturn: { type: boolean, description: 'Slice 9 (BR-RET-10); Slice 10 (BR-RET-61): có cả cho đơn của khách vãng lai xem bằng `n2f_oa` (đơn của thành viên xem bằng `n2f_oa` vẫn `false`: dùng `/account/**`). Máy chủ tính: `status = completed`, có `deliveredAt`, `paymentStatus = paid`, chưa quá `returnDeadline`, và chưa có yêu cầu không-`cancelled`. FE bám cờ này (không tính hạn bằng đồng hồ máy khách).' }
        returnDeadline: { type: string, format: date-time, description: 'Slice 9 (draft). 23:59:59 giờ VN của ngày thứ 30 kể từ ngày giao (ISO UTC). Chỉ khi có `deliveredAt`.' }
        return: { allOf: [{ $ref: '#/components/schemas/ReturnRequest' }], description: 'Slice 9 (draft, BR-RET-20). Yêu cầu không-`cancelled` mới nhất của đơn; nếu chỉ có yêu cầu đã huỷ thì yêu cầu huỷ mới nhất; không có yêu cầu thì vắng. Chỉ ở các API đơn của khách (chi tiết, danh sách, huỷ); không có ở thư / phản hồi đặt đơn.' }
        willCallToConfirm: { type: boolean, description: 'COD cần CSKH gọi xác nhận trong 2 giờ làm việc (BR-CHK-20): false với thành viên đã có đơn `completed` và đơn < 1.000.000 ₫. Chỉ có ở đơn COD `to_ship`.' }
        timeline: { type: array, items: { $ref: '#/components/schemas/OrderTimelineEntry' }, description: 'Cũ nhất trước (khác timeline admin là mới nhất trước, chủ ý); mỗi lần đổi trạng thái một dòng (BR-CHK-22). Slice 4: chỉ các lần đổi trạng thái (không có lần gọi, xác nhận, ghi chú, hàng hoàn), người = `nine2fine` hoặc `customer` (BR-ADM-12).' }
    OrderReceipt:
      type: object
      required: [order]
      additionalProperties: false
      properties:
        order: { $ref: '#/components/schemas/Order' }
    OrderPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' }, maxItems: 50 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
    PaymentSession:
      type: object
      required: [orderId, amount, status, expiresAt, transferContent, account, qrImageUrl]
      additionalProperties: false
      description: 'Đối soát qua SePay (webhook). `paidAt` có khi `status = paid`. Khi đã chuyển thiếu: `shortfall` có giá trị và `qrImageUrl` nhúng đúng số còn thiếu (`amount` vẫn là tổng đơn).'
      properties:
        orderId: { $ref: '#/components/schemas/OrderCode' }
        amount: { type: integer, minimum: 1, description: Số tiền chính xác phải chuyển (= `pricing.total`). }
        status: { type: string, enum: [awaiting, paid, expired] }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        transferContent: { type: string, description: 'Nội dung chuyển khoản = mã đơn.' }
        account:
          type: object
          required: [bank, accountName, accountNumber]
          additionalProperties: false
          properties:
            bank: { type: string }
            accountName: { type: string }
            accountNumber: { type: string }
        qrImageUrl: { type: string, description: 'URL ảnh QR động SePay (`qr.sepay.vn`, chuẩn VietQR) đã nhúng số tài khoản, số tiền và nội dung = mã đơn.' }
        shortfall: { type: integer, minimum: 1, description: 'Số còn thiếu khi đã chuyển thiếu (CHK-PAY-10).' }
        simulated: { type: boolean, const: true, description: 'Có khi máy chủ bật PAYMENT_SIMULATOR: FE hiện nút giả lập (`POST .../payment/simulate`).' }
    AdminOrderTab:
      type: string
      enum: [all, pending-payment, to-confirm, to-fulfil, in-transit, cancel-requests, returning, completed, cancelled]
      description: 'Slice 4, BR-ADM-07. Mỗi đơn thuộc đúng một tab trừ `all`. FE ánh xạ sang nhãn "Chờ xác nhận" (`to-confirm`), "Đang chuẩn bị" (`to-fulfil`), "Đang vận chuyển" (`in-transit`), "Chờ duyệt huỷ" (`cancel-requests`)...'
    AdminOrderBucket:
      type: string
      enum: [pending-payment, to-confirm, to-fulfil, in-transit, cancel-requests, returning, completed, cancelled]
      description: 'Tab mà đơn thuộc về (`AdminOrderTab` bỏ `all`).'
    AdminOrderCounts:
      type: object
      required: [all, pending-payment, to-confirm, to-fulfil, in-transit, cancel-requests, returning, completed, cancelled]
      additionalProperties: false
      description: 'Slice 4. `all` = tổng 8 tab con.'
      properties:
        all: { type: integer, minimum: 0 }
        pending-payment: { type: integer, minimum: 0 }
        to-confirm: { type: integer, minimum: 0 }
        to-fulfil: { type: integer, minimum: 0 }
        in-transit: { type: integer, minimum: 0 }
        cancel-requests: { type: integer, minimum: 0 }
        returning: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    AdminOverdueFlag:
      type: string
      enum: [confirm-call, cancel-request, delivery]
      description: 'Should (BR-ADM-40; S4-Q3). `confirm-call`: cần gọi quá 2 giờ làm việc kể từ lúc đặt (08:00-18:00, thứ Hai-thứ Bảy); `cancel-request`: `cancel_requested` quá 24 giờ chưa quyết định; `delivery`: `to_receive` quá ngày giao dự kiến muộn nhất. Chỉ là cờ, không tự đổi trạng thái.'
    AdminOrderAction:
      type: string
      enum:
        - call-attempt
        - confirm
        - ship
        - deliver
        - cancel-unreachable
        - cancel-declined-on-call
        - cancel-customer-request
        - cancel-refused
        - cancel-undeliverable
        - cancel-other
        - restock
        - write-off
        - approve-cancel
        - reject-cancel
        - add-note
        - print-slip
      description: |
        Hành động hợp lệ ngay lúc này cho **đúng người đang gọi** (vai trò + trạng thái + điều kiện), BR-ADM-04. Ánh xạ: `call-attempt` -> `POST .../call-attempts`; `confirm` -> `.../confirm`; `ship` -> `.../ship`; `deliver` -> `.../deliver`; `cancel-<reason>` -> `.../cancel` với `reason` tương ứng (`cancel-declined-on-call` = `declined_on_call`, `cancel-customer-request` = `customer_request`); `restock`, `write-off` -> `.../returned-stock` (`decision` `restocked` / `written_off`); `approve-cancel`, `reject-cancel` -> `.../cancel-request/*`; `add-note` -> `.../notes`. `print-slip` (Should, BR-ADM-39) không có endpoint: FE in từ dữ liệu đơn (`to_ship` / `to_receive`).
        Chính xác theo điều kiện: `ship` chỉ có khi đơn không cần gọi hoặc đã xác nhận; `cancel-unreachable` chỉ có khi có 3 lần gọi liên tiếp trong một cửa sổ 24 giờ 00 phút; `cancel-customer-request` có ở mọi đơn `to_ship` cho staff và admin; `cancel-other` chỉ có với admin.
    StaffRef:
      type: object
      required: [name, role]
      additionalProperties: false
      description: 'Nhân viên thực hiện (tên và vai trò chụp tại lúc làm). Không có mã người dùng.'
      properties:
        name: { type: string }
        role: { type: string, enum: [staff, admin] }
    AdminActor:
      type: object
      required: [type]
      additionalProperties: false
      description: 'Người thực hiện sự kiện. `staff` luôn có `name` + `role`; `customer` hiện "Khách"; `system` hiện "Hệ thống" (hết hạn thanh toán). Sự kiện Slice 3 sẵn có chỉ là `customer` / `system` (K11).'
      properties:
        type: { type: string, enum: [customer, system, staff] }
        name: { type: string }
        role: { type: string, enum: [staff, admin] }
    AdminEventKind:
      type: string
      enum: [placed, payment_received, call_attempt, confirmed, shipped, delivered, cancel_requested, cancel_approved, cancel_rejected, cancelled, stock_restocked, stock_written_off, note, return_requested, return_approved, return_rejected, return_received, return_refunded, return_cancelled]
      description: 'Sáu loại cuối thêm ở Slice 9 (draft): mỗi chuyển trạng thái của yêu cầu trả hàng đúng 1 sự kiện, `fromStatus = toStatus = completed`; `return_refunded` mang `paymentStatus` mới. Không bao giờ có số tài khoản.'
    AdminTimelineEntry:
      type: object
      required: [at, kind, toStatus, paymentStatus, actor, title]
      additionalProperties: false
      description: 'Một sự kiện đơn (BR-ADM-10). Mỗi thao tác thành công đúng 1 dòng, kể cả thao tác không đổi trạng thái (`fromStatus = toStatus`). Chỉ thêm, không sửa / xoá được. `AdminOrder.timeline` sắp **mới nhất trước** (khác `Order.timeline` của khách: cũ nhất trước; chủ ý).'
      properties:
        at: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/AdminEventKind' }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/OrderStatus' }, { type: 'null' }], description: 'null ở sự kiện đặt hàng.' }
        toStatus: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        actor: { $ref: '#/components/schemas/AdminActor' }
        title: { type: string, description: 'Tiêu đề tiếng Việt, ví dụ "Ghi nhận không liên lạc được", "Bàn giao vận chuyển".' }
        detail: { type: string, description: 'Phần khách cũng thấy (câu chuẩn lý do huỷ, lý do khách nhập, đơn vị + mã vận đơn, lý do từ chối yêu cầu huỷ).' }
        reasonCode: { type: string, description: 'Mã lý do huỷ (`unreachable`, `declined_on_call`, `customer_request`, `refused`, `undeliverable`, `other`) hoặc quyết định hàng hoàn (`restocked`, `written_off`).' }
        note: { type: string, description: 'Ghi chú nội bộ (tối đa 500 ký tự). Không bao giờ có ở API khách.' }
    AdminOrderSummary:
      type: object
      required: [id, placedAt, status, paymentStatus, paymentMethod, recipientName, total, itemCount, needsCall, hasCancelRequest, tab, overdue]
      additionalProperties: false
      description: 'Dòng của danh sách (BR-ADM-05).'
      properties:
        id: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        recipientName: { type: string }
        total: { type: integer, minimum: 0 }
        itemCount: { type: integer, minimum: 1, description: 'Tổng số lượng sản phẩm.' }
        needsCall: { type: boolean, description: 'Cờ "cần gọi": COD `to_ship`, cần xác nhận, chưa xác nhận.' }
        hasCancelRequest: { type: boolean, description: 'Cờ "có yêu cầu huỷ": `status = cancel_requested`.' }
        tab: { $ref: '#/components/schemas/AdminOrderBucket' }
        overdue: { type: array, items: { $ref: '#/components/schemas/AdminOverdueFlag' }, description: 'Should (BR-ADM-40). Rỗng nếu trong hạn.' }
        returnPending: { type: boolean, description: 'Slice 9 / Slice 10 (Should, BR-RET-44, 65): đơn có yêu cầu trả hàng `requested` (cả thành viên lẫn vãng lai). Có thể vắng nếu chưa làm Should.' }
    AdminOrderPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminOrderSummary' }, maxItems: 50 }
        total: { type: integer, minimum: 0, description: 'Tổng số đơn khớp bộ lọc (mọi trang).' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
    AdminOrder:
      type: object
      required: [id, placedAt, status, paymentStatus, paymentMethod, items, pricing, vouchers, recipient, shippingAddress, estimatedDelivery, tab, needsCall, callAttempts, overdue, allowedActions, timeline]
      additionalProperties: false
      description: 'Chi tiết đơn cho staff / admin (BR-ADM-09). Không có UUID nội bộ hay mã người dùng. SĐT và email đầy đủ.'
      properties:
        id: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentDueAt: { type: string, format: date-time, description: 'Chỉ khi `to_pay`.' }
        paidAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, description: 'Chỉ khi `completed`.' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        pricing: { $ref: '#/components/schemas/Pricing' }
        vouchers:
          type: array
          items:
            type: object
            required: [code, kind, amount]
            additionalProperties: false
            properties:
              code: { type: string }
              kind: { $ref: '#/components/schemas/VoucherKind' }
              amount: { type: integer, minimum: 0 }
        recipient:
          type: object
          required: [name, phone, email]
          additionalProperties: false
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
        shippingAddress:
          type: object
          required: [street, ward, province]
          additionalProperties: false
          properties:
            street: { type: string }
            ward: { type: string }
            province: { type: string }
        note: { type: string, description: 'Ghi chú giao hàng của khách.' }
        invoice: { $ref: '#/components/schemas/Invoice' }
        estimatedDelivery:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        tab: { $ref: '#/components/schemas/AdminOrderBucket' }
        needsCall: { type: boolean, description: 'Cần gọi xác nhận (COD `to_ship`, `needsConfirmCall`, chưa xác nhận).' }
        confirmation:
          type: object
          required: [confirmedAt, confirmedBy]
          additionalProperties: false
          description: 'Có sau khi khách xác nhận (BR-ADM-17).'
          properties:
            confirmedAt: { type: string, format: date-time }
            confirmedBy: { $ref: '#/components/schemas/StaffRef' }
        callAttempts:
          type: object
          required: [total, inFirstDay]
          additionalProperties: false
          description: 'Đếm "không liên lạc được" (BR-ADM-16, 18). `inFirstDay` (tên giữ để tương thích FE) = số lần lớn nhất nằm trong một cửa sổ 24 giờ 00 phút bất kỳ (lần cuối trừ lần đầu <= 24 giờ); huỷ `unreachable` cần `inFirstDay >= 3`.'
          properties:
            total: { type: integer, minimum: 0 }
            inFirstDay: { type: integer, minimum: 0 }
            firstAt: { type: string, format: date-time }
            lastAt: { type: string, format: date-time }
        shipment:
          type: object
          required: [carrier, trackingNumber, handedOverAt, handedOverBy]
          additionalProperties: false
          properties:
            carrier: { type: string }
            trackingNumber: { type: string }
            handedOverAt: { type: string, format: date-time }
            handedOverBy: { $ref: '#/components/schemas/StaffRef' }
        cancellation:
          type: object
          required: [by, at]
          additionalProperties: false
          description: 'Chỉ khi `cancelled`.'
          properties:
            by: { $ref: '#/components/schemas/CancelledBy' }
            at: { type: string, format: date-time }
            reasonCode: { type: string, enum: [unreachable, declined_on_call, customer_request, refused, undeliverable, other], description: 'Chỉ khi huỷ qua `.../cancel`: `by = shop`, trừ `customer_request` (`by = customer`).' }
            reason: { type: string, description: 'Câu hiển thị cho khách (= `Order.cancelReason`).' }
            note: { type: string, description: 'Ghi chú nội bộ (bắt buộc với `other`).' }
        cancelRequest:
          type: object
          required: [requestedAt, outcome]
          additionalProperties: false
          description: 'Có khi khách đã gửi yêu cầu huỷ (BR-ADM-29..31).'
          properties:
            requestedAt: { type: string, format: date-time }
            reason: { type: string, description: 'Lý do khách nhập (tuỳ chọn).' }
            outcome: { type: string, enum: [pending, approved, rejected] }
            decidedAt: { type: string, format: date-time }
            decidedBy: { $ref: '#/components/schemas/StaffRef' }
            rejectReason: { type: string }
        returnHandling:
          type: object
          required: [state]
          additionalProperties: false
          description: 'Chỉ có với đơn `cancelled` từ `to_receive` (BR-ADM-26, 27; S4-Q2). `pending` = tab `returning`.'
          properties:
            state: { type: string, enum: [pending, restocked, written_off] }
            decidedAt: { type: string, format: date-time }
            decidedBy: { $ref: '#/components/schemas/StaffRef' }
            note: { type: string }
        stockRestoredAt: { type: string, format: date-time, description: 'Dấu "đã cộng lại tồn" (đúng một lần). Không có nghĩa là hết hiệu lực khi huỷ từ `to_receive` và `written_off`.' }
        deliveryRefusedAt: { type: string, format: date-time, description: 'Có khi huỷ `refused`; nguồn của giới hạn COD (BR-CHK-19).' }
        overdue: { type: array, items: { $ref: '#/components/schemas/AdminOverdueFlag' } }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AdminOrderAction' } }
        timeline: { type: array, items: { $ref: '#/components/schemas/AdminTimelineEntry' }, description: 'Mới nhất trước (BR-ADM-10).' }
        return: { allOf: [{ $ref: '#/components/schemas/AdminReturn' }], description: 'Slice 9 (draft, BR-RET-42). Yêu cầu không-`cancelled` mới nhất (hoặc yêu cầu huỷ mới nhất nếu chỉ có huỷ); vắng nếu đơn chưa có yêu cầu. Số tài khoản đầy đủ theo quy tắc `AdminReturnRefundTo`.' }
    AdminExpectedStatusRequest:
      type: object
      required: [expectedStatus]
      additionalProperties: false
      properties:
        expectedStatus:
          $ref: '#/components/schemas/OrderStatus'
          description: 'Trạng thái đơn người thao tác đang thấy; khác trạng thái hiện tại -> `409 order-state-changed`. Thiếu / sai giá trị -> `422 validation`, `field: expectedStatus`.'
    AdminCallAttemptRequest:
      type: object
      required: [expectedStatus]
      additionalProperties: false
      properties:
        expectedStatus: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: string, maxLength: 250, description: 'Ghi chú nội bộ tuỳ chọn; trim; > 250 -> `422`, `field: note`.' }
    AdminShipRequest:
      type: object
      required: [expectedStatus, carrier, trackingNumber]
      additionalProperties: false
      properties:
        expectedStatus: { $ref: '#/components/schemas/OrderStatus' }
        carrier: { type: string, minLength: 2, maxLength: 50, description: 'Đơn vị vận chuyển (trim); nhập tự do (S4-Q5).', examples: ['GHTK'] }
        trackingNumber: { type: string, minLength: 4, maxLength: 40, pattern: '^[A-Za-z0-9-]+$', description: 'Server trim, lưu chữ hoa.', examples: ['ghtk-12345'] }
    AdminCancelReason:
      type: string
      enum: [unreachable, declined_on_call, customer_request, refused, undeliverable, other]
    AdminCancelRequest:
      type: object
      required: [expectedStatus, reason]
      additionalProperties: false
      properties:
        expectedStatus: { $ref: '#/components/schemas/OrderStatus' }
        reason: { $ref: '#/components/schemas/AdminCancelReason' }
        note: { type: string, maxLength: 250, description: 'Ghi chú nội bộ; bắt buộc 5-250 ký tự (sau trim) khi `reason` = `other` hoặc `customer_request`, tuỳ chọn <= 250 ở các lý do còn lại. Không bao giờ gửi cho khách.' }
    AdminReturnedStockRequest:
      type: object
      required: [expectedStatus, decision]
      additionalProperties: false
      properties:
        expectedStatus:
          $ref: '#/components/schemas/OrderStatus'
          description: 'Luôn `cancelled`.'
        decision: { type: string, enum: [restocked, written_off] }
        note: { type: string, maxLength: 250, description: 'Bắt buộc 5-250 ký tự khi `written_off`; tuỳ chọn khi `restocked`.' }
    AdminRejectCancelRequest:
      type: object
      required: [expectedStatus, reason]
      additionalProperties: false
      properties:
        expectedStatus:
          $ref: '#/components/schemas/OrderStatus'
          description: 'Luôn `cancel_requested`.'
        reason: { type: string, minLength: 5, maxLength: 250, description: 'Sau trim. Hiển thị cho khách.' }
    AdminNoteRequest:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { type: string, minLength: 1, maxLength: 500, description: 'Sau trim.' }
    AccountProfile:
      type: object
      required: [email, firstName, lastName, birthDate, phone, hasPassword]
      additionalProperties: false
      properties:
        email: { type: string }
        firstName: { type: string, description: 'Tên (vd. "Minh").' }
        lastName: { type: string, description: 'Họ và tên đệm (vd. "Nguyễn Văn"). FE hiện "Họ và tên" = lastName + " " + firstName.' }
        birthDate: { type: [string, 'null'], format: date }
        phone: { type: [string, 'null'], pattern: '^0(3|5|7|8|9)[0-9]{8}$' }
        hasPassword: { type: boolean }
    AccountProfileUpdate:
      type: object
      minProperties: 1
      properties:
        birthDate: { type: [string, 'null'], format: date }
        phone: { type: [string, 'null'] }
    AccountPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: [string, 'null'], maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 64 }
    AddressInput:
      type: object
      required: [recipient, phone, provinceCode, wardCode, street]
      properties:
        recipient: { type: string, minLength: 1, maxLength: 100, description: 'NFC, trim, gộp khoảng trắng.' }
        phone: { type: string, description: 'BR-CHK-04.' }
        provinceCode: { type: string, maxLength: 10 }
        wardCode: { type: string, maxLength: 10 }
        street: { type: string, minLength: 5, maxLength: 200 }
        isDefault: { type: boolean, default: false }
        isReturn: { type: boolean, description: 'Bỏ qua (Won''t, PRD Slice 5 K5).' }
    Address:
      type: object
      required: [id, recipient, phone, province, ward, street, isDefault, isReturn]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        recipient: { type: string }
        phone: { type: string }
        province: { $ref: '#/components/schemas/Location' }
        ward: { $ref: '#/components/schemas/Location' }
        street: { type: string }
        isDefault: { type: boolean }
        isReturn: { type: boolean, const: false }
    Membership:
      type: object
      required: [tier, spent, nextTierAt, reviewDate]
      additionalProperties: false
      description: 'Slice 9 (draft, BR-RET-53): `spent` = Σ (`total` - tiền hàng đã hoàn - phí giao đã hoàn) của đơn `completed` trong năm (yêu cầu `refunded`); KHÔNG trừ phí gửi trả; hạng tính lại ở lần gọi sau (có thể hạ).'
      properties:
        tier: { type: string, enum: [bronze, silver, gold] }
        spent: { type: integer, minimum: 0 }
        nextTierAt: { type: [integer, 'null'] }
        reviewDate: { type: string, format: date }
    MemberVoucher:
      type: object
      required: [id, code, headline, subline, conditions, expiresAt]
      additionalProperties: false
      properties:
        id: { type: string }
        code: { type: string }
        headline: { type: string, examples: ['Giảm 15%'] }
        subline: { type: string, examples: ['tối đa 200.000 ₫'] }
        conditions: { type: string, examples: ['Đơn từ 500.000 ₫ · Chỉ thành viên'] }
        expiresAt: { type: [string, 'null'], format: date-time }
    AdminCategory:
      type: object
      required: [id, slug, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, examples: [tops] }
        name: { type: string }
    AdminProductStatus:
      type: string
      enum: [active, draft, hidden]
      description: 'Slice 6, K1: `active` = `ACTIVE`, `draft` = `DRAFT`, `hidden` = `ARCHIVED` (chữ FE "Đã ẩn").'
    AdminImageRef:
      type: object
      required: [id, url]
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 100 }
        url:
          type: [string, 'null']
          description: 'Ảnh tải lên: đường dẫn công khai `/api/media/{id}`. Ảnh thư viện (id có trong media manifest của FE): `null`, FE tự tra manifest (BR-INV-27).'
    AdminProductImage:
      type: object
      required: [id, url, alt, color]
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 100 }
        url: { type: [string, 'null'] }
        alt: { type: string, maxLength: 125, description: 'Trống = dùng tên sản phẩm khi hiển thị.' }
        color: { type: string, maxLength: 50, description: 'Tên màu của sản phẩm mà ảnh này thể hiện; rỗng = mọi màu.' }
    UploadedImage:
      type: object
      required: [id, url, alt, color, width, height, size, contentType]
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 100, pattern: '^up-[0-9a-f]{32}\.(jpg|png|webp)$' }
        url: { type: string, examples: ['/api/media/up-0123456789abcdef0123456789abcdef.webp'] }
        alt: { type: string, const: '' }
        color: { type: string, const: '' }
        width: { type: integer }
        height: { type: integer }
        size: { type: integer, description: Byte. }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    AdminColor:
      type: object
      required: [name, hex]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: 'Lưu và trả chữ hoa.' }
    AdminVariantInput:
      type: object
      required: [sku, color, size]
      description: 'Trường lạ (`price`, `cost`...) bị bỏ qua.'
      properties:
        id: { type: string, description: 'Có = sửa biến thể này; không = tạo mới.' }
        sku: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9-]+$', description: 'Chuyển chữ hoa; duy nhất toàn hệ thống.' }
        color: { $ref: '#/components/schemas/AdminColor' }
        size: { type: string, enum: [S, M, L, XL] }
        inventory: { type: integer, minimum: 0, maximum: 100000, description: 'Chỉ dùng cho biến thể MỚI (tồn ban đầu, mặc định 0). Với biến thể đã có: bỏ qua.' }
    AdminVariant:
      type: object
      required: [id, sku, color, size, inventory, hasOrders]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        color: { $ref: '#/components/schemas/AdminColor' }
        size: { type: string }
        inventory: { type: integer, minimum: 0, description: 'Có thể bán (`inventory_qty`).' }
        hasOrders: { type: boolean, description: 'Đã có dòng đơn: khoá SKU, không bỏ được (FE `stockLocked`).' }
    AdminProductInput:
      type: object
      required: [name, type, category, price, variants]
      description: 'Phần sửa được của sản phẩm. Quy tắc BR-INV-11: chuỗi NFC, cắt hai đầu, gộp khoảng trắng; `name` 1-120; `type` 1-120; `description` <= 5.000; `material` <= 500; `care` <= 10 dòng, mỗi dòng 1-200; `fitSummary` <= 500; `price` nguyên 1.000..100.000.000; `compareAtPrice` null hoặc nguyên > `price` và <= 100.000.000. Slice 10 (BR-PROMO-01, 05): `salePrice` / `saleStartsAt` / `saleEndsAt` — khoá VẮNG = giữ nguyên đợt; cả ba `null` = gỡ đợt; cả ba có giá trị = đặt (ghi đè); thiếu một hoặc sai khoảng (`salePrice` ngoài [1.000, `price`), kết thúc < bắt đầu, dài > 90 ngày) -> `422` theo trường; `price` mới <= `salePrice` hiện có -> `422`, `field: salePrice`; có trường `sale*` cần thêm quyền `promotions.write`. Sai -> `422 validation` + `field`.'
      properties:
        slug: { type: string, minLength: 3, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: 'Trống / vắng = tự sinh (tạo) hoặc giữ nguyên (sửa).' }
        name: { type: string }
        type: { type: string, description: 'FE `type` = cột `type_label`.' }
        description: { type: string, default: '' }
        status: { $ref: '#/components/schemas/AdminProductStatus' }
        category: { type: string, description: 'Slug danh mục (phải tồn tại).' }
        genders: { type: array, items: { $ref: '#/components/schemas/Gender' }, uniqueItems: true }
        moments: { type: array, items: { $ref: '#/components/schemas/Moment' }, uniqueItems: true }
        price: { type: integer }
        compareAtPrice: { type: [integer, 'null'] }
        salePrice: { type: [integer, 'null'], description: 'Slice 10 (BR-PROMO-01). Giá giảm có hạn, nguyên, 1.000 <= salePrice < price. Cả ba trường `sale*` cùng có hoặc cùng `null`.' }
        saleStartsAt: { type: [string, 'null'], description: 'Slice 10. Đầu đợt: nhận ngày `YYYY-MM-DD` (giờ VN, = 00:00:00) hoặc ISO UTC đúng 00:00:00 giờ VN; trả về ISO UTC.' }
        saleEndsAt: { type: [string, 'null'], description: 'Slice 10. Cuối đợt: nhận ngày `YYYY-MM-DD` (giờ VN, = 23:59:59, gồm cả ngày đó) hoặc ISO UTC đúng 23:59:59 giờ VN; <= bắt đầu + 89 ngày; trả về ISO UTC.' }
        material: { type: string, default: '' }
        care: { type: array, maxItems: 10, items: { type: string } }
        fitSummary: { type: string, default: '' }
        images:
          type: array
          maxItems: 12
          description: 'Thứ tự = thứ tự hiển thị; phần tử đầu = ảnh bìa; gallery = toàn bộ; `color_media[màu]` = ảnh đầu tiên gắn màu đó.'
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, maxLength: 100 }
              alt: { type: string, maxLength: 125 }
              color: { type: string, maxLength: 50 }
        variants:
          type: array
          minItems: 0
          maxItems: 32
          items: { $ref: '#/components/schemas/AdminVariantInput' }
          description: '<= 32 biến thể, <= 8 màu (tên không trùng, không phân biệt hoa thường), size thuộc S/M/L/XL, (màu, size) không trùng.'
    AdminProductUpdate:
      allOf:
        - $ref: '#/components/schemas/AdminProductInput'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time, description: '`updatedAt` của lần đọc gần nhất (so ở mức mili-giây). Khác bản hiện tại -> `409 version-conflict`.' }
    AdminProduct:
      type: object
      required: [id, slug, name, type, description, status, category, genders, moments, price, compareAtPrice, salePrice, saleStartsAt, saleEndsAt, saleState, material, care, fitSummary, images, colors, sizes, variants, published, slugLocked, publishedAt, createdAt, updatedAt, updatedBy]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/AdminProductStatus' }
        category: { type: string, description: Slug. }
        genders: { type: array, items: { $ref: '#/components/schemas/Gender' } }
        moments: { type: array, items: { $ref: '#/components/schemas/Moment' } }
        price: { type: integer }
        compareAtPrice: { type: [integer, 'null'] }
        salePrice: { type: [integer, 'null'] }
        saleStartsAt: { type: [string, 'null'], format: date-time }
        saleEndsAt: { type: [string, 'null'], format: date-time }
        saleState: { $ref: '#/components/schemas/SaleState' }
        material: { type: string }
        care: { type: array, items: { type: string } }
        fitSummary: { type: string }
        images: { type: array, items: { $ref: '#/components/schemas/AdminProductImage' } }
        colors: { type: array, items: { $ref: '#/components/schemas/AdminColor' }, description: 'Suy ra từ biến thể, theo thứ tự xuất hiện.' }
        sizes: { type: array, items: { type: string }, description: 'Suy ra từ biến thể (S, M, L, XL).' }
        variants: { type: array, items: { $ref: '#/components/schemas/AdminVariant' } }
        published: { type: boolean, description: '`published_at` có giá trị (đã từng công khai).' }
        slugLocked: { type: boolean, description: 'Bằng `published` (BR-INV-13).' }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          description: 'BR-INV-23 (Should). Null nếu chưa có hoặc tài khoản đã xoá.'
          oneOf:
            - type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
            - type: 'null'
    AdminProductSummary:
      type: object
      required: [id, slug, name, coverImage, status, category, categoryName, price, compareAtPrice, inventory, variantCount, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        coverImage:
          oneOf:
            - $ref: '#/components/schemas/AdminImageRef'
            - type: 'null'
        status: { $ref: '#/components/schemas/AdminProductStatus' }
        category: { type: string, description: Slug. }
        categoryName: { type: string }
        price: { type: integer }
        compareAtPrice: { type: [integer, 'null'] }
        saleState: { $ref: '#/components/schemas/SaleState' }
        inventory: { type: integer, minimum: 0, description: 'Tổng có thể bán của mọi biến thể.' }
        variantCount: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    AdminProductPage:
      type: object
      required: [items, total, page, limit, counts]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminProductSummary' }, maxItems: 100 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        counts:
          type: object
          required: [all, active, draft, hidden, out-of-stock]
          additionalProperties: false
          properties:
            all: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            draft: { type: integer, minimum: 0 }
            hidden: { type: integer, minimum: 0 }
            out-of-stock: { type: integer, minimum: 0, description: 'Mọi trạng thái sản phẩm có >= 1 biến thể có thể bán = 0.' }
    AdminStockStatus:
      type: string
      enum: [in, low, out]
      description: '`out`: có thể bán = 0; `low`: 1..ngưỡng; `in`: > ngưỡng (BR-INV-29).'
    AdminInventoryItem:
      type: object
      required: [variantId, productId, productName, productStatus, image, color, size, sku, onHand, reserved, available, lowStockThreshold, thresholdCustom, category, status]
      additionalProperties: false
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        productStatus: { $ref: '#/components/schemas/AdminProductStatus' }
        image:
          oneOf:
            - $ref: '#/components/schemas/AdminImageRef'
            - type: 'null'
          description: 'Ảnh theo màu của biến thể, thiếu thì ảnh bìa.'
        color: { $ref: '#/components/schemas/AdminColor' }
        size: { type: string }
        sku: { type: string }
        onHand: { type: integer, minimum: 0, description: 'Trong kho = available + reserved.' }
        reserved: { type: integer, minimum: 0, description: 'Đang giữ: tổng số lượng dòng đơn `to_pay`, `to_ship`, `cancel_requested`.' }
        available: { type: integer, minimum: 0, description: 'Có thể bán = `inventory_qty`.' }
        lowStockThreshold: { type: integer, minimum: 0, maximum: 1000 }
        thresholdCustom: { type: boolean }
        category: { type: string, description: Slug. }
        status: { $ref: '#/components/schemas/AdminStockStatus' }
    AdminInventoryPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminInventoryItem' }, maxItems: 100 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    AdminInventoryFacets:
      type: object
      required: [categories, colors, sizes, counts, defaultThreshold, customCount]
      additionalProperties: false
      properties:
        categories:
          type: array
          items:
            type: object
            required: [value, label]
            additionalProperties: false
            properties:
              value: { type: string, description: Slug. }
              label: { type: string }
        colors: { type: array, items: { $ref: '#/components/schemas/AdminColor' }, description: 'Màu phân biệt theo tên (không phân biệt hoa thường).' }
        sizes: { type: array, items: { type: string } }
        counts:
          type: object
          required: [all, in, low, out]
          additionalProperties: false
          properties:
            all: { type: integer, minimum: 0 }
            in: { type: integer, minimum: 0 }
            low: { type: integer, minimum: 0 }
            out: { type: integer, minimum: 0 }
        defaultThreshold: { type: integer, minimum: 0, maximum: 1000, description: 'Mặc định 5.' }
        customCount: { type: integer, minimum: 0, description: 'Số SKU có ngưỡng riêng.' }
    AdminInventoryAdjustment:
      type: object
      required: [mode, quantity, reason]
      description: 'Trường lạ bị bỏ qua.'
      properties:
        mode: { type: string, enum: [delta, set] }
        quantity: { type: integer, description: '`delta`: số có dấu khác 0, |.| <= 10.000. `set`: số Trong kho đếm được 0..100.000.' }
        reason: { type: string, enum: [received, return, damaged, count, correction] }
        note: { type: string, maxLength: 200, default: '' }
        expectedAvailable: { type: integer, minimum: 0, description: 'Bắt buộc khi `mode = set`: Có thể bán FE đang thấy. Với `delta`: bỏ qua.' }
    AdminInventoryMovement:
      type: object
      required: [id, at, change, after, reason, note, author]
      additionalProperties: false
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        change: { type: integer }
        after: { type: [integer, 'null'], description: 'Có thể bán sau thay đổi. Null với biến động do đơn (`order`, `cancel`).' }
        reason: { type: string, enum: [received, return, damaged, count, correction, order, cancel] }
        note: { type: string }
        author: { type: string, description: 'Tên người làm lúc đó (chụp lại); "Hệ thống" / "Khách" với biến động do đơn.' }
        authorRole: { type: [string, 'null'], enum: [staff, admin, null] }
    AdminPromotionState:
      type: string
      enum: [running, scheduled, expired, disabled]
      description: 'Tính lúc đọc, theo thứ tự: `disabled` -> `scheduled` (bắt đầu > bây giờ) -> `expired` (kết thúc <= bây giờ, hoặc tổng lượt có giá trị và `used` >= tổng lượt) -> `running`. `startsAt` null (voucher cũ) coi như đã bắt đầu.'
    AdminPromotionInput:
      type: object
      required: [code, title, type, minSubtotal, perCustomerLimit, enabled]
      description: |
        Chuẩn hoá: `code` bỏ khoảng trắng + chữ hoa. Quy tắc theo `type` (BR-INV-39): `percent`: `value` 1..90, `maxDiscount` null hoặc 1.000..10.000.000; `fixed`: `value` 1.000..10.000.000, `maxDiscount` null; `free-shipping`: `value` và `maxDiscount` null. `title` 1..100; `minSubtotal` 0..100.000.000; `usageLimit` null hoặc 1..1.000.000; `perCustomerLimit` 1..10; `categories` <= 1 slug tồn tại; `audience` chỉ `everyone` | `members` (giá trị khác của FE như `tiers`, `customers`, `private` -> `422 audience`); giờ Việt Nam khi hiển thị, API dùng ISO 8601 có múi giờ. Trường FE `tiers`, `customerIds` bị bỏ qua / 422 nếu khác rỗng.
      properties:
        code: { type: string }
        title: { type: string }
        type: { type: string, enum: [percent, fixed, free-shipping] }
        value: { type: [integer, 'null'] }
        maxDiscount: { type: [integer, 'null'] }
        minSubtotal: { type: integer }
        categories: { type: array, maxItems: 1, items: { type: string }, description: 'Rỗng = mọi danh mục (`category_id` null).' }
        usageLimit: { type: [integer, 'null'] }
        perCustomerLimit: { type: integer }
        audience: { type: string, enum: [everyone, members], default: everyone }
        firstOrderOnly: { type: boolean, default: false }
        excludeSaleItems: { type: boolean, default: false }
        startsAt: { type: [string, 'null'], format: date-time, description: 'Trống / null khi tạo = lúc tạo.' }
        endsAt: { type: [string, 'null'], format: date-time }
        enabled: { type: boolean }
    AdminPromotionUpdate:
      allOf:
        - $ref: '#/components/schemas/AdminPromotionInput'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    AdminPromotion:
      type: object
      required: [id, code, title, type, value, maxDiscount, minSubtotal, categories, usageLimit, perCustomerLimit, audience, firstOrderOnly, excludeSaleItems, used, hasRedemptions, startsAt, endsAt, enabled, state, createdAt, updatedAt, updatedBy]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        type: { type: string, enum: [percent, fixed, free-shipping] }
        value: { type: [integer, 'null'] }
        maxDiscount: { type: [integer, 'null'] }
        minSubtotal: { type: integer }
        categories: { type: array, maxItems: 1, items: { type: string } }
        usageLimit: { type: [integer, 'null'] }
        perCustomerLimit: { type: integer }
        audience: { type: string, enum: [everyone, members] }
        firstOrderOnly: { type: boolean }
        excludeSaleItems: { type: boolean }
        used: { type: integer, minimum: 0, description: '`used_count`.' }
        hasRedemptions: { type: boolean, description: 'Có >= 1 bản ghi lượt dùng (kể cả đã trả): khoá loại / giá trị / giảm tối đa và không xoá được.' }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        enabled: { type: boolean }
        state: { $ref: '#/components/schemas/AdminPromotionState' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          oneOf:
            - type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
            - type: 'null'
    AdminPromotionPage:
      type: object
      required: [items, total, page, limit, counts]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminPromotion' }, maxItems: 100 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        counts:
          type: object
          required: [all, running, scheduled, expired, disabled]
          additionalProperties: false
          properties:
            all: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            scheduled: { type: integer, minimum: 0 }
            expired: { type: integer, minimum: 0 }
            disabled: { type: integer, minimum: 0 }
    AdminCustomerTier:
      type: string
      enum: [bronze, silver, gold]
      description: 'Slice 7. Hạng theo BR-ACC-15 (`bronze` = "Đồng", `silver` = "Bạc", `gold` = "Vàng"); FE hiện dùng `member` cho Đồng nên phải ánh xạ.'
    AdminCustomerSummary:
      type: object
      required: [id, name, email, phone, contactMasked, tier, orderCount, totalSpent, lastOrderAt, status]
      additionalProperties: false
      description: 'Slice 7, dòng của danh sách khách (BR-USR-08).'
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: '`lastName firstName` đã ghép.' }
        email: { type: string, description: 'Admin: đầy đủ. Staff: dạng `mi***@gmail.com` (giữ 2 ký tự đầu của phần tên, 1 ký tự nếu phần tên <= 2).' }
        phone: { type: [string, 'null'], description: 'Admin: đầy đủ. Staff: dạng `0912 *** 678` (4 số đầu, 3 số cuối). null nếu khách chưa có SĐT.' }
        contactMasked: { type: boolean, description: 'true khi người gọi là staff (FE hiện "Liên hệ được ẩn bớt theo quyền của bạn.").' }
        tier: { $ref: '#/components/schemas/AdminCustomerTier' }
        orderCount: { type: integer, minimum: 0, description: 'Số đơn có `user_id` của khách, trừ `cancelled`.' }
        totalSpent: { type: integer, minimum: 0, description: 'Tổng `total` (đồng) các đơn `completed` của khách, mọi thời gian.' }
        lastOrderAt: { type: [string, 'null'], format: date-time, description: 'Thời điểm đặt gần nhất trong các đơn tính ở `orderCount`; null nếu 0 đơn.' }
        status: { type: string, enum: [active, blocked] }
    AdminCustomerPage:
      type: object
      required: [items, total, page, limit, counts]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminCustomerSummary' }, maxItems: 50 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
        counts:
          type: object
          required: [all, blocked]
          additionalProperties: false
          properties:
            all: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
    AdminCustomerAddress:
      type: object
      required: [recipient, phone, line, isDefault]
      additionalProperties: false
      description: 'Slice 7, chỉ admin (BR-USR-12, Should), chỉ đọc.'
      properties:
        recipient: { type: string }
        phone: { type: string }
        line: { type: string, description: 'Số nhà + phường / xã + tỉnh / thành đã ghép.' }
        isDefault: { type: boolean }
    AdminCustomer:
      description: 'Slice 7, chi tiết khách (BR-USR-10). Mở rộng `AdminCustomerSummary`. `birthDate` và `addresses` CHỈ có khi người gọi là admin (với staff vắng khoá, BR-USR-11). Không có `note`, `tags`, `returnCount`, `usualSizes`, `averageOrderValue` (Won''t, K2).'
      allOf:
        - $ref: '#/components/schemas/AdminCustomerSummary'
        - type: object
          required: [createdAt, marketingOptIn, spentThisYear, recentOrders]
          properties:
            createdAt: { type: string, format: date-time }
            marketingOptIn: { type: boolean }
            spentThisYear: { type: integer, minimum: 0, description: 'Chi tiêu năm dương lịch hiện tại (giờ VN) làm căn cứ hạng; khớp `GET /account/membership` của chính khách.' }
            birthDate: { type: [string, 'null'], format: date, description: 'Chỉ admin.' }
            addresses: { type: array, items: { $ref: '#/components/schemas/AdminCustomerAddress' }, description: 'Chỉ admin. Mặc định đứng đầu, rồi tạo trước.' }
            recentOrders: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/AdminOrderSummary' }, description: '10 đơn mới nhất của khách (kể cả `cancelled`), mới trước.' }
    AdminLockInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 5, maxLength: 250, description: 'NFC, cắt hai đầu; sai độ dài -> `422`, `field: reason`.' }
    AdminUnlockInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 250, description: 'Tuỳ chọn.' }
    AdminStaffRole:
      type: string
      enum: [staff, admin]
    AdminStaffMember:
      type: object
      required: [id, name, email, role, status, passwordSet, createdAt, lastActiveAt]
      additionalProperties: false
      description: 'Slice 7 (BR-USR-18). Chỉ admin nhận; email đầy đủ. Không chứa `password_hash`.'
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: '`lastName firstName` đã ghép; tạo "Trần Thu Hà" -> hiển thị lại đúng "Trần Thu Hà".' }
        email: { type: string }
        role: { $ref: '#/components/schemas/AdminStaffRole' }
        status: { type: string, enum: [active, disabled] }
        passwordSet: { type: boolean, description: 'false = "Chờ đặt mật khẩu" (BR-USR-25).' }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time, description: '`last_used_at` lớn nhất trong các phiên (cả đã thu hồi); null nếu chưa từng đăng nhập.' }
    AdminStaffInput:
      type: object
      required: [name, email, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, maxLength: 254, description: 'Cắt hai đầu + chữ thường rồi mới kiểm.' }
        role: { $ref: '#/components/schemas/AdminStaffRole' }
    AdminStaffRoleInput:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/AdminStaffRole' }
        reason: { type: string, maxLength: 250 }
    AdminAccountEvent:
      type: object
      required: [id, at, action, actor, target, roleBefore, roleAfter, reason, sessionsRevoked]
      additionalProperties: false
      description: 'Slice 7, một dòng nhật ký thao tác tài khoản (BR-USR-24). Giá trị người / đích là ảnh chụp lúc làm.'
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        action: { type: string, enum: [staff-created, locked, unlocked, role-changed] }
        actor:
          type: object
          required: [id, name, role]
          additionalProperties: false
          properties:
            id: { type: [string, 'null'], format: uuid }
            name: { type: string }
            role: { $ref: '#/components/schemas/AdminStaffRole' }
        target:
          type: object
          required: [id, email, name, role]
          additionalProperties: false
          properties:
            id: { type: [string, 'null'], format: uuid }
            email: { type: string }
            name: { type: string }
            role: { type: string, enum: [member, staff, admin] }
        roleBefore: { type: [string, 'null'], enum: [staff, admin, null], description: 'Có khi `role-changed`; null ở các hành động khác.' }
        roleAfter: { type: [string, 'null'], enum: [staff, admin, null], description: 'Có khi `role-changed` hoặc `staff-created`.' }
        reason: { type: string, description: 'Rỗng nếu không có lý do.' }
        sessionsRevoked: { type: integer, minimum: 0 }
    DashboardRange:
      type: string
      enum: [today, 7d, 30d]
      default: today
      description: 'Slice 8 (BR-DSH-01).'
    AdminKpiValue:
      type: object
      required: [value, change]
      additionalProperties: false
      description: 'Slice 8. `value`: số nguyên (đồng hoặc số đơn / khách). `change` = (kỳ này - kỳ trước) / kỳ trước, làm tròn half-up 4 chữ số thập phân; `null` khi kỳ trước bằng 0 (FE hiện "—").'
      properties:
        value: { type: integer, minimum: 0 }
        change: { type: [number, 'null'], minimum: -1 }
    AdminDashboardTodo:
      type: object
      required: [toConfirm, pendingPayment, toFulfil, inTransit, cancelRequests, returning, lateDelivery, lowStock, outOfStock, returnRequested, returnApproved, returnReceived]
      additionalProperties: false
      description: 'Slice 8 (BR-DSH-03..05). Tại lúc gọi, không phụ thuộc `range`. Sáu số đầu = số tab cùng tên của `GET /admin/orders/counts` (`to-confirm`, `pending-payment`, `to-fulfil`, `in-transit`, `cancel-requests`, `returning`); `lowStock` / `outOfStock` = số tab "Sắp hết" / "Hết hàng" của Tồn kho (cùng hàm đếm, ngưỡng riêng SKU hoặc `low_stock_default`).'
      properties:
        toConfirm: { type: integer, minimum: 0 }
        pendingPayment: { type: integer, minimum: 0 }
        toFulfil: { type: integer, minimum: 0 }
        inTransit: { type: integer, minimum: 0 }
        cancelRequests: { type: integer, minimum: 0 }
        returning: { type: integer, minimum: 0 }
        lateDelivery: { type: integer, minimum: 0, description: 'Should (BR-DSH-05): đơn `to_receive` có `estimated_to` sớm hơn hôm nay (VN).' }
        lowStock: { type: integer, minimum: 0 }
        outOfStock: { type: integer, minimum: 0 }
        returnRequested: { type: integer, minimum: 0, description: 'Slice 9 (draft, BR-RET-50): số yêu cầu trả hàng `requested` (tab Chờ duyệt của `GET /admin/returns`). Cả staff và admin; không phụ thuộc `range`.' }
        returnApproved: { type: integer, minimum: 0, description: 'Slice 9 (draft): số yêu cầu `approved` (Chờ nhận hàng).' }
        returnReceived: { type: integer, minimum: 0, description: 'Slice 9 (draft): số yêu cầu `received` (Chờ hoàn tiền).' }
    AdminDashboardPeriod:
      type: object
      required: [from, to, previousFrom, previousTo]
      additionalProperties: false
      description: 'Slice 8, chỉ admin. Nửa mở [from, to) tính bằng ISO UTC. `today`: `from` = 00:00 VN hôm nay, `to` = `generatedAt`; kỳ trước = cùng khoảng giờ của cùng thứ tuần trước. `7d` / `30d`: `to` = 00:00 VN ngày mai; kỳ trước = 7 / 30 ngày liền trước.'
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        previousFrom: { type: string, format: date-time }
        previousTo: { type: string, format: date-time }
    AdminRevenuePoint:
      type: object
      required: [date, revenue, previous]
      additionalProperties: false
      properties:
        date: { type: string, format: date, description: 'Ngày VN `YYYY-MM-DD`.' }
        revenue: { type: integer, minimum: 0 }
        previous: { type: integer, minimum: 0, description: 'Doanh thu của cùng vị trí trong 30 ngày liền trước.' }
    AdminTopProduct:
      type: object
      required: [productId, name, image, units, revenue]
      additionalProperties: false
      properties:
        productId: { type: string, format: uuid }
        name: { type: string, description: 'Tên chụp trên dòng đơn mới nhất của sản phẩm trong khoảng.' }
        image:
          oneOf:
            - $ref: '#/components/schemas/AdminImageRef'
            - type: 'null'
          description: 'Ảnh bìa hiện tại của sản phẩm, thiếu thì `media_id` của dòng đơn.'
        units: { type: integer, minimum: 1 }
        revenue: { type: integer, minimum: 0 }
    AdminDashboard:
      type: object
      required: [generatedAt, orders, todo]
      additionalProperties: false
      description: |
        Slice 8 (BR-DSH-02, 06, 07). staff: CHỈ `generatedAt`, `orders`, `todo`. admin: thêm mọi khoá còn lại. Máy chủ không bao giờ gửi `returnRate`, `deliveryFailed`, `returnRequests` (Won't).
      properties:
        generatedAt: { type: string, format: date-time }
        orders: { $ref: '#/components/schemas/AdminKpiValue' }
        todo: { $ref: '#/components/schemas/AdminDashboardTodo' }
        range: { $ref: '#/components/schemas/DashboardRange' }
        period: { $ref: '#/components/schemas/AdminDashboardPeriod' }
        revenue: { $ref: '#/components/schemas/AdminKpiValue' }
        completedOrders: { $ref: '#/components/schemas/AdminKpiValue' }
        averageOrderValue: { $ref: '#/components/schemas/AdminKpiValue' }
        newCustomers: { $ref: '#/components/schemas/AdminKpiValue' }
        revenueSeries:
          type: array
          minItems: 30
          maxItems: 30
          items: { $ref: '#/components/schemas/AdminRevenuePoint' }
        topProducts:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/AdminTopProduct' }
    AdminReportFigure:
      type: object
      required: [value, previous]
      additionalProperties: false
      description: 'Slice 8. `previous`: giá trị kỳ trước, `null` khi kỳ trước không có đơn nào thuộc nhóm đó (nhóm doanh thu: không có đơn tính doanh thu; `placedOrders` / `cancelledOrders` / `cancelRate`: không có đơn đặt hoặc huỷ).'
      properties:
        value: { type: number, minimum: 0 }
        previous: { type: [number, 'null'], minimum: 0 }
    AdminReportCategoryRef:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
    AdminSalesReport:
      type: object
      required: [generatedAt, from, to, previousFrom, previousTo, days, sort, kpis, byDay, topProducts, topVariants, byCategory, byPayment]
      additionalProperties: false
      description: 'Slice 8 (BR-RPT-01..06). Tiền: số nguyên đồng. `share`, `cancelRate`: 0..1, 4 chữ số thập phân.'
      properties:
        generatedAt: { type: string, format: date-time }
        from: { type: string, format: date, description: 'Ngày VN, sau khi áp mặc định.' }
        to: { type: string, format: date }
        previousFrom: { type: string, format: date }
        previousTo: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 366 }
        sort: { type: string, enum: [units, revenue] }
        kpis:
          type: object
          required: [revenue, completedOrders, units, averageOrderValue, discountTotal, shippingCollected, placedOrders, cancelledOrders, cancelRate, refundedAmount, refundedUnits, returnedOrders]
          additionalProperties: false
          properties:
            revenue: { $ref: '#/components/schemas/AdminReportFigure' }
            completedOrders: { $ref: '#/components/schemas/AdminReportFigure' }
            units: { $ref: '#/components/schemas/AdminReportFigure' }
            averageOrderValue: { $ref: '#/components/schemas/AdminReportFigure' }
            discountTotal: { $ref: '#/components/schemas/AdminReportFigure' }
            shippingCollected: { $ref: '#/components/schemas/AdminReportFigure' }
            placedOrders: { $ref: '#/components/schemas/AdminReportFigure' }
            cancelledOrders: { $ref: '#/components/schemas/AdminReportFigure' }
            cancelRate: { $ref: '#/components/schemas/AdminReportFigure' }
            refundedAmount: { allOf: [{ $ref: '#/components/schemas/AdminReportFigure' }], description: 'Slice 9 (draft, BR-RET-52): Σ tiền hàng đã hoàn (yêu cầu `refunded`) của đơn GIAO trong kỳ. `previous` null khi kỳ trước không có đơn `completed` nào được giao. `revenue` đã trừ số này (BR-RET-51), ghi vào NGÀY BÁN GỐC.' }
            refundedUnits: { allOf: [{ $ref: '#/components/schemas/AdminReportFigure' }], description: 'Slice 9 (draft): Σ số lượng đạt đã hoàn của đơn giao trong kỳ (`units` đã trừ số này).' }
            returnedOrders: { allOf: [{ $ref: '#/components/schemas/AdminReportFigure' }], description: 'Slice 9 (draft): số đơn giao trong kỳ có yêu cầu `refunded`.' }
            returnRate: { allOf: [{ $ref: '#/components/schemas/AdminReportFigure' }], description: 'Slice 9 (draft, Should, BR-RET-52): `refundedUnits / (units + refundedUnits)`, 4 chữ số thập phân; mẫu 0 -> 0. Có thể vắng nếu chưa làm Should.' }
        byDay:
          type: array
          minItems: 1
          maxItems: 366
          items:
            type: object
            required: [date, revenue, completedOrders, units]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              revenue: { type: integer, minimum: 0 }
              completedOrders: { type: integer, minimum: 0 }
              units: { type: integer, minimum: 0 }
        topProducts:
          type: array
          maxItems: 10
          items:
            type: object
            required: [productId, name, image, category, units, revenue]
            additionalProperties: false
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              image:
                oneOf:
                  - $ref: '#/components/schemas/AdminImageRef'
                  - type: 'null'
              category: { $ref: '#/components/schemas/AdminReportCategoryRef' }
              units: { type: integer, minimum: 1 }
              revenue: { type: integer, minimum: 0 }
        topVariants:
          type: array
          maxItems: 10
          items:
            type: object
            required: [variantId, productId, sku, productName, color, size, units, revenue]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              sku: { type: string }
              productName: { type: string }
              color: { type: string }
              size: { type: string }
              units: { type: integer, minimum: 1 }
              revenue: { type: integer, minimum: 0 }
        byCategory:
          type: array
          items:
            type: object
            required: [category, revenue, units, share]
            additionalProperties: false
            properties:
              category: { $ref: '#/components/schemas/AdminReportCategoryRef' }
              revenue: { type: integer, minimum: 0 }
              units: { type: integer, minimum: 0 }
              share: { type: number, minimum: 0, maximum: 1 }
        byPayment:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [method, completedOrders, revenue, share]
            additionalProperties: false
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              completedOrders: { type: integer, minimum: 0 }
              revenue: { type: integer, minimum: 0 }
              share: { type: number, minimum: 0, maximum: 1 }
    AdminStoreInfo:
      type: object
      required: [legalName, registrationNumber, registrationIssuer, registrationDate, address, hotline, hotlineHref, email, privacyEmail, hours, notificationUrl, social]
      additionalProperties: false
      description: 'Slice 8, thông tin hiển thị với khách (BR-SET-02..04). Chuỗi rỗng = chưa nhập / ẩn ở storefront.'
      properties:
        legalName: { type: string }
        registrationNumber: { type: string }
        registrationIssuer: { type: string }
        registrationDate: { type: [string, 'null'], format: date }
        address: { type: string }
        hotline: { type: string, description: 'Lưu đúng dạng đã nhập.' }
        hotlineHref: { type: string, description: 'Chỉ đọc, `tel:` + các chữ số của `hotline`.', examples: ['tel:1900686829'] }
        email: { type: string }
        privacyEmail: { type: string }
        hours: { type: string }
        notificationUrl: { type: string }
        social: { $ref: '#/components/schemas/AdminStoreSocial' }
    AdminStoreSocial:
      type: object
      required: [facebook, instagram, tiktok, youtube]
      additionalProperties: false
      properties:
        facebook: { type: string, maxLength: 300 }
        instagram: { type: string, maxLength: 300 }
        tiktok: { type: string, maxLength: 300 }
        youtube: { type: string, maxLength: 300 }
    AdminStoreOperations:
      type: object
      required: [shippingFee, freeShippingThreshold, bankHoldMinutes, codMaxTotal, deliveryDaysMin, deliveryDaysMax, cutoffHour]
      additionalProperties: false
      description: 'Slice 8, tham số vận hành (BR-SET-05, Must). Số nguyên.'
      properties:
        shippingFee: { type: integer, minimum: 0, maximum: 500000, multipleOf: 1000 }
        freeShippingThreshold: { type: integer, minimum: 0, maximum: 50000000, multipleOf: 1000, description: 'So với giá trị hàng TRƯỚC mã giảm giá (D6). `0` = mọi đơn miễn phí ship.' }
        bankHoldMinutes: { type: integer, minimum: 10, maximum: 1440 }
        codMaxTotal: { type: integer, minimum: 100000, maximum: 50000000 }
        deliveryDaysMin: { type: integer, minimum: 1, maximum: 30 }
        deliveryDaysMax: { type: integer, minimum: 1, maximum: 30, description: '>= `deliveryDaysMin`.' }
        cutoffHour: { type: integer, minimum: 0, maximum: 23 }
    AdminStoreCart:
      type: object
      required: [maxPerVariant, maxItemsPerOrder, maxCartLines, cartRetentionDays, codRefusalLimit, codRefusalMonths, codOpenOrderLimit]
      additionalProperties: false
      description: 'Slice 8, tham số giỏ và COD (BR-SET-06, Should). Đổi không cắt giỏ / đơn đang có; chỉ áp cho thao tác mới.'
      properties:
        maxPerVariant: { type: integer, minimum: 1, maximum: 20 }
        maxItemsPerOrder: { type: integer, minimum: 1, maximum: 100 }
        maxCartLines: { type: integer, minimum: 1, maximum: 100 }
        cartRetentionDays: { type: integer, minimum: 1, maximum: 180 }
        codRefusalLimit: { type: integer, minimum: 1, maximum: 10 }
        codRefusalMonths: { type: integer, minimum: 1, maximum: 24 }
        codOpenOrderLimit: { type: integer, minimum: 1, maximum: 10 }
    AdminStoreSettings:
      type: object
      required: [info, operations, cart, derived, updatedAt]
      additionalProperties: false
      properties:
        info: { $ref: '#/components/schemas/AdminStoreInfo' }
        operations: { $ref: '#/components/schemas/AdminStoreOperations' }
        cart: { $ref: '#/components/schemas/AdminStoreCart' }
        derived:
          type: object
          required: [deliveryWindow, lowStockDefault]
          additionalProperties: false
          description: 'Chỉ đọc.'
          properties:
            deliveryWindow: { type: string, examples: ['2–4 ngày'], description: 'Suy từ `deliveryDaysMin`–`deliveryDaysMax` (D9).' }
            lowStockDefault: { type: integer, minimum: 0, maximum: 1000, description: 'Ngưỡng sắp hết mặc định, sửa ở Tồn kho (`PUT /admin/inventory/thresholds`).' }
        updatedAt: { type: string, format: date-time, description: 'Gửi lại nguyên văn trong `PUT` (so ở mức mili-giây).' }
    AdminStoreSettingsInput:
      type: object
      required: [updatedAt, info, operations]
      additionalProperties: false
      description: 'Slice 8. Bản thay thế của hai nhóm `info` và `operations` (mọi khoá bắt buộc, chuỗi tuỳ chọn gửi `""`). `info.social`, `info.notificationUrl`, `cart` vắng = giữ nguyên.'
      properties:
        updatedAt: { type: string, format: date-time }
        info:
          type: object
          required: [legalName, registrationNumber, registrationIssuer, registrationDate, address, hotline, email, privacyEmail, hours]
          additionalProperties: false
          properties:
            legalName: { type: string, minLength: 2, maxLength: 120 }
            registrationNumber: { type: string, pattern: '^([0-9]{10}|[0-9]{13})$', description: 'MST / số ĐKKD: 10 hoặc 13 chữ số.' }
            registrationIssuer: { type: string, maxLength: 100 }
            registrationDate: { type: [string, 'null'], format: date, description: 'Ngày có thật, không sau hôm nay (VN); `null` hoặc `""` = chưa nhập.' }
            address: { type: string, minLength: 10, maxLength: 200 }
            hotline: { type: string, description: 'Sau khi bỏ khoảng trắng, `.` và `-` còn 8..11 chữ số, bắt đầu `0`, `1800` hoặc `1900`.' }
            email: { type: string, maxLength: 254, description: 'Email CSKH hợp lệ, lưu chữ thường.' }
            privacyEmail: { type: string, maxLength: 254, description: 'Rỗng hoặc email hợp lệ, lưu chữ thường.' }
            hours: { type: string, maxLength: 100 }
            notificationUrl: { type: string, maxLength: 300, description: 'Should. Rỗng hoặc URL `https://`.' }
            social:
              description: 'Should. Mỗi khoá rỗng hoặc URL `https://` <= 300 ký tự (không `http:`, `javascript:`, `data:`); khoá vắng = giữ nguyên.'
              type: object
              additionalProperties: false
              properties:
                facebook: { type: string, maxLength: 300 }
                instagram: { type: string, maxLength: 300 }
                tiktok: { type: string, maxLength: 300 }
                youtube: { type: string, maxLength: 300 }
        operations: { $ref: '#/components/schemas/AdminStoreOperations' }
        cart: { $ref: '#/components/schemas/AdminStoreCart' }
    StorePublicSettings:
      type: object
      required: [info, policy]
      additionalProperties: false
      description: 'Slice 8 (BR-SET-10). Whitelist, không có trường nào ngoài danh sách này.'
      properties:
        info:
          type: object
          required: [legalName, registrationNumber, registrationIssuer, registrationDate, address, hotline, hotlineHref, email, privacyEmail, hours, notificationUrl, social]
          additionalProperties: false
          properties:
            legalName: { type: string }
            registrationNumber: { type: string }
            registrationIssuer: { type: string }
            registrationDate: { type: [string, 'null'], format: date }
            address: { type: string }
            hotline: { type: string }
            hotlineHref: { type: string }
            email: { type: string }
            privacyEmail: { type: string }
            hours: { type: string }
            notificationUrl: { type: [string, 'null'], description: 'null = chưa thông báo Bộ Công Thương, storefront ẩn.' }
            social:
              type: object
              required: [facebook, instagram, tiktok, youtube]
              additionalProperties: false
              properties:
                facebook: { type: [string, 'null'] }
                instagram: { type: [string, 'null'] }
                tiktok: { type: [string, 'null'] }
                youtube: { type: [string, 'null'] }
        policy:
          type: object
          required: [freeShippingFrom, shippingFee, deliveryWindow, paymentHoldMinutes]
          additionalProperties: false
          properties:
            freeShippingFrom: { type: integer, minimum: 0, description: '= `freeShippingThreshold`.' }
            shippingFee: { type: integer, minimum: 0 }
            deliveryWindow: { type: string, examples: ['2–4 ngày'] }
            paymentHoldMinutes: { type: integer, minimum: 10, description: '= `bankHoldMinutes`.' }
    AdminAuditTargetType:
      type: string
      enum: [order, inventory, customer, staff, settings]
      description: 'Slice 8. `customer` / `staff` theo vai trò của tài khoản bị tác động (`account_events.target_role`).'
    AdminAuditEntry:
      type: object
      required: [id, at, actor, action, target]
      additionalProperties: false
      description: 'Slice 8 (BR-AUD-02). Giá trị người / đích là ảnh chụp lúc làm.'
      properties:
        id: { type: string, description: '`order:<uuid>`, `inventory:<uuid>`, `account:<uuid>` hoặc `settings:<uuid>`; duy nhất.' }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [id, name, role]
          additionalProperties: false
          properties:
            id: { type: [string, 'null'], format: uuid }
            name: { type: string }
            role: { type: string, enum: [staff, admin] }
        action:
          type: object
          required: [code, label]
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
                - order.call-attempt
                - order.confirmed
                - order.shipped
                - order.delivered
                - order.cancelled
                - order.cancel-approved
                - order.cancel-rejected
                - order.stock-restocked
                - order.stock-written-off
                - order.note-added
                - inventory.adjusted
                - account.staff-created
                - account.locked
                - account.unlocked
                - account.role-changed
                - settings.updated
            label: { type: string, description: 'Nhãn tiếng Việt; thao tác tồn kho kèm số lượng và lý do chuẩn, ví dụ "Điều chỉnh tồn kho +5 (Nhập hàng)".' }
        target:
          type: object
          required: [type, id, label]
          additionalProperties: false
          properties:
            type: { $ref: '#/components/schemas/AdminAuditTargetType' }
            id: { type: [string, 'null'], description: '`order`: mã đơn; `inventory`: UUID biến thể; `customer` / `staff`: UUID tài khoản (null nếu tài khoản đã bị xoá); `settings`: `store`.' }
            label: { type: string, description: 'Ví dụ `#N2F...`, `SKU - tên sản phẩm`, tên tài khoản lúc đó, `Cài đặt cửa hàng`.' }
        reason: { type: string, description: 'Chỉ khi có: lý do khoá / mở / đổi vai trò, ghi chú điều chỉnh tồn (công khai với admin), mã lý do huỷ đơn. Không bao giờ là ghi chú nội bộ / nội dung cuộc gọi của đơn.' }
        roleBefore: { type: string, enum: [staff, admin], description: 'Chỉ `account.role-changed`.' }
        roleAfter: { type: string, enum: [staff, admin], description: 'Chỉ `account.role-changed` và `account.staff-created`.' }
        changes:
          type: array
          minItems: 1
          description: 'Chỉ `settings.updated`: các trường đã đổi.'
          items:
            type: object
            required: [field, label, before, after]
            additionalProperties: false
            properties:
              field: { type: string, description: 'Đường dẫn như `operations.shippingFee`, `info.hotline`.' }
              label: { type: string }
              before: { type: string, maxLength: 300 }
              after: { type: string, maxLength: 300 }
    AdminAuditPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAuditEntry' }, maxItems: 50 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
    ReturnReason:
      type: string
      enum: [wrong-size, wrong-color, wrong-item, defective, not-fit, changed-mind]
      description: 'Slice 9 (BR-RET-12). Lỗi của shop: `wrong-size`, `wrong-color`, `wrong-item`, `defective`; lỗi của khách: `not-fit`, `changed-mind`. Không có "khác" / "không như mô tả" (Won''t).'
    ReturnFault:
      type: string
      enum: [shop, customer]
      description: 'Suy ra từ `reason`: `shop` miễn phí gửi trả (+ hoàn phí giao khi trả toàn bộ đơn); `customer` trừ 30.000 phí gửi trả.'
    ReturnState:
      type: string
      enum: [requested, approved, received, refunded, rejected, cancelled]
      description: 'Slice 9 (BR-RET-08). requested -> approved | rejected | cancelled(khách); approved -> received | rejected; received -> refunded. `rejected`, `cancelled`, `refunded` là cuối. KHÔNG thêm giá trị vào `OrderStatus`: đơn giữ `completed`.'
    ReturnStateFilter:
      type: string
      enum: [requested, approved, received, refunded, closed]
      description: '`closed` = `rejected` + `cancelled`.'
    ReturnDisposition:
      type: string
      enum: [restock, writeoff]
    ReturnAmount:
      type: object
      required: [goodsAmount, shippingRefund, returnShippingFee, amount, final]
      additionalProperties: false
      description: 'Slice 9 (BR-RET-21, 30). `goodsAmount` = Σ hoàn tiền hàng của các dòng (dòng đủ số lượng = `unitPrice x quantity - lineDiscount`; một phần = làm tròn half-up theo tỉ lệ số lượng); `shippingRefund` = `shippingFee - shippingDiscount` CHỈ khi lỗi của shop VÀ mọi dòng đơn hoàn đủ số lượng, ngược lại 0; `returnShippingFee` = 30.000 khi lỗi của khách, ngược lại 0 (hằng số chính sách, không sửa ở Cài đặt); `amount = goodsAmount + shippingRefund - returnShippingFee` (>= 0). `final = false`: dự kiến theo số lượng khách chọn (`requested`, `approved`); `final = true`: đã chốt theo số lượng ĐẠT lúc nhận hàng (từ `received`).'
      properties:
        goodsAmount: { type: integer, minimum: 0 }
        shippingRefund: { type: integer, minimum: 0 }
        returnShippingFee: { type: integer, minimum: 0 }
        amount: { type: integer, minimum: 0 }
        final: { type: boolean }
    ReturnLinesInput:
      type: array
      minItems: 1
      maxItems: 32
      description: 'Dòng của ĐƠN theo `variantId` (duy nhất trong đơn). Không trùng, không dòng lạ, số lượng nguyên 1..số đã mua; sai -> `422`, `field: lines`.'
      items:
        type: object
        required: [variantId, quantity]
        additionalProperties: false
        properties:
          variantId: { type: string, format: uuid }
          quantity: { type: integer, minimum: 1, maximum: 99 }
    ReturnEstimateInput:
      type: object
      required: [lines, reason]
      additionalProperties: false
      properties:
        lines: { $ref: '#/components/schemas/ReturnLinesInput' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
    ReturnCreateInput:
      type: object
      required: [lines, reason]
      additionalProperties: false
      description: 'Slice 9 (BR-RET-11..16). PHẲNG để `error.field` trùng tên trường. Trường lạ bị loại. KHÔNG có `refundAccount` lồng nhau: `bank`, `accountNumber`, `accountName` nằm ở cấp trên cùng.'
      properties:
        lines: { $ref: '#/components/schemas/ReturnLinesInput' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        detail: { type: string, maxLength: 500, description: 'Lỗi của shop: bắt buộc 10..500 sau chuẩn hoá. Lỗi của khách: tuỳ chọn <= 500.' }
        conditionAck: { type: boolean, description: 'Lỗi của khách: bắt buộc `true` ("còn nguyên tem nhãn, chưa qua sử dụng, chưa giặt").' }
        photos:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
          description: 'Id ảnh đã tải. Lỗi của shop: >= 1. Ảnh phải do chính người gửi tải trong 24 giờ qua và chưa gắn yêu cầu nào.'
        bank: { type: string, maxLength: 80, description: 'Bắt buộc với đơn COD (2..60); đơn `bank-transfer` bỏ qua.' }
        accountNumber: { type: string, maxLength: 30, description: 'Bỏ khoảng trắng còn 6..19 chữ số. Bắt buộc với đơn COD. KHÔNG bao giờ có trong phản hồi, email, sự kiện, nhật ký, log.' }
        accountName: { type: string, maxLength: 80, description: '2..50 ký tự chữ cái và khoảng trắng; lưu IN HOA. Bắt buộc với đơn COD.' }
    ReturnPhoto:
      type: object
      required: [id, url, width, height, size, contentType]
      additionalProperties: false
      description: 'Slice 9 (BR-RET-14, 15). `url` là đường dẫn CÓ KIỂM QUYỀN theo người xem (khách `/api/account/return-photos/{id}`, khách vãng lai `/api/orders/{code}/return/photos/{id}`, admin `/api/admin/return-photos/{id}`): cần cookie phiên tương ứng, không mở được khi không đăng nhập, không phải URL công khai hay URL ký.'
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, description: 'Byte sau khi gỡ metadata.' }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    ReturnLine:
      type: object
      required: [variantId, name, color, size, sku, mediaId, quantity, goodsAmount]
      additionalProperties: false
      description: 'Dòng của yêu cầu (tên / màu / size / SKU / `mediaId` chụp từ dòng đơn). `goodsAmount`: dự kiến theo `quantity` (trước `received`), chốt theo `acceptedQuantity` (từ `received`).'
      properties:
        variantId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        size: { type: string }
        sku: { type: string }
        mediaId: { type: string }
        quantity: { type: integer, minimum: 1 }
        acceptedQuantity: { type: integer, minimum: 0, description: 'Có từ `received` (và ở `rejected` sau kiểm).' }
        goodsAmount: { type: integer, minimum: 0 }
    ReturnRefundTo:
      type: object
      required: [type]
      additionalProperties: false
      description: 'Nơi hoàn. `account`: đơn COD, chỉ ngân hàng + 4 số cuối + tên chủ (sau trạng thái cuối cũng còn đủ ba trường này). `original`: đơn chuyển khoản, hoàn về tài khoản đã thanh toán (không thu số).'
      properties:
        type: { type: string, enum: [account, original] }
        bank: { type: string }
        last4: { type: string, pattern: '^[0-9]{4}$' }
        accountName: { type: string }
    ReturnRequest:
      type: object
      required: [id, state, reason, fault, detail, conditionAck, requestedAt, lines, photos, amount, refundTo, canCancel]
      additionalProperties: false
      description: 'Slice 9 (BR-RET-20). Yêu cầu trả hàng dạng KHÁCH (cũng là `Order.return`). KHÔNG có số tài khoản đầy đủ, `refundReference`, `disposition`, ghi chú nội bộ, tên nhân viên.'
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/ReturnState' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        fault: { $ref: '#/components/schemas/ReturnFault' }
        detail: { type: string }
        conditionAck: { type: boolean }
        requestedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        refundedAt: { type: string, format: date-time }
        rejectedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/ReturnLine' } }
        photos: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/ReturnPhoto' } }
        amount: { $ref: '#/components/schemas/ReturnAmount' }
        refundedAmount: { type: integer, minimum: 0, description: 'Chỉ khi `refunded` (= `amount.amount`).' }
        expectedRefundBy: { type: string, format: date, description: 'Từ `received` tới `refunded`: <= 3 ngày làm việc sau `receivedAt` (cùng hàm ngày làm việc của ngày giao dự kiến, có tính ngày lễ). Dự kiến, hệ thống không ép.' }
        approveNote: { type: string, description: 'Hướng dẫn của nhân viên khi duyệt.' }
        rejectNote: { type: string, description: 'Lý do từ chối / đóng (chỉ khi `rejected`).' }
        carrier: { type: string, description: 'Should (BR-RET-44).' }
        trackingNumber: { type: string, description: 'Should (BR-RET-44).' }
        instructions: { type: string, description: 'Chỉ khi `approved`: hướng dẫn gửi hàng (địa chỉ cửa hàng lấy từ cài đặt + `approveNote`).' }
        refundTo: { $ref: '#/components/schemas/ReturnRefundTo' }
        canCancel: { type: boolean, description: 'true khi `state = requested`.' }
    AdminReturnHistoryEntry:
      type: object
      required: [at, kind, actor]
      additionalProperties: false
      description: 'Một bước xử lý (từ `order_events` của yêu cầu; tên + vai trò chụp lúc làm). Chỉ ghi chú hiển thị cho khách (hướng dẫn, lý do từ chối), không có số tài khoản.'
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [return_requested, return_approved, return_rejected, return_received, return_refunded, return_cancelled] }
        actor: { $ref: '#/components/schemas/AdminActor' }
        note: { type: string }
    AdminReturnAction:
      type: string
      enum: [approve, reject, receive, refund]
      description: 'Theo trạng thái + vai trò (BR-RET-43): `approve` (requested), `reject` (requested, approved), `receive` (approved) cho staff + admin; `refund` (received) CHỈ admin.'
    AdminReturnLine:
      type: object
      required: [variantId, name, color, size, sku, mediaId, quantity, goodsAmount]
      additionalProperties: false
      description: 'Như `ReturnLine` + `disposition` (chỉ staff / admin; có từ `received` khi `acceptedQuantity > 0`).'
      properties:
        variantId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        size: { type: string }
        sku: { type: string }
        mediaId: { type: string }
        quantity: { type: integer, minimum: 1 }
        acceptedQuantity: { type: integer, minimum: 0 }
        goodsAmount: { type: integer, minimum: 0 }
        disposition: { $ref: '#/components/schemas/ReturnDisposition' }
    AdminReturnRefundTo:
      type: object
      required: [type]
      additionalProperties: false
      description: 'Như `ReturnRefundTo` + `accountNumber` (SỐ ĐẦY ĐỦ: chỉ khi người xem là admin VÀ `state = received` VÀ đơn COD, lúc cần chuyển tiền; staff, trạng thái khác, sau trạng thái cuối: vắng). Không bao giờ trong email, sự kiện, nhật ký, log, CSV, tên tệp.'
      properties:
        type: { type: string, enum: [account, original] }
        bank: { type: string }
        last4: { type: string, pattern: '^[0-9]{4}$' }
        accountName: { type: string }
        accountNumber: { type: string, pattern: '^[0-9]{6,19}$' }
    AdminReturn:
      type: object
      required: [id, orderCode, state, reason, fault, detail, conditionAck, requestedAt, recipient, paymentMethod, lines, photos, amount, refundTo, history, allowedActions, overdue]
      additionalProperties: false
      description: 'Slice 9 (BR-RET-32). Dạng staff / admin của yêu cầu. Cũng là `AdminOrder.return`.'
      properties:
        id: { type: string, format: uuid }
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        state: { $ref: '#/components/schemas/ReturnState' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        fault: { $ref: '#/components/schemas/ReturnFault' }
        detail: { type: string }
        conditionAck: { type: boolean }
        requestedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        refundedAt: { type: string, format: date-time }
        rejectedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        recipient:
          type: object
          required: [name, phone, email]
          additionalProperties: false
          description: 'Như đơn (SĐT, email đầy đủ).'
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        lines: { type: array, items: { $ref: '#/components/schemas/AdminReturnLine' } }
        photos: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/ReturnPhoto' } }
        amount: { $ref: '#/components/schemas/ReturnAmount' }
        refundedAmount: { type: integer, minimum: 0 }
        expectedRefundBy: { type: string, format: date }
        approveNote: { type: string }
        rejectNote: { type: string }
        receiveNote: { type: string }
        carrier: { type: string }
        trackingNumber: { type: string }
        refundReference: { type: string, description: 'Mã giao dịch / nội dung chuyển khoản admin nhập (chỉ khi `refunded`).' }
        refundTo: { $ref: '#/components/schemas/AdminReturnRefundTo' }
        source: { type: string, enum: [member, guest], description: 'Slice 10 (Should, BR-RET-65). `guest` = khách vãng lai gửi qua Tra cứu đơn (nhãn "Khách vãng lai"), `member` = thành viên (nhãn "Thành viên").' }
        history: { type: array, items: { $ref: '#/components/schemas/AdminReturnHistoryEntry' }, description: 'Cũ nhất trước.' }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AdminReturnAction' } }
        overdue: { type: boolean, description: 'Should (BR-RET-44): `requested` quá 24 giờ kể từ `requestedAt`, tính khi đọc (không tác vụ nền). Luôn false nếu chưa làm Should.' }
    AdminReturnSummary:
      type: object
      required: [id, orderCode, requestedAt, recipientName, reason, fault, state, itemCount, amount, overdue]
      additionalProperties: false
      description: 'Dòng của danh sách (BR-RET-31). `amount` = số dự kiến hoặc đã chốt tuỳ `final` của yêu cầu.'
      properties:
        id: { type: string, format: uuid }
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        requestedAt: { type: string, format: date-time }
        recipientName: { type: string }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        fault: { $ref: '#/components/schemas/ReturnFault' }
        state: { $ref: '#/components/schemas/ReturnState' }
        itemCount: { type: integer, minimum: 1, description: 'Σ số lượng yêu cầu.' }
        source: { type: string, enum: [member, guest], description: 'Slice 10 (Should, BR-RET-65). Nhãn nguồn.' }
        amount: { type: integer, minimum: 0 }
        handledBy: { $ref: '#/components/schemas/StaffRef' }
        handledAt: { type: string, format: date-time }
        overdue: { type: boolean, description: 'Should (BR-RET-44).' }
    AdminReturnCounts:
      type: object
      required: [all, requested, approved, received, refunded, closed]
      additionalProperties: false
      properties:
        all: { type: integer, minimum: 0 }
        requested: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
        received: { type: integer, minimum: 0 }
        refunded: { type: integer, minimum: 0 }
        closed: { type: integer, minimum: 0, description: '`rejected` + `cancelled`.' }
    AdminReturnPage:
      type: object
      required: [items, total, page, limit, counts]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminReturnSummary' }, maxItems: 50 }
        total: { type: integer, minimum: 0, description: 'Số yêu cầu khớp bộ lọc (mọi trang).' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, enum: [20, 50] }
        counts: { $ref: '#/components/schemas/AdminReturnCounts' }
    AdminReturnApproveInput:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 250 }
        carrier: { type: string, maxLength: 50, description: 'Should (BR-RET-44).' }
        trackingNumber: { type: string, maxLength: 40, description: 'Should (BR-RET-44).' }
    AdminReturnRejectInput:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { type: string, minLength: 5, maxLength: 250, description: 'Sau trim. Hiển thị cho khách và vào email.' }
    AdminReturnReceiveInput:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            required: [variantId, acceptedQuantity]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              acceptedQuantity: { type: integer, minimum: 0, maximum: 99 }
              disposition: { $ref: '#/components/schemas/ReturnDisposition' }
        note: { type: string, maxLength: 250, description: 'Bắt buộc 5..250 khi có dòng đạt < yêu cầu.' }
    AdminReturnRefundInput:
      type: object
      required: [amount, refundReference]
      additionalProperties: false
      properties:
        amount: { type: integer, minimum: 0, description: 'PHẢI bằng đúng `ReturnAmount.amount` đã chốt.' }
        refundReference: { type: string, minLength: 4, maxLength: 60 }
    SaleState:
      type: string
      enum: [none, upcoming, running, ended]
      description: 'Slice 10 (BR-PROMO-06). Tính từ giờ máy chủ lúc đọc: `none` = không có đợt; `upcoming` = `saleStartsAt` > T; `running` = `saleStartsAt` <= T <= `saleEndsAt`; `ended` = T > `saleEndsAt`.'
    ProductReview:
      type: object
      required: [id, author, rating, fit, sizeBought, height, title, body, date, verified]
      additionalProperties: false
      description: 'Slice 10 (BR-REV-05). Dạng công khai, khớp FE `ProductReview` trừ `sample` (không có). KHÔNG có email, SĐT, id người dùng.'
      properties:
        id: { type: string, format: uuid }
        author: { type: string, maxLength: 60, examples: ['Nguyễn V.'], description: 'Họ + chữ cái đầu của tên (D3), chụp lúc gửi.' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        fit: { type: integer, enum: [-1, 0, 1], description: '-1 chật, 0 vừa, 1 rộng.' }
        sizeBought: { type: string, maxLength: 10, description: 'Do máy chủ lấy từ đơn.' }
        height: { type: string, maxLength: 20, description: 'Rỗng khi không nhập.' }
        title: { type: string, minLength: 2, maxLength: 80 }
        body: { type: string, minLength: 20, maxLength: 1000 }
        date: { type: string, format: date, description: 'Ngày gửi theo giờ VN.' }
        verified: { type: boolean, const: true }
        reply:
          type: object
          required: [body, at]
          additionalProperties: false
          description: 'Có khi shop đã trả lời (hiện "Phản hồi từ nine2fine"); không có tên nhân viên.'
          properties:
            body: { type: string, minLength: 5, maxLength: 500 }
            at: { type: string, format: date-time }
    ProductReviewSummary:
      type: object
      required: [count, average, distribution, fit]
      additionalProperties: false
      description: 'Slice 10 (BR-REV-06). Trên MỌI đánh giá `visible` của sản phẩm (không theo bộ lọc `rating`); cùng số với `Product.rating`.'
      properties:
        count: { type: integer, minimum: 0 }
        average: { type: [number, 'null'], minimum: 1, maximum: 5, description: 'Σ sao / count, 1 chữ số thập phân half-up; null khi count = 0.' }
        distribution:
          type: object
          required: ['1', '2', '3', '4', '5']
          additionalProperties: false
          properties:
            '1': { type: integer, minimum: 0 }
            '2': { type: integer, minimum: 0 }
            '3': { type: integer, minimum: 0 }
            '4': { type: integer, minimum: 0 }
            '5': { type: integer, minimum: 0 }
        fit:
          type: object
          required: [small, 'true', large]
          additionalProperties: false
          description: 'Số đánh giá theo độ vừa: `small` (fit = -1), `true` (0), `large` (1).'
          properties:
            small: { type: integer, minimum: 0 }
            'true': { type: integer, minimum: 0 }
            large: { type: integer, minimum: 0 }
    ProductReviewPage:
      type: object
      required: [items, total, page, limit, summary]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductReview' }, maxItems: 20 }
        total: { type: integer, minimum: 0, description: 'Số đánh giá khớp bộ lọc `rating` (mọi trang).' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 20 }
        summary: { $ref: '#/components/schemas/ProductReviewSummary' }
    ReviewEligibility:
      type: object
      required: [status]
      additionalProperties: false
      description: 'Slice 10 (BR-REV-02). Khớp FE `ReviewEligibility`.'
      properties:
        status: { type: string, enum: [sign-in, not-purchased, reviewed, eligible] }
        sizeBought: { type: string, description: 'Chỉ khi `eligible`: size của dòng thuộc đơn đủ điều kiện giao mới nhất; FE điền sẵn.' }
    ReviewCreateInput:
      type: object
      required: [productId, rating, fit, title, body]
      additionalProperties: true
      description: 'Slice 10 (BR-REV-03). Trường lạ (kể cả `sizeBought`, `author`, `date`, `verified`, `status`) bị BỎ QUA. Quy tắc từng trường xem `createReview`.'
      properties:
        productId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        fit: { type: integer, enum: [-1, 0, 1] }
        height: { type: string, maxLength: 20 }
        title: { type: string, minLength: 2, maxLength: 80 }
        body: { type: string, minLength: 20, maxLength: 1000 }
    AdminReviewView:
      type: string
      enum: [all, unanswered, low, hidden]
      default: all
      description: '`unanswered` = đang `visible` và chưa trả lời; `low` = `rating` <= 2 (mọi trạng thái); `hidden` = đã ẩn.'
    AdminReview:
      type: object
      required: [id, productId, productName, productSlug, productImage, author, rating, fit, sizeBought, height, title, body, date, verified, status, createdAt, updatedAt]
      additionalProperties: false
      description: 'Slice 10 (BR-REV-07). Dạng staff / admin của đánh giá, khớp FE `AdminReview` trừ `sample` (không có) và `status`: `visible` tương ứng `published` của mock (adapter đổi tên).'
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        productSlug: { type: string }
        productImage: { type: string, description: 'mediaId ảnh bìa.' }
        author: { type: string, description: 'Như công khai ("Nguyễn V.").' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        fit: { type: integer, enum: [-1, 0, 1] }
        sizeBought: { type: string }
        height: { type: string }
        title: { type: string }
        body: { type: string }
        date: { type: string, format: date, description: 'Ngày gửi giờ VN.' }
        createdAt: { type: string, format: date-time }
        verified: { type: boolean, const: true }
        status: { type: string, enum: [visible, hidden] }
        hiddenReason: { type: string, description: 'Chỉ khi `hidden`.' }
        hiddenAt: { type: string, format: date-time }
        hiddenBy: { $ref: '#/components/schemas/StaffRef' }
        reply:
          type: object
          required: [body, at, author]
          additionalProperties: false
          properties:
            body: { type: string }
            at: { type: string, format: date-time }
            author: { type: string, description: 'Tên nhân viên đã trả lời (chỉ ở dạng admin).' }
        updatedAt: { type: string, format: date-time, description: 'Khoá chống ghi chồng của ẩn / hiện / trả lời; tăng ngặt mỗi lần đổi.' }
    AdminReviewPage:
      type: object
      required: [items, total, page, limit, counts, average]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminReview' }, maxItems: 50 }
        total: { type: integer, minimum: 0, description: 'Số đánh giá khớp bộ lọc (mọi trang).' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, enum: [20, 50] }
        counts:
          type: object
          required: [all, unanswered, low, hidden]
          additionalProperties: false
          properties:
            all: { type: integer, minimum: 0 }
            unanswered: { type: integer, minimum: 0 }
            low: { type: integer, minimum: 0 }
            hidden: { type: integer, minimum: 0 }
        average: { type: [number, 'null'], description: 'Trung bình sao các đánh giá `visible` toàn shop, 1 chữ số thập phân half-up; null khi chưa có.' }
    RecommendationList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/Product' }, description: 'Ít hơn `limit` hoặc rỗng khi không đủ sản phẩm hợp điều kiện (FE ẩn cả khối).' }
    WishlistEntry:
      type: object
      required: [productId, addedAt]
      additionalProperties: false
      properties:
        productId: { type: string, format: uuid }
        addedAt: { type: string, format: date-time }
    Wishlist:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WishlistEntry' }, description: 'Chỉ sản phẩm `ACTIVE`, mới thêm trước.' }
        total: { type: integer, minimum: 0, maximum: 100 }
    WishlistMergeResult:
      type: object
      required: [items, total, skipped]
      additionalProperties: false
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WishlistEntry' } }
        total: { type: integer, minimum: 0, maximum: 100 }
        skipped: { type: integer, minimum: 0, description: 'Số id bị bỏ vì không hợp lệ hoặc vượt 100.' }
    HomeHref:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^/[^/\\\s][^\\\s]*$|^/$'
      description: 'Chỉ đường dẫn nội bộ: bắt đầu `/`, không `//`, không `\`, không khoảng trắng. Loại `javascript:`, `http:`, `//evil.com`.'
    HomeMediaId:
      type: string
      minLength: 1
      maxLength: 100
      description: 'Id ảnh: `up-<32 hex>.<ext>` phải tồn tại ở thư viện ảnh admin; id khác phải thuộc ảnh seed của storefront (`media-ids.json`). Chỉ lưu id, không URL.'
    HomeCategoryItem:
      type: object
      required: [label, href, mediaId]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        href: { $ref: '#/components/schemas/HomeHref' }
        mediaId: { $ref: '#/components/schemas/HomeMediaId' }
    HomeMomentInput:
      type: object
      required: [moment, label, lines, mediaId]
      additionalProperties: false
      description: 'Chữ + ảnh của một thẻ Moment (BR-MOM-02). Mã `moment` cố định, không thêm / xoá / đổi.'
      properties:
        moment: { $ref: '#/components/schemas/Moment' }
        label: { type: string, minLength: 1, maxLength: 40 }
        lines: { type: array, minItems: 1, maxItems: 2, items: { type: string, minLength: 1, maxLength: 60 } }
        mediaId: { $ref: '#/components/schemas/HomeMediaId' }
    HomeMomentCard:
      allOf:
        - $ref: '#/components/schemas/HomeMomentInput'
        - type: object
          required: [href, count]
          properties:
            href: { type: string, pattern: '^/shop\?moment=(work|dinner|event|weekend)$' }
            count: { type: integer, minimum: 1, description: 'Số sản phẩm `ACTIVE` thuộc Moment, tính khi đọc. Thẻ `count = 0` KHÔNG được trả.' }
    HomeCampaignBlock:
      type: object
      required: [kind, id, eyebrow, title, description, href, mediaId, mobileMediaId]
      additionalProperties: false
      description: 'Khối chiến dịch (FE `LandingCampaign`).'
      properties:
        kind: { type: string, const: campaign }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        enabled: { type: boolean, default: true }
        eyebrow: { type: string, maxLength: 40 }
        title: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 200, description: 'Cho phép xuống dòng.' }
        href: { $ref: '#/components/schemas/HomeHref' }
        mediaId: { $ref: '#/components/schemas/HomeMediaId' }
        mobileMediaId: { $ref: '#/components/schemas/HomeMediaId' }
        titleLang: { type: string, const: en }
        member:
          type: object
          required: [description, href]
          additionalProperties: false
          description: 'Nội dung thay khi đã đăng nhập; máy chủ trả nguyên, FE chọn theo phiên.'
          properties:
            description: { type: string, maxLength: 200 }
            href: { $ref: '#/components/schemas/HomeHref' }
    HomeProductsBlock:
      type: object
      required: [kind, id, label, cards]
      additionalProperties: false
      description: 'Khối biên tập (FE `LandingEdit`): tối đa 6 thẻ.'
      properties:
        kind: { type: string, const: products }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        enabled: { type: boolean, default: true }
        label: { type: string, maxLength: 80 }
        cards:
          type: array
          maxItems: 6
          items:
            type: object
            required: [title, caption, href, mediaId]
            additionalProperties: false
            properties:
              title: { type: string, maxLength: 80 }
              caption: { type: string, maxLength: 40 }
              href: { $ref: '#/components/schemas/HomeHref' }
              mediaId: { $ref: '#/components/schemas/HomeMediaId' }
    HomeShopBlock:
      type: object
      required: [kind, id, label, sort, href]
      additionalProperties: false
      description: 'Khối sản phẩm thật từ catalog (FE `LandingShop`).'
      properties:
        kind: { type: string, const: shop }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        enabled: { type: boolean, default: true }
        label: { type: string, maxLength: 80 }
        sort: { $ref: '#/components/schemas/SortOrder' }
        href: { $ref: '#/components/schemas/HomeHref' }
        queryParams:
          type: object
          maxProperties: 8
          description: 'Khoá thuộc `sort`, `gender`, `category`, `moment`, `size`, `color`, `maxPrice`, `available`, `sale`, `q`; giá trị chuỗi <= 60 ký tự.'
          additionalProperties: { type: string, maxLength: 60 }
    HomeCategoriesBlock:
      type: object
      required: [kind, id]
      additionalProperties: false
      description: 'Khối lưới danh mục (dùng `categories[]`).'
      properties:
        kind: { type: string, const: categories }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        enabled: { type: boolean, default: true }
    HomeBlock:
      oneOf:
        - $ref: '#/components/schemas/HomeCampaignBlock'
        - $ref: '#/components/schemas/HomeProductsBlock'
        - $ref: '#/components/schemas/HomeShopBlock'
        - $ref: '#/components/schemas/HomeCategoriesBlock'
      discriminator:
        propertyName: kind
        mapping:
          campaign: '#/components/schemas/HomeCampaignBlock'
          products: '#/components/schemas/HomeProductsBlock'
          shop: '#/components/schemas/HomeShopBlock'
          categories: '#/components/schemas/HomeCategoriesBlock'
    HomeContentPublic:
      type: object
      required: [categories, moments, blocks]
      additionalProperties: false
      description: 'Slice 10 (BR-CMS-01, BR-MOM-02). Khớp FE `LandingContent`; chỉ khối `enabled`; `moments` chỉ thẻ `count` >= 1 (có thể rỗng).'
      properties:
        categories: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/HomeCategoryItem' } }
        moments: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/HomeMomentCard' } }
        blocks: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/HomeBlock' } }
    HomeContentInput:
      type: object
      required: [categories, moments, blocks, updatedAt]
      additionalProperties: false
      description: 'Slice 10 (BR-CMS-02). Nguyên văn bản; không có ghi từng phần. Giới hạn xem `adminSaveHomeContent`.'
      properties:
        categories: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/HomeCategoryItem' } }
        moments: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/HomeMomentInput' }, description: 'Đúng 4 phần tử, thứ tự work, dinner, event, weekend.' }
        blocks: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/HomeBlock' } }
        updatedAt: { type: [string, 'null'], format: date-time, description: 'Giá trị lần đọc gần nhất; null chỉ khi chưa có dòng lưu.' }
    HomeContentWarning:
      type: object
      required: [path, message]
      additionalProperties: false
      properties:
        path: { type: string, examples: ['blocks[3].href'] }
        message: { type: string }
    AdminHomeContent:
      type: object
      required: [categories, moments, blocks, isDefault, updatedAt, updatedBy]
      additionalProperties: false
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/HomeCategoryItem' } }
        moments: { type: array, items: { $ref: '#/components/schemas/HomeMomentInput' } }
        blocks: { type: array, items: { $ref: '#/components/schemas/HomeBlock' }, description: 'Gồm cả khối `enabled: false`.' }
        isDefault: { type: boolean, description: 'true khi chưa ai lưu (hoặc vừa khôi phục mặc định).' }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy:
          oneOf:
            - type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
            - type: 'null'
        warnings: { type: array, items: { $ref: '#/components/schemas/HomeContentWarning' }, description: 'Should (BR-CMS-06).' }
    SizeChartInput:
      type: object
      required: [body, garment, bodyColumns, garmentColumns, updatedAt]
      additionalProperties: false
      description: 'Slice 10 (BR-CMS-03). Giới hạn xem `adminSaveSizeChart`.'
      properties:
        body: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/SizeChartRow' } }
        garment: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/SizeChartRow' } }
        bodyColumns: { type: array, minItems: 1, maxItems: 8, items: { type: string, minLength: 1, maxLength: 20 } }
        garmentColumns: { type: array, minItems: 1, maxItems: 8, items: { type: string, minLength: 1, maxLength: 20 } }
        updatedAt: { type: [string, 'null'], format: date-time }
    AdminSizeChart:
      type: object
      required: [category, label, productCount, customised, updatedAt, updatedBy, chart]
      additionalProperties: false
      description: 'Khớp FE `AdminSizeChart` (+ `updatedAt`, `updatedBy`).'
      properties:
        category: { $ref: '#/components/schemas/Category' }
        label: { type: string, description: 'Tên danh mục.' }
        productCount: { type: integer, minimum: 0 }
        customised: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy:
          oneOf:
            - type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
            - type: 'null'
        chart: { $ref: '#/components/schemas/SizeChart' }
    AdminSizeChartList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminSizeChart' } }
    BulkSaleInput:
      type: object
      required: [category, percent, startsOn, endsOn]
      additionalProperties: false
      properties:
        category: { $ref: '#/components/schemas/Category' }
        percent: { type: integer, minimum: 5, maximum: 70 }
        startsOn: { type: string, format: date, description: 'Ngày VN; đợt bắt đầu 00:00:00 giờ VN.' }
        endsOn: { type: string, format: date, description: 'Ngày VN; đợt kết thúc 23:59:59 giờ VN; <= startsOn + 89 ngày.' }
    BulkSaleItem:
      type: object
      required: [productId, name, slug, price, salePrice]
      additionalProperties: false
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        price: { type: integer }
        salePrice: { type: [integer, 'null'], description: 'Giá giảm tính ra; null khi không tính được hợp lệ.' }
        reason: { type: string, enum: [sale-running, below-minimum, not-reduced], description: 'Chỉ ở `skipped`.' }
    BulkSaleResult:
      type: object
      required: [applicable, skipped, applied]
      additionalProperties: false
      properties:
        applicable: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/BulkSaleItem' } }
        skipped: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/BulkSaleItem' } }
        applied: { type: integer, minimum: 0, description: '0 ở xem trước; số sản phẩm đã ghi ở `adminApplyBulkSale`.' }
    CollectionInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, minLength: 2, maxLength: 50, pattern: '^[a-z0-9-]+$' }
        description: { type: string, maxLength: 300, default: '' }
        status: { type: string, enum: [active, draft], default: draft }
        productIds: { type: array, maxItems: 200, uniqueItems: true, items: { type: string, format: uuid }, default: [] }
    CollectionUpdate:
      allOf:
        - $ref: '#/components/schemas/CollectionInput'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    AdminCollection:
      type: object
      required: [id, name, slug, description, status, productIds, slugLocked, createdAt, updatedAt, updatedBy]
      additionalProperties: false
      description: 'Khớp FE `AdminCollection` với `productIds` là id sản phẩm thật (UUID).'
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, draft] }
        productIds: { type: array, items: { type: string, format: uuid } }
        slugLocked: { type: boolean, description: 'true sau lần `active` đầu.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        updatedBy:
          oneOf:
            - type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string }
            - type: 'null'
    AdminCollectionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminCollection' } }
    CollectionSummary:
      type: object
      required: [slug, name, description, productCount]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        productCount: { type: integer, minimum: 0 }
    CollectionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CollectionSummary' } }
    CollectionDetail:
      type: object
      required: [slug, name, description, products]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        products: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Product' } }
