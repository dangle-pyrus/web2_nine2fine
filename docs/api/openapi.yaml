        **Biến thể:** có `id` -> sửa (tồn gửi lên bị bỏ qua, chỉ đổi qua điều chỉnh tồn; đổi SKU khi đã có đơn -> `422 variants[i].sku`; đổi tên / hex màu áp cho mọi biến thể màu đó); không có `id` -> tạo (tồn ban đầu 0..100.000 + 1 dòng nhật ký); biến thể hiện có mà không gửi -> bỏ: xoá nếu chưa có dòng đơn, ngược lại `409 variant-in-use` (kèm `sku`). Sản phẩm `active` không được còn 0 biến thể.
