      description: |
        Quyền: staff, admin. Bắt buộc `Idempotency-Key`. Một giao dịch: khoá dòng biến thể, đổi tồn, ghi đúng 1 dòng nhật ký (thời điểm, biến thể, thay đổi, có thể bán sau, lý do, ghi chú, người + vai trò).
