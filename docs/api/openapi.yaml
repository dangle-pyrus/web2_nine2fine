      operationId: adminCancelOrder
      x-status: locked
      summary: Huỷ do shop / giao không thành / khách từ chối nhận (BR-ADM-18, 19, 24..26, 28)
      description: |
        `reason` là mã cố định, chỉ hợp lệ ở trạng thái cho phép (tổ hợp sai -> `409 invalid-transition`):
        | reason | trạng thái | điều kiện | ai |
        | --- | --- | --- | --- |
        | `unreachable` | `to_ship` | đơn cần gọi, chưa xác nhận, có **3 lần "không liên lạc được" liên tiếp** mà lần cuối trừ lần đầu <= 24 giờ 00 phút (cửa sổ 24 giờ bất kỳ, gồm cả mốc đúng 24 giờ 00; không cần cách nhau bao lâu). Chưa đủ (kể cả 24 giờ 01 phút) -> `409 condition-not-met`; đủ điều kiện chỉ **mở** lý do này, không tự huỷ | staff, admin |
        | `declined_on_call` | `to_ship` | đơn cần gọi, chưa xác nhận | staff, admin |
        | `customer_request` | `to_ship` | mọi đơn `to_ship` (COD cần gọi hay không, đã xác nhận hay chưa; khách gọi hotline xin huỷ trước khi bàn giao); `note` bắt buộc 5-250 ký tự (thiếu / ngắn / dài -> `422`, `field: note`) | staff, admin |
        | `refused` | `to_receive` | khách từ chối nhận; ghi `delivery_refused_at` (tính vào giới hạn COD, BR-CHK-19) | staff, admin |
        | `undeliverable` | `to_receive` | giao không thành; không tính giới hạn COD | staff, admin |
        | `other` | `to_ship` hoặc `to_receive` | `note` bắt buộc 5-250 ký tự (thiếu / ngắn / dài -> `422`, `field: note`) | **chỉ admin** (staff -> `403 forbidden`, kiểm trước khi đọc đơn) |

        Kết quả: `cancelled`, `cancelledBy = shop` (riêng `customer_request`: `cancelledBy = customer`, hoàn kho + voucher như `to_ship`, **không** ghi `delivery_refused_at` nên không tính giới hạn COD), `paymentStatus` giữ nguyên (COD `pending`). Đơn `cancel_requested` không huỷ bằng lý do nào ở đây (dùng duyệt / từ chối; -> `409 invalid-transition`). **Từ `to_ship`:** trong cùng giao dịch cộng lại đúng số lượng đã trừ của từng dòng (đúng một lần, dấu `stock_restored_at`) và trả lượt voucher nếu mã còn hạn (BR-ADM-25). **Từ `to_receive`** (S4-Q2): chưa cộng tồn (hàng chưa về kho), chỉ trả lượt voucher; đơn vào tab `returning` (`returnHandling.state = pending`), nhân viên xử lý ở `.../returned-stock`. `note` (tuỳ chọn <= 250 ký tự, bắt buộc với `other`) là ghi chú nội bộ: chỉ ở timeline admin. Gửi email "đơn đã huỷ" kèm câu chuẩn theo `reason` (không lộ `note`): `unreachable` "Chúng tôi không liên lạc được với bạn để xác nhận đơn."; `declined_on_call` "Bạn đã báo không muốn nhận đơn."; `refused` "Đơn không được nhận khi giao hàng."; `undeliverable` "Giao hàng không thành công."; `customer_request` "Đơn đã được huỷ theo yêu cầu của bạn."; `other` "nine2fine không thể thực hiện đơn này.". `Order.cancelReason` (storefront) = câu chuẩn đó.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/AdminOrderCode'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/AdminIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCancelRequest' }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
