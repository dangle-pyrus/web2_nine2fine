  /reviews:
    post:
      tags: [reviews]
      operationId: createReview
      x-status: locked
      summary: Thành viên đã nhận hàng gửi đánh giá, hiện ngay (BR-REV-03, 04)
      description: |
        Slice 10 (lát 10.5), status: locked. Cookie `n2f_sid` bắt buộc (khách vãng lai không đánh giá; staff / admin đăng nhập storefront không có đơn nên nhận `409 not-eligible`). KHÔNG có `Idempotency-Key`: ràng buộc DUY NHẤT (tài khoản, sản phẩm) là cơ chế chống trùng; gửi lại sau khi mất mạng mà lần đầu đã thành công -> `409 already-reviewed` (FE tải lại eligibility / danh sách). Giới hạn 5 / giờ / tài khoản (đếm mọi lần gọi tới được thân), vượt -> `429 rate-limited`.

        **Thứ tự kiểm:** `403 origin-not-allowed` -> `401` -> `429` -> `422` (thân, MỌI lỗi theo trường một lần ở `error.fieldErrors`, `field` = trường đầu) -> `404` (sản phẩm không có / không `ACTIVE`) -> giao dịch: `409 already-reviewed` (đã có đánh giá của tài khoản cho sản phẩm; kể cả ẩn) -> `409 not-eligible` (BR-REV-01, cùng định nghĩa với eligibility; không tạo bản ghi) -> `201`. 10 yêu cầu đồng thời cho cùng (tài khoản, sản phẩm): đúng 1 × `201`, 9 × `409 already-reviewed`, DB đúng 1 hàng.

        **Thân (NFC, cắt khoảng trắng hai đầu, không ký tự điều khiển ngoài xuống dòng):** `productId` UUID; `rating` nguyên 1..5; `fit` ∈ {-1, 0, 1}; `height` tuỳ chọn <= 20 ký tự (vắng = rỗng); `title` 2..80 ký tự và có >= 1 ký tự không phải khoảng trắng; `body` 20..1000 ký tự (sau cắt). `sizeBought`, `author`, `date`, `verified`, `status` nếu FE gửi đều BỊ BỎ QUA: máy chủ đặt `sizeBought` từ đơn đủ điều kiện mới nhất, `author` = "Họ + chữ cái đầu của tên" chụp lúc gửi, `verified = true`. Đánh giá hiện công khai NGAY (hậu kiểm); khách không sửa / xoá được.
      security:
        - storefrontSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreateInput' }
      responses:
        '201':
          description: Đánh giá đã tạo (dạng công khai, để FE hiện đánh giá của mình ngay).
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductReview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ReviewConflict' }
        '422': { $ref: '#/components/responses/FieldValidation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
