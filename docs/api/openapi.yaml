      summary: Phường / xã của một tỉnh (BR-CHK-06)
      parameters:
        - { name: provinceCode, in: path, required: true, schema: { type: string, maxLength: 10 } }
      responses:
        '200':
          description: Danh sách phường / xã của tỉnh.
