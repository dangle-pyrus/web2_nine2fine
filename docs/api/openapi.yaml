  /reviews/eligibility:
    get:
      tags: [reviews]
      operationId: getReviewEligibility
      x-status: locked
      summary: Trạng thái đủ điều kiện đánh giá một sản phẩm (BR-REV-01, 02)
      description: |
        Slice 10 (lát 10.5), status: locked. Phụ thuộc người dùng nên KHÔNG nằm dưới `/products/**`. Cookie `n2f_sid` TUỲ CHỌN: không phiên / phiên sai / hết hạn -> vẫn `200` với `status = sign-in` (không `401`, không `Set-Cookie`). Phản hồi `Cache-Control: no-store`. Giới hạn 120 / 60 giây / tài khoản (khách: IP).

        Thứ tự: `429` -> `422` (`productId` thiếu / sai dạng UUID, `field: productId`) -> `404 not-found` (sản phẩm không có hoặc không `ACTIVE`) -> trạng thái. `status`: `sign-in` (không phiên / phiên không hợp lệ; staff / admin đăng nhập storefront được coi như tài khoản thường, không có đơn nên ra `not-purchased`); `reviewed` (đã có đánh giá của tài khoản cho sản phẩm này, kể cả đang bị ẩn); `eligible` (có >= 1 đơn `completed` có `deliveredAt` trong 365 ngày qua chứa sản phẩm, VÀ không phải trường hợp mọi số lượng sản phẩm đó của các đơn ấy đã hoàn: yêu cầu trả hàng `refunded` hết dòng); `not-purchased` (còn lại: chưa mua, mua chưa nhận `to_receive`, đơn huỷ, quá 365 ngày, đã trả hết). `sizeBought` chỉ có khi `eligible`: size của dòng thuộc đơn đủ điều kiện GIAO MỚI NHẤT; FE không quyết định.
