security: []
paths:
  /auth/lookup:
    post:
      tags: [storefront-auth]
      operationId: lookupEmail
      summary: Tra email đã đăng ký chưa (BR-AUTH-02)
      description: |
        Chỉ trả `registered`. Tài khoản bị vô hiệu vẫn là `true`. Giới hạn: 20 lần / 15 phút / IP và 10 lần / 15 phút / email.
        Đây là đường dò email duy nhất được chấp nhận (luồng Figma).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: '#/components/schemas/Email' }
      responses:
        '200':
          description: Kết quả tra cứu (AC-AUTH-01, 03, 04).
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                additionalProperties: false
                properties:
                  registered: { type: boolean }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /auth/codes:
    post:
      tags: [storefront-auth]
      operationId: requestCode
      summary: Gửi / gửi lại mã 8 số (BR-AUTH-04..09)
      description: |
        Phản hồi 200 luôn giống nhau dù email có tài khoản hay không (BR-AUTH-03, 09):
        - `register` + email chưa có tài khoản: gửi mã. `register` + đã có: gửi thư "đã có tài khoản", không mã.
        - `login` / `reset-password` + tài khoản hoạt động: gửi mã. Không có tài khoản: không gửi gì. Tài khoản bị vô hiệu: gửi thư báo khoá kèm email hỗ trợ, không mã.
        - Đang trong thời gian chờ 60 giây (cùng email + mục đích): không tạo mã mới, mã cũ còn hiệu lực, vẫn 200 với `resendAfterSeconds` = số giây còn lại (BR-AUTH-06a, AC-AUTH-13/14).
        Mã hết hạn sau 10 phút; tạo mã mới vô hiệu mã cũ cùng email + mục đích (BR-AUTH-05, 07).
        Giới hạn: 5 lần gửi / 30 phút / email / mục đích; 30 lần / giờ / IP (BR-AUTH-06b/c) -> `429 rate-limited`. Email đang bị khoá xác thực bằng mã (BR-AUTH-08) -> `429 code-locked`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                purpose: { $ref: '#/components/schemas/CodePurpose' }
      responses:
        '200':
          description: Đã xử lý (có thể không gửi thư). AC-AUTH-24, 25, 26.
          content:
            application/json:
              schema:
                type: object
                required: [resendAfterSeconds]
                additionalProperties: false
                properties:
                  resendAfterSeconds:
                    type: integer
                    minimum: 0
                    maximum: 60
                    description: Số giây FE phải chờ trước lần gửi kế tiếp.
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429':
          description: '`rate-limited` (AC-AUTH-15, 16) hoặc `code-locked` (AC-AUTH-20).'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /auth/login/code:
    post:
      tags: [storefront-auth]
      operationId: loginWithCode
      summary: Đăng nhập bằng mã (BR-AUTH-16)
      description: |
        Mã mục đích `login`, dùng 1 lần. Mã đúng + tài khoản hoạt động -> tạo phiên (`method=otp`), `Set-Cookie: n2f_sid`.
        Mọi thất bại (sai, hết hạn, đã dùng, bị thay, email không có mã) -> `422 invalid-code` cùng thông điệp, không nêu số lần còn lại (BR-AUTH-08). Sai 5 lần / email / mục đích (đếm cả email không tồn tại) -> huỷ mã, khoá xác thực bằng mã 15 phút -> `429 code-locked`.
        Mã đúng nhưng tài khoản bị vô hiệu -> `403 account-disabled` (chỉ sau khi xác thực đúng, BR-AUTH-19). Đăng nhập thành công xoá bộ đếm sai mã và sai mật khẩu của email.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                code: { $ref: '#/components/schemas/Code' }
      responses:
        '200': { $ref: '#/components/responses/SessionCreated' }
        '403':
          description: '`account-disabled` (AC-AUTH-26 luồng X) hoặc `origin-not-allowed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`validation` (định dạng) hoặc `invalid-code` (AC-AUTH-09..12, 17, 19, 21).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: '`code-locked` (AC-AUTH-20..22) hoặc `rate-limited` (IP).'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /auth/login/password:
    post:
      tags: [storefront-auth]
      operationId: loginWithPassword
      summary: Đăng nhập bằng mật khẩu (BR-AUTH-17, 18, 19)
      description: |
        Email không tồn tại, tài khoản chưa có mật khẩu, sai mật khẩu, tài khoản bị vô hiệu + mật khẩu sai -> cùng `401 invalid-credentials` (AC-AUTH-42, 43, 49). Mật khẩu so nguyên văn.
        5 lần sai liên tiếp / email (mỗi lần cách lần trước <= 15 phút; đếm cả email không tồn tại) -> khoá 15 phút -> `429 password-locked`, kể cả khi nhập đúng (AC-AUTH-44, 47). Thêm 20 lần sai / 15 phút / IP -> `429 rate-limited` (AC-AUTH-48). Đăng nhập bằng mã không bị ảnh hưởng và gỡ khoá (AC-AUTH-45).
        Mật khẩu đúng + tài khoản bị vô hiệu -> `403 account-disabled` (AC-AUTH-50). Thành công -> phiên `method=password`, `Set-Cookie: n2f_sid`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Nguyên văn, không trim. Không áp quy tắc BR-AUTH-20 ở đường đăng nhập.
      responses:
        '200': { $ref: '#/components/responses/SessionCreated' }
        '401':
          description: '`invalid-credentials`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: '`account-disabled` hoặc `origin-not-allowed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Validation' }
        '429':
          description: '`password-locked` hoặc `rate-limited`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /auth/register:
    post:
      tags: [storefront-auth]
      operationId: register
      summary: Đăng ký không mật khẩu (BR-AUTH-10..15)
      description: |
        Thứ tự xử lý: (1) validate định dạng mọi trường (kể cả tuổi >= 13, đồng ý điều khoản) **trước khi tiêu mã** -> `422 validation`/`underage`; (2) kiểm mã mục đích `register` -> `422 invalid-code` / `429 code-locked`; (3) trong 1 transaction: nếu email đã có tài khoản -> `409 email-registered` (chỉ lộ sau khi mã đúng, BR-AUTH-14), nếu chưa -> tạo user `role=member`, `isActive=true`, không mật khẩu, `termsAcceptedAt=now`, `marketingOptInAt=now` nếu tick; huỷ mã; tạo phiên `method=register`. Ràng buộc UNIQUE(email) bảo đảm đúng 1 tài khoản khi 2 yêu cầu đồng thời (AC-AUTH-37), yêu cầu thua nhận `409 email-registered`.
        `birthDate`: `null` hoặc ngày có thật trong [1900-01-01, hôm nay giờ VN); nếu có thì phải đủ 13 tuổi tính theo ngày giờ VN (đúng sinh nhật 13 là đủ). Thiếu 1 phần / ngày không có thật / tương lai -> `validation` field `birthDate`; chưa đủ 13 -> `underage` field `birthDate`.
        `acceptedTerms` phải đúng `true` (AC-AUTH-33).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, firstName, lastName, marketingOptIn, acceptedTerms]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                code: { $ref: '#/components/schemas/Code' }
                firstName:
                  allOf: [{ $ref: '#/components/schemas/PersonName' }]
                  description: Tên gọi, ví dụ "Minh" (BR-AUTH-10, D14).
                lastName:
                  allOf: [{ $ref: '#/components/schemas/PersonName' }]
                  description: Họ và tên đệm, ví dụ "Nguyễn Văn".
                birthDate:
                  type: [string, 'null']
                  format: date
                  description: YYYY-MM-DD hoặc null.
                marketingOptIn: { type: boolean, default: false }
                acceptedTerms:
                  type: boolean
                  const: true
      responses:
        '201':
          description: Đã tạo tài khoản và phiên (AC-AUTH-29, 34, 36, 39).
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409':
          description: '`email-registered` (AC-AUTH-37).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`validation` (có `field`), `underage` (field `birthDate`) hoặc `invalid-code` (AC-AUTH-27, 28, 32, 32b, 33, 38).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: '`code-locked` hoặc `rate-limited`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /auth/password/reset:
    post:
      tags: [storefront-auth]
      operationId: resetPassword
      summary: Đặt lại / tạo mật khẩu lần đầu (BR-AUTH-20..22)
      description: |
        Mã mục đích `reset-password`. Thứ tự: validate `newPassword` (BR-AUTH-20: 8-64 ký tự, >= 1 A-Z, >= 1 0-9, không trùng email không phân biệt hoa thường) **trước khi tiêu mã** (AC-AUTH-53); kiểm mã; trong 1 transaction: lưu băm bcrypt, huỷ mọi mã reset còn lại của email, xoá bộ đếm sai mật khẩu + khoá, **thu hồi mọi phiên** của user (cả storefront và admin). Không tự đăng nhập, không `Set-Cookie`. Gửi thư "Mật khẩu vừa thay đổi" (Should, nền). Email không có tài khoản: mã không thể đúng nên trả `invalid-code` như mọi trường hợp (BR-AUTH-03).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                code: { $ref: '#/components/schemas/Code' }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204':
          description: Đã đổi mật khẩu, mọi phiên đã bị thu hồi (AC-AUTH-54, 56, 57, 58, 59).
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422':
          description: '`validation` (field `newPassword`) hoặc `invalid-code` (AC-AUTH-51, 51b, 53, 59).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: '`code-locked` hoặc `rate-limited`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /auth/me:
    get:
      tags: [storefront-auth]
      operationId: getCurrentSession
      summary: Phiên hiện tại (khôi phục khi tải lại, BR-AUTH-25)
      description: |
        Luôn 200. Khách -> `{user:null}` (không phải lỗi, AC-AUTH-66). Cookie hết hạn / bị thu hồi -> `{user:null}` và `Set-Cookie` xoá cookie. Phiên hợp lệ -> hồ sơ công khai và trượt hạn không-hoạt-động.
        Khác `GET /admin/auth/me`: storefront coi "chưa đăng nhập" là trạng thái bình thường nên không 401.
        Phản hồi có `Cache-Control: no-store`.
      security:
        - storefrontSession: []
        - {}
      responses:
        '200':
          description: Hồ sơ hoặc null.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/AuthUser'
                      - type: 'null'
        '500': { $ref: '#/components/responses/Unavailable' }
  /auth/logout:
    post:
      tags: [storefront-auth]
      operationId: logout
      summary: Đăng xuất phiên hiện tại (BR-AUTH-27)
      description: |
        Chỉ thu hồi đúng phiên khớp cookie; phiên khác của user giữ nguyên (AC-AUTH-70). Cookie thiếu / giả / hết hạn -> vẫn `204` và xoá cookie, không thu hồi phiên nào (AC-AUTH-71, 73). Cần qua kiểm tra CSRF để kẻ khác không đăng xuất hộ.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
        - {}
      responses:
        '204':
          description: Đã đăng xuất (hoặc vốn đã là khách).
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieCleared' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: Đăng nhập staff / admin bằng mật khẩu (BR-AUTH-31, 33)
      description: |
        Chỉ tài khoản `role` in (`staff`,`admin`); member hay email lạ -> cùng `401 invalid-credentials`. Cùng bộ đếm khoá và giới hạn IP với `/auth/login/password` (BR-AUTH-18). Tài khoản bị vô hiệu + đúng mật khẩu -> `403 account-disabled`. Phiên `audience=admin`, hạn 8 giờ / 24 giờ, `Set-Cookie: n2f_asid`. Staff/admin vẫn đăng nhập được ở storefront bằng `/auth/login/*` (bảng 4.10a). Không có đăng nhập bằng mã ở admin trong Slice 1; quên mật khẩu admin dùng `/auth/codes` + `/auth/password/reset` (cùng bảng users).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Hồ sơ staff/admin + cookie admin.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieAdminSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          description: '`invalid-credentials`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: '`account-disabled` hoặc `origin-not-allowed`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Validation' }
        '429':
          description: '`password-locked` hoặc `rate-limited`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /admin/auth/me:
    get:
      tags: [admin-auth]
      operationId: adminGetCurrentSession
      summary: Phiên admin hiện tại
      description: 'Giữ hành vi FE admin hiện có (adminAuthGuard bắt lỗi 401): chưa đăng nhập -> 401 unauthenticated. Phản hồi Cache-Control: no-store.'
      security:
        - adminSession: []
      responses:
        '200':
          description: Hồ sơ staff/admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          description: '`unauthenticated` (AC-AUTH-64, 88).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /admin/auth/logout:
    post:
      tags: [admin-auth]
      operationId: adminLogout
      summary: Đăng xuất phiên admin hiện tại
      description: Như `/auth/logout` nhưng với cookie `n2f_asid`; luôn `204`.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - adminSession: []
        - {}
      responses:
        '204':
          description: Đã đăng xuất.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookieCleared' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Danh sách sản phẩm có lọc, sắp xếp, phân trang, tìm kiếm (status draft)
      description: |
        Phục vụ `/new-in`, `/shop`, `/shop/nam|nu`, `/shop/{category}`, `/shop-by-moment/{moment}`, `/search?q=`, trang Yêu thích (`ids`), panel gợi ý (`q` + `limit=5`) và dải sản phẩm ở Home / giỏ (`limit` <= 12). BR-CAT-06, 07, 08, 13, 14, 15, 16.

        **Lọc (AND):** `gender` -> `genders` chứa giá trị; `category` -> trùng `slug` danh mục; `moment` -> `moments` chứa giá trị; `maxPrice` -> `price <= maxPrice` (bằng là đạt, so với giá bán, không phải `compareAtPrice`); `q` -> sau khi trim, gộp khoảng trắng, bỏ dấu, `đ` = `d`, không phân biệt hoa thường, **mọi** từ phải là chuỗi con của "tên + loại" (`name` + `type`); `%`, `_`, dấu gạch ngược, `'`, `"` là ký tự thường; `ids` -> `id` thuộc danh sách (id sai định dạng UUID hoặc không tồn tại bị bỏ qua; mọi id đều bị bỏ -> `items: []`).
        **Lọc theo biến thể (C4):** `size` (không phân biệt hoa thường), `color` (tên màu, ví dụ `Đỏ`), `available=true` áp lên **cùng một biến thể**: sản phẩm khớp nếu tồn tại ít nhất 1 biến thể thoả đồng thời mọi điều kiện đã cho (`size`, `color.name`, `inventory > 0` nếu `available=true`). Không có tham số biến thể -> không xét biến thể.
        **Sắp xếp:** `featured` (mặc định) = `displayOrder` tăng; `newest` = `createdAt` giảm; `price-asc`; `price-desc`; `bestselling` = `salesRank` tăng; luôn hoà bằng `slug` tăng.
        **Phân trang:** `total` = số sản phẩm khớp toàn bộ bộ lọc, không phụ thuộc trang. `page` vượt trang cuối -> `200`, `items: []`. Mỗi sản phẩm trong `items` có đủ `variants` (mọi biến thể, kể cả biến thể không khớp bộ lọc) để thẻ hiện đúng màu / tồn kho.
      parameters:
        - { name: gender, in: query, schema: { type: string, maxLength: 20 }, description: '`nam` hoặc `nu`. Giá trị lạ -> danh sách rỗng.' }
        - { name: category, in: query, schema: { type: string, maxLength: 50 }, description: 'Slug danh mục (`tops`, `bottoms`, `dresses`, `outerwear`). Giá trị lạ -> danh sách rỗng.' }
        - { name: moment, in: query, schema: { type: string, maxLength: 50 }, description: '`work`, `dinner`, `event`, `weekend`. Giá trị lạ -> danh sách rỗng.' }
        - { name: size, in: query, schema: { type: string, maxLength: 10 }, description: 'Ví dụ `S`, `M`, `L`, `XL`. Giá trị lạ -> danh sách rỗng.' }
        - { name: color, in: query, schema: { type: string, maxLength: 50 }, description: 'Tên màu hiển thị, ví dụ `Đen`, `Trắng`, `Xám`, `Đỏ`. Giá trị lạ -> danh sách rỗng.' }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0, maximum: 999999999999 }, description: '0 hoặc vắng = không lọc. Không phải số nguyên >= 0 (`-5`, `abc`, `1.5`) -> 422 field `maxPrice`.' }
        - { name: available, in: query, schema: { type: boolean }, description: '`true` = chỉ sản phẩm có biến thể (khớp `size`/`color` nếu có) với tồn kho > 0. `false` = không lọc. Giá trị khác -> 422 field `available`.' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Từ khoá. Rỗng sau chuẩn hoá = không tìm. Quá 100 ký tự sau chuẩn hoá -> 422 field `q`.' }
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/SortOrder' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
        - { name: ids, in: query, schema: { type: string, maxLength: 2000 }, description: 'Danh sách `id` sản phẩm cách nhau dấu phẩy, tối đa 48 phần tử (quá -> 422 field `ids`).' }
      responses:
        '200':
          description: Trang kết quả (có thể rỗng).
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=10' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /products/{slug}:
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Chi tiết sản phẩm theo slug (status draft)
      description: |
        BR-CAT-09, 10. `slug` trong đường dẫn được trim và hạ chữ thường trước khi tìm (`The-Everyday-Blazer%20` tìm được); phản hồi mang `slug` chuẩn để FE đổi URL bằng `replaceUrl`. Không có, không `ACTIVE`, quá 80 ký tự hoặc chứa ký tự ngoài `a-z 0-9 -` (sau chuẩn hoá) -> `404 not-found`, không bao giờ `422`/`500`.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sản phẩm đầy đủ.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=10' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /products/{productId}/reviews:
    get:
      tags: [catalog]
      operationId: listProductReviews
      summary: Đánh giá sản phẩm - luôn rỗng ở Slice 2 (status draft)
      description: |
        BR-CAT-17 (Thắng chốt 2026-11-07). Luôn `200 []`, không truy vấn DB, không kiểm `productId` có tồn tại. Giữ endpoint để adapter HTTP hiện có (`reviews(productId)`) không gặp lỗi; FE ở chế độ HTTP không hiện khối đánh giá. Đánh giá thật làm sau Slice 3.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Mảng rỗng.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=10' } }
          content:
            application/json:
              schema: { type: array, maxItems: 0, items: {} }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /size-charts/{category}:
    get:
      tags: [catalog]
      operationId: getSizeChart
      summary: Bảng size theo danh mục (status draft)
      description: BR-CAT-12. Danh mục không thuộc `Category` (ví dụ `shoes`) -> `404 not-found`. Mỗi bảng có đủ hàng S, M, L, XL ở `body` và `garment`.
      parameters:
        - { name: category, in: path, required: true, schema: { type: string, maxLength: 50 } }
      responses:
        '200':
          description: Bảng size (cm).
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SizeChart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /locations/provinces:
    get:
      tags: [checkout]
      operationId: listProvinces
      summary: Danh sách tỉnh / thành (34 đơn vị sau 01/07/2025, BR-CHK-06)
      description: Công khai, không cần cookie. `[giả định chờ Thắng]` phạm vi toàn quốc. Sắp theo `name` (so sánh không dấu).
      responses:
        '200':
          description: Danh sách tỉnh / thành.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=86400' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /locations/provinces/{provinceCode}/wards:
    get:
      tags: [checkout]
      operationId: listWards
      summary: Phường / xã của một tỉnh (BR-CHK-06)
      parameters:
        - { name: provinceCode, in: path, required: true, schema: { type: string, maxLength: 10 } }
      responses:
        '200':
          description: Danh sách phường / xã của tỉnh.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=86400' } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /checkout/quote:
    post:
      tags: [checkout]
      operationId: quoteCheckout
      summary: Báo giá phía máy chủ (BR-CART-08, BR-CHK-10, BR-VOU-05..08)
      description: |
        Dùng cho cả làm tươi giỏ khách (không cần địa chỉ) lẫn checkout. Không đổi dữ liệu, không giữ hàng, không trừ lượt voucher. Cần `X-Requested-With` vì là `POST` có body.
        - Giá, tồn, trạng thái bán lấy từ DB; mọi giá trong body bị bỏ qua (AC-CHK-10). Mỗi dòng trả `effectiveQuantity = min(quantity, 5, tồn)`; `pricing` tính trên `effectiveQuantity` (dòng hết hàng / ngừng bán = 0).
        - Vượt hạn mức **cấu trúc** (hơn 30 dòng, hoặc tổng `effectiveQuantity` quá 20) -> `422 validation`, `field: items` (AC-CART-05).
        - `voucherCodes` tối đa 2 mã (1 mã giảm + 1 mã free-ship; hai mã cùng loại thì mã đứng sau thay mã đứng trước). Mã bị từ chối **không** làm hỏng báo giá: nằm trong `rejectedVouchers` kèm `reason`, `pricing` tính không có mã đó (BR-VOU-08). Mã không tồn tại cộng vào bộ đếm chống dò (BR-VOU-09).
        - Chưa có `address`: `shipping.addressRequired = true`; phí vẫn tính theo mức đồng giá nhưng FE hiện "tính sau khi nhập địa chỉ" (BR-CHK-06, CHK-PAY-02).
        - `contact.phone` / `contact.email` dùng để nhận diện khách vãng lai khi kiểm lượt riêng của mã và điều kiện COD; thành viên dùng tài khoản.
        - Giới hạn: 120 yêu cầu / 60 giây / IP (chung nhóm với giỏ và kiểm mã).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Báo giá. AC-CART-08..10, AC-CHK-10, AC-VOU-01, 06, 07.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /vouchers/check:
    post:
      tags: [voucher]
      operationId: checkVoucher
      summary: Kiểm một mã giảm giá trên đơn hiện tại (BR-VOU-03, 04, 09)
      description: |
        Áp thử `code` lên các `items` (cùng ngữ nghĩa với `quote`) cùng các mã đã áp (`voucherCodes`). Mã không đạt **không** là lỗi HTTP: `200` với `result` là `VoucherRejection` để FE giữ nguyên mã khách gõ. `quote` là báo giá sau khi áp (có mã nếu đạt, không có nếu không đạt). Không trừ lượt.
        Kiểm theo thứ tự BR-VOU-03 và dừng ở điều kiện đầu tiên không đạt (AC-VOU-03). Mã không tồn tại tính vào bộ đếm 10 lần / 15 phút / IP; vượt -> `429 rate-limited` (`retryAfterSeconds` <= 900) kể cả cho mã đúng (AC-VOU-11); 9 lần sai chưa khoá.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, items]
              additionalProperties: false
              properties:
                code: { type: string, minLength: 1, maxLength: 40, description: 'Server trim, bỏ khoảng trắng, chuyển chữ hoa. Dài hơn 20 ký tự sau chuẩn hoá = không tồn tại.' }
                items: { $ref: '#/components/schemas/QuoteItems' }
                voucherCodes: { $ref: '#/components/schemas/VoucherCodes' }
                address: { $ref: '#/components/schemas/QuoteAddress' }
                contact: { $ref: '#/components/schemas/QuoteContact' }
      responses:
        '200':
          description: Kết quả kiểm mã và báo giá mới.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [result, quote]
                additionalProperties: false
                properties:
                  result:
                    oneOf:
                      - $ref: '#/components/schemas/VoucherApplied'
                      - $ref: '#/components/schemas/VoucherRejection'
                  quote: { $ref: '#/components/schemas/Quote' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Giỏ của thành viên, đã làm tươi giá / tồn (BR-CART-08, 09)
      description: |
        Chỉ đọc, không sửa giỏ. Giỏ không sửa trong 30 ngày (tính từ lần sửa cuối) bị coi là rỗng và xoá (AC-CART-12). Mỗi dòng trả `maxQuantity` và `availability` hiện tại; FE tự so với bản chụp giá cục bộ để hiện "Giá đã thay đổi từ X thành Y" (máy chủ không lưu giá đã thấy). Giới hạn: 120 yêu cầu / 60 giây / IP.
      security:
        - storefrontSession: []
      responses:
        '200':
          description: Giỏ.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/lines:
    post:
      tags: [cart]
      operationId: addCartLine
      summary: Thêm vào giỏ (BR-CART-01..03)
      description: |
        Thêm lại phiên bản đã có thì **cộng** vào dòng cũ, cắt ở `min(5, tồn)` (`notice` ghi lại việc cắt). Dòng thứ 31 -> `422 validation` (`field: variantId`, "Giỏ hàng tối đa 30 sản phẩm khác nhau.", AC-CART-04). Phiên bản không bán / hết hàng -> `409 stock-changed` (không thêm).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              additionalProperties: false
              properties:
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/StockChanged' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/lines/{variantId}:
    put:
      tags: [cart]
      operationId: setCartLineQuantity
      summary: Đặt số lượng một dòng (BR-CART-02)
      description: |
        Đặt (không cộng) số lượng; vượt `min(5, tồn)` thì cắt và `notice` ghi `stock-limit` / `per-variant-limit`. Dòng không có trong giỏ -> `404 not-found`. Muốn xoá dùng `DELETE`.
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [cart]
      operationId: removeCartLine
      summary: Xoá một dòng (BR-CART-02). Hoàn tác 5 giây là việc của FE bằng cách thêm lại đúng số lượng.
      description: Dòng không có trong giỏ vẫn `200` (idempotent).
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/lines/{variantId}/change-variant:
    post:
      tags: [cart]
      operationId: changeCartLineVariant
      summary: Đổi màu / size trong cùng sản phẩm (BR-CART-05)
      description: |
        `toVariantId` phải cùng sản phẩm với dòng hiện tại và còn hàng, nếu không `422 validation` (`field: toVariantId`) / `409 stock-changed`. Đã có dòng `toVariantId` thì gộp: số lượng = tổng hai dòng cắt theo `min(5, tồn)`; `notice.code = merged` (kèm `adjustedTo` khi bị cắt). Nguyên tử trong một giao dịch.
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toVariantId]
              additionalProperties: false
              properties:
                toVariantId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/CartMutated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StockChanged' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /cart/merge:
    post:
      tags: [cart]
      operationId: mergeGuestCart
      summary: Gộp giỏ khách vào giỏ tài khoản sau đăng nhập (BR-CART-10)
      description: |
        Bắt buộc `Idempotency-Key`: gửi lại sau mất kết nối không nhân đôi (AC-CART-15). `lines` là phần **cần cộng thêm** (FE chỉ gửi phần khách thêm lúc chưa đăng nhập, không gửi lại phần đã đồng bộ từ máy chủ, AC-CART-18). Cùng phiên bản -> cộng số lượng cắt theo `min(5, tồn)`; khác -> thêm dòng; phiên bản không còn bán bị bỏ qua (`skippedVariantIds`). Vượt 30 dòng: máy chủ xoá các dòng có `updatedAt` cũ nhất cho tới khi còn 30 và trả chúng ở `evicted` để FE chuyển vào Yêu thích (AC-CART-14). `mergedVariantIds` là các dòng vừa mang sang (FE chỉ chọn chúng, AC-CART-13); `addedCount` = số dòng vừa mang sang, FE báo một lần "Đã thêm N sản phẩm từ giỏ hàng trước khi đăng nhập.".
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - storefrontSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              additionalProperties: false
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    required: [variantId, quantity]
                    additionalProperties: false
                    properties:
                      variantId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: 'Giỏ sau khi gộp (cũng là phản hồi của lần gửi lại cùng khoá, kèm header `Idempotency-Replayed` = true).'
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema:
                type: object
                required: [cart, mergedVariantIds, skippedVariantIds, addedCount, evicted]
                additionalProperties: false
                properties:
                  cart: { $ref: '#/components/schemas/CartView' }
                  mergedVariantIds: { type: array, items: { type: string, format: uuid } }
                  skippedVariantIds: { type: array, items: { type: string, format: uuid } }
                  addedCount: { type: integer, minimum: 0 }
                  evicted:
                    type: array
                    items:
                      type: object
                      required: [variantId, productId, quantity]
                      additionalProperties: false
                      properties:
                        variantId: { type: string, format: uuid }
                        productId: { type: string, format: uuid }
                        quantity: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders:
    post:
      tags: [order]
      operationId: placeOrder
      summary: Đặt hàng (BR-CHK-12..18, 20, 21; BR-VOU-10..12)
      description: |
        Công khai: khách vãng lai đặt được; cookie phiên sai / hết hạn / bị thu hồi -> đơn khách, không `401` (AC-CHK-02). Phiên member hợp lệ -> đơn gắn tài khoản; đơn khách trùng email / SĐT với tài khoản **không** tự gắn (BR-CHK-27).
        Một giao dịch DB duy nhất: kiểm lại mọi thứ -> trừ lượt voucher -> trừ tồn từng dòng (chỉ khi còn đủ) -> tạo đơn + dòng đơn chụp giá -> xoá khỏi giỏ thành viên đúng các dòng đã mua. Thứ tự lỗi xem "Quy ước Slice 3". Thất bại ở bất kỳ bước nào: không đơn, không trừ tồn, không trừ lượt.
        Trạng thái ban đầu: COD -> `to_ship` + `pending`; `bank-transfer` -> `to_pay` + `pending` kèm `paymentDueAt` = lúc đặt + 30 phút (không gia hạn). `bank-transfer` chỉ khi `bankTransferEnabled` `[giả định chờ Thắng]`.
        Email xác nhận gửi nền sau khi đơn commit; email lỗi không bao giờ làm đơn thất bại (BR-CHK-28). Giới hạn: 10 yêu cầu / 10 phút / IP.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - storefrontSession: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: Đơn mới tạo.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReceipt' }
        '200':
          description: 'Gửi lại cùng `Idempotency-Key` + cùng nội dung trong 24 giờ: đúng đơn đã tạo (trạng thái hiện tại), không tác dụng phụ.'
          headers:
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReceipt' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '409':
          description: |
            Một trong: `stock-changed` (kèm `stockIssues`, AC-CHK-13), `voucher-changed` (kèm `removedVoucherCodes`, AC-VOU-12/13), `price-changed` (AC-CHK-12), `idempotency-conflict` (AC-CHK-18), `possible-duplicate` (kèm `existingOrderCode`, Should, AC-CHK-20). Trừ `idempotency-conflict` và `possible-duplicate`, luôn kèm `quote` mới nhất.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: '`validation` (kèm `field`, ví dụ `contact.phone`, `address.street`, `acceptedTerms`, `paymentMethod`, `items`, `Idempotency-Key`) hoặc `invalid-address` (`field: address.wardCode`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [order]
      operationId: listMyOrders
      summary: Đơn của thành viên, mới nhất trước (BR-CHK-27)
      description: Chỉ đơn gắn với người đang đăng nhập (đơn khách trùng email không hiện). 10 đơn mỗi lần "Xem thêm". Phiên hỏng -> `401 unauthenticated` (AC-CHK-33).
      security:
        - storefrontSession: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Một trang đơn (sắp `placedAt` giảm dần, hoà bằng mã đơn).
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /orders/lookup/codes:
    post:
      tags: [order]
      operationId: requestOrderLookupCode
      summary: Khách gửi mã đơn + email để nhận OTP tra cứu (BR-CHK-26)
      description: |
        Luôn `200` cùng nội dung dù mã đơn / email có khớp hay không; chỉ gửi OTP khi khớp (chống dò đơn, AC-CHK-31). OTP 8 số, hiệu lực 10 phút, gửi lại sau 60 giây, hạn mức gửi như BR-AUTH-04..09 `[giả định chờ Thắng]`; lưu băm trong `auth_action_tokens` (`purpose = guest_order_lookup`). Email so sánh sau trim + chữ thường. Giới hạn: 10 yêu cầu / 15 phút / IP (chung với `lookup/verify`).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderCode, email]
              additionalProperties: false
              properties:
                orderCode: { $ref: '#/components/schemas/OrderCodeInput' }
                email: { $ref: '#/components/schemas/Email' }
      responses:
        '200':
          description: Đã xử lý (có thể không gửi thư).
          content:
            application/json:
              schema:
                type: object
