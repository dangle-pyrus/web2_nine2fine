        Slice 10 (lát 10.3), status: locked. Quyền `content.edit` (CHỈ admin; staff -> `403 forbidden` trước khi đọc thân, DB không đổi). `category` là slug danh mục (`tops`, `bottoms`, `dresses`, `outerwear`); không có -> `404 not-found`. MỘT lần ghi nguyên bảng `{body, garment, bodyColumns, garmentColumns, updatedAt}`; `updatedAt` = giá trị lần đọc gần nhất (`null` chỉ khi chưa có dòng). Lệch -> `409 version-conflict` kèm `error.current` = `AdminSizeChart` hiện tại, KHÔNG ghi; đồng thời: 1 × `200`, còn lại `409`. Thành công: `updatedAt` mới, người sửa; `GET /size-charts/{category}` trả bản mới trong <= 60 giây (`max-age=60`).

        **Kiểm giá trị (MỌI lỗi một lần ở `error.fieldErrors`, đường dẫn như `body[2].size`, `body[0].values.Ngực`, `garmentColumns[1]`):** `body` và `garment` mỗi bảng 1..12 hàng; `bodyColumns` / `garmentColumns` 1..8 cột, tên cột 1..20 ký tự và duy nhất trong bảng; nhãn size (`size`) 1..10 ký tự và duy nhất trong bảng; mỗi hàng phải có ĐÚNG các khoá `values` bằng tập cột tương ứng (thiếu / thừa cột -> `422` theo đường dẫn); mỗi ô `values[cột]` không rỗng (sau cắt) và <= 20 ký tự. Chuỗi NFC, cắt hai đầu, không ký tự điều khiển.
      security:
        - adminSession: []
      parameters:
        - { name: category, in: path, required: true, schema: { type: string, maxLength: 50 } }
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SizeChartInput' }
      responses:
        '200':
          description: Bảng size vừa lưu.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSizeChart' }
