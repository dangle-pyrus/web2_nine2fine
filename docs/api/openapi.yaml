        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnCreateInput' }
      responses:
        '200':
          description: Phát lại kết quả lần đầu (cùng `Idempotency-Key` + cùng nội dung).
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Idempotency-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '201':
          description: Đã tạo yêu cầu (`state = requested`).
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
