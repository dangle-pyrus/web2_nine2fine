        '500': { $ref: '#/components/responses/Unavailable' }
    patch:
      tags: [account]
      operationId: updateAccountProfile
      x-status: locked
      summary: Sửa ngày sinh / số điện thoại (BR-ACC-04)
      description: 'Chỉ nhận `birthDate`, `phone` (null = xoá). Trường khác bị bỏ qua; không có trường nào hợp lệ -> `422 validation`. `birthDate` sai -> `422 validation` (`field: birthDate`); chưa đủ 13 tuổi -> `422 underage`. `phone` theo BR-CHK-04 (chuẩn hoá `+84` -> `0`).'
      security:
        - storefrontSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountProfileUpdate' }
      responses:
        '200':
          description: Hồ sơ sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /account/password:
    put:
      tags: [account]
      operationId: setAccountPassword
      x-status: locked
      summary: Tạo hoặc đổi mật khẩu (BR-ACC-05..08)
      description: 'Chưa có mật khẩu: `currentPassword` null / không gửi (tạo). Đã có: `currentPassword` bắt buộc; sai -> `422 invalid-password` (`field: currentPassword`); 5 lần sai liên tiếp (cách nhau <= 15 phút) -> khoá 15 phút `429 password-locked`. `newPassword` theo BR-AUTH-20, không trùng email, khác mật khẩu hiện tại -> nếu không `422 validation` (`field: newPassword`). Thành công: `204`, mọi phiên khác của tài khoản (storefront và admin) bị thu hồi, phiên hiện tại giữ; thư "mật khẩu đã thay đổi" gửi nền.'
      security:
        - storefrontSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPasswordRequest' }
      responses:
        '204':
          description: Đã lưu mật khẩu.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /account/addresses:
    get:
      tags: [account]
      operationId: listAccountAddresses
      x-status: locked
      summary: Sổ địa chỉ (BR-ACC-13)
      description: Mặc định trước, còn lại mới tạo trước. Tối đa 10.
      security:
        - storefrontSession: []
      responses:
        '200':
          description: Danh sách địa chỉ.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [account]
      operationId: createAccountAddress
      x-status: locked
      summary: Thêm địa chỉ (BR-ACC-09..11)
      description: 'Địa chỉ đầu tiên luôn mặc định. `isDefault: true` -> địa chỉ này mặc định, cái cũ bỏ cờ. Đã có 10 -> `422 validation` (`field: addresses`). Phường không thuộc tỉnh / mã lạ -> `422 invalid-address`.'
      security:
        - storefrontSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Địa chỉ mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /account/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [account]
      operationId: updateAccountAddress
      x-status: locked
      summary: Sửa địa chỉ (BR-ACC-09, 11)
      description: 'Thay toàn bộ. `isDefault: false` trên địa chỉ đang mặc định bị bỏ qua (vẫn mặc định). Địa chỉ không phải của người gọi / không tồn tại / id sai dạng -> `404 not-found`.'
      security:
        - storefrontSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Địa chỉ sau khi sửa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [account]
      operationId: deleteAccountAddress
      x-status: locked
      summary: Xoá địa chỉ (BR-ACC-11, 12)
      description: 'Xoá vĩnh viễn. Xoá địa chỉ mặc định -> địa chỉ tạo gần nhất còn lại thành mặc định. Đơn đã đặt không đổi.'
      security:
        - storefrontSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Đã xoá.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /account/addresses/{addressId}/default:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    post:
      tags: [account]
      operationId: setDefaultAccountAddress
      x-status: locked
      summary: Đặt làm mặc định (BR-ACC-11)
      description: 'Body rỗng `{}`. Trả cả sổ địa chỉ (thứ tự BR-ACC-13).'
      security:
        - storefrontSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Sổ địa chỉ mới.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OriginNotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /account/membership:
    get:
      tags: [account]
      operationId: getAccountMembership
      x-status: locked
      summary: Hạng thành viên (BR-ACC-15, Should)
      description: 'Chi tiêu = tổng `total` đơn `completed` của thành viên, thời điểm giao (`deliveredAt`, thiếu thì thời điểm đặt) trong năm dương lịch hiện tại theo giờ VN. Ngưỡng: silver 18.000.000, gold 40.000.000 (`ASSUMPTIONS`).'
      security:
        - storefrontSession: []
      responses:
        '200':
          description: Hạng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
  /account/vouchers:
    get:
      tags: [account]
      operationId: listAccountVouchers
      x-status: locked
      summary: Ưu đãi dùng được (BR-ACC-16, Should)
      description: 'Mã đang bật, trong thời gian, còn lượt chung và lượt riêng của người gọi; `firstOrderOnly` chỉ khi người gọi chưa có đơn còn hiệu lực. Sắp hạn gần trước, không hạn sau cùng.'
      security:
        - storefrontSession: []
      responses:
        '200':
          description: Danh sách mã.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberVoucher' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    storefrontSession:
      type: apiKey
      in: cookie
      name: n2f_sid
      description: Token phiên mờ, HttpOnly, SameSite=Lax, Path=/api.
    adminSession:
      type: apiKey
      in: cookie
      name: n2f_asid
      description: Token phiên admin mờ, HttpOnly, SameSite=Lax, Path=/api/admin.
    orderAccess:
      type: apiKey
      in: cookie
      name: n2f_oa
      description: 'Quyền xem / huỷ đúng 1 đơn khách trong 30 phút sau khi nhập đúng OTP (`POST /orders/lookup/verify`). HttpOnly, SameSite=Lax, Path=/api/orders. Slice 3.'
  parameters:
    AddressId:
      name: addressId
      in: path
      required: true
      description: UUID của địa chỉ; sai dạng -> `404 not-found`.
      schema: { type: string }
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, const: n2f }
      description: Bắt buộc ở mọi yêu cầu ghi (lớp CSRF 3). Thiếu -> `403 origin-not-allowed`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
      description: 'Khoá một lần thao tác (BR-CHK-15), sinh một lần cho mỗi lượt checkout và dùng lại khi Thử lại. Hiệu lực 24 giờ. Thiếu / sai dạng -> `422 validation`, `field: Idempotency-Key`.'
    AdminOrderCode:
      name: orderCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrderCodeInput' }
      description: 'Slice 4. Mã đơn, chữ thường và `#` được chấp nhận; sai dạng hoặc không có -> `404 not-found`.'
    AdminIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
      description: 'Slice 4. Tuỳ chọn. FE sinh một khoá cho mỗi ý định bấm nút (dùng lại khi "Thử lại" cùng thao tác). Cùng khoá + cùng người + cùng đường dẫn + cùng body trong 24 giờ -> `200` kết quả lần đầu (`Idempotency-Replayed: true`); khác nội dung -> `409 idempotency-conflict`. Sai dạng -> `422 validation`, `field: Idempotency-Key`.'
  headers:
    RetryAfter:
      description: Số giây chờ, bằng `error.retryAfterSeconds`.
      schema: { type: integer, minimum: 1 }
    SetCookieSession:
      description: '`n2f_sid=<token>; HttpOnly; SameSite=Lax; Path=/api; Max-Age=<s>[; Secure]`'
      schema: { type: string }
    SetCookieAdminSession:
      description: '`n2f_asid=<token>; HttpOnly; SameSite=Lax; Path=/api/admin; Max-Age=<s>[; Secure]`'
      schema: { type: string }
    SetCookieCleared:
      description: Cookie phiên tương ứng bị xoá (`Max-Age=0`).
      schema: { type: string }
  responses:
    SessionCreated:
      description: Đăng nhập thành công, hồ sơ công khai + cookie (AC-AUTH-40, 61).
      headers:
        Set-Cookie: { $ref: '#/components/headers/SetCookieSession' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthUser' }
    Validation:
      description: '`validation`, kèm `field` khi gắn được vào một trường (AC-AUTH-02).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    OriginNotAllowed:
      description: '`origin-not-allowed`: thiếu / sai `Origin` hoặc thiếu `X-Requested-With` (AC-AUTH-92).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: '`rate-limited` (AC-AUTH-05, 06).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`not-found`: tài nguyên hoặc đường dẫn không tồn tại. Cũng là phản hồi của mọi route `/api/**` không khai báo (thay cho `validation` cũ).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: '`unavailable`: lỗi máy chủ; không có stack trace, SQL, tên bảng (AC-AUTH-93, 94).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: '`unauthenticated`: không có phiên / quyền xem đơn hợp lệ, hoặc phiên đã hết hạn / bị thu hồi (AC-CHK-33). FE chuyển `/auth/login?returnUrl=...` và giữ giỏ.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    StockChanged:
      description: '`stock-changed`: thiếu hàng hoặc ngừng bán; kèm `stockIssues` cho **mọi** dòng thiếu (BR-CHK-13).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyConflict:
      description: '`idempotency-conflict`: cùng `Idempotency-Key` nhưng nội dung khác trong 24 giờ (AC-CHK-18).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotCancellable:
      description: '`not-cancellable`: đơn không ở trạng thái huỷ được hoặc đã huỷ (AC-CHK-16, 29).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CartMutated:
      description: Giỏ sau thao tác (và ghi chú nếu số lượng bị cắt / gộp).
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json:
          schema:
            type: object
            required: [cart, notice]
            additionalProperties: false
            properties:
              cart: { $ref: '#/components/schemas/CartView' }
              notice: { oneOf: [{ $ref: '#/components/schemas/CartNotice' }, { type: 'null' }] }
    AdminOrderUpdated:
      description: 'Slice 4. Đơn sau thao tác (dạng admin). Gửi lại cùng `Idempotency-Key` + cùng nội dung: cùng kết quả đầu tiên, header `Idempotency-Replayed: true`, không tác dụng phụ.'
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Idempotency-Replayed: { schema: { type: string, const: 'true' }, description: 'Chỉ có khi là bản phát lại.' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminOrder' }
    AdminForbidden:
      description: '`forbidden` (phiên admin hợp lệ nhưng thiếu quyền, ví dụ staff huỷ `other`; đơn không đổi, không sự kiện) hoặc `origin-not-allowed` (thiếu / sai `Origin` hoặc `X-Requested-With`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AdminConflict:
      description: |
        Slice 4. Một trong (mọi trường hợp: không đổi dữ liệu, không sự kiện, không email; luôn kèm `currentStatus`):
        - `order-state-changed`: `expectedStatus` khác trạng thái hiện tại; kèm `order` (đơn hiện tại). FE tải lại, báo "Đơn vừa được cập nhật bởi người khác." (BR-ADM-14, 15).
        - `invalid-transition`: bước không hợp lệ ở trạng thái / điều kiện hiện tại (BR-ADM-13), kể cả thao tác lần hai (đã xác nhận, đã xử lý hàng hoàn, đã bàn giao...).
        - `condition-not-met`: đúng trạng thái nhưng thiếu điều kiện (bàn giao đơn cần gọi chưa xác nhận; huỷ `unreachable` chưa có 3 lần gọi liên tiếp trong 24 giờ 00 phút, ví dụ lần cuối cách lần đầu 24 giờ 01 phút).
        - `idempotency-conflict`: cùng `Idempotency-Key` nhưng nội dung khác.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Email:
      type: string
      minLength: 6
      maxLength: 254
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      description: Server trim + lowercase rồi mới kiểm; giữ dấu chấm và phần `+` (BR-AUTH-01).
      examples: ['minh@example.com']
    Code:
      type: string
      pattern: '^[0-9]{8}$'
      description: 8 chữ số, có thể bắt đầu bằng 0. Server bỏ khoảng trắng và `-` trước khi kiểm. Chỉ so băm HMAC (BR-AUTH-04).
      examples: ['04817392']
    CodePurpose:
      type: string
      enum: [login, register, reset-password]
    PersonName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: "^[\\p{L}\\p{M}][\\p{L}\\p{M} '-]*$"
      description: Sau trim + gộp khoảng trắng + NFC. Chữ cái (kể cả có dấu), khoảng trắng, `'`, `-` (BR-AUTH-10). Regex Unicode (cờ `u`).
    NewPassword:
      type: string
      minLength: 8
      maxLength: 64
      pattern: '^(?=.*[A-Z])(?=.*[0-9]).+$'
      description: BR-AUTH-20. Không bỏ khoảng trắng; ngoài regex, server kiểm không trùng email (không phân biệt hoa thường). Không bao giờ trả lại trong phản hồi.
    Role:
      type: string
      enum: [member, staff, admin]
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, role]
      additionalProperties: false
      description: Hồ sơ công khai (BR-AUTH-25). Không có hash, trạng thái, hasPassword.
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string, description: Tên gọi }
        lastName: { type: string, description: Họ và tên đệm }
        role: { $ref: '#/components/schemas/Role' }
    ErrorCode:
      type: string
      description: |
        Mã lỗi ổn định (BR-AUTH-36). Map HTTP / AC:
        | code | HTTP | AC |
        | validation | 422 | AC-AUTH-02, 27, 28, 32, 33, 51, 51b, 52(FE), 53 |
        | underage | 422 | AC-AUTH-32b |
        | invalid-code | 422 | AC-AUTH-09..12, 17, 19, 21, 38, 59 |
        | code-locked | 429 | AC-AUTH-20, 21, 22 |
        | rate-limited | 429 | AC-AUTH-05, 06, 15, 16, 48 |
        | password-locked | 429 | AC-AUTH-44, 47, 58 |
        | invalid-credentials | 401 | AC-AUTH-42, 43, 49 |
        | account-disabled | 403 | AC-AUTH-26, 50 |
        | email-registered | 409 | AC-AUTH-37 |
        | unauthenticated | 401 | AC-AUTH-64, 68, 75, 88 |
        | forbidden | 403 | AC-AUTH-84, 85, 88 |
        | origin-not-allowed | 403 | AC-AUTH-92 |
        | not-found | 404 | AC-CAT-03, 26, 27, 32, 46 (route lạ, sản phẩm / bảng size không có) |
        | invalid-address | 422 | AC-CHK-06 |
        | stock-changed | 409 | AC-CHK-13, 15 (kèm `stockIssues`) |
        | price-changed | 409 | AC-CHK-12 (kèm `quote`) |
        | voucher-changed | 409 | AC-VOU-12, 13 (kèm `quote`, `removedVoucherCodes`) |
        | idempotency-conflict | 409 | AC-CHK-18 |
        | possible-duplicate | 409 | AC-CHK-20 (Should, kèm `existingOrderCode`) |
        | not-cancellable | 409 | AC-CHK-16, 29; AC-ADM-27, 36, 37, 39 (Slice 4, phía khách) |
        | invalid-transition | 409 | AC-ADM-13, 16, 18, 19, 22..24, 26, 27, 33, 34, 38, 40, 50 (Slice 4; kèm `currentStatus`) |
        | order-state-changed | 409 | AC-ADM-14..17, 40 (Slice 4; kèm `order`, `currentStatus`) |
        | condition-not-met | 409 | AC-ADM-20, 24 (Slice 4) |
        | invalid-password | 422 | AC-ACC-11 (Slice 5; `field: currentPassword`) |
        | unavailable | 500 | AC-AUTH-93, 94 |
      enum:
        - validation
        - underage
        - invalid-code
        - code-locked
        - rate-limited
        - password-locked
        - invalid-credentials
        - account-disabled
        - email-registered
        - unauthenticated
        - forbidden
        - origin-not-allowed
        - not-found
        - invalid-address
        - stock-changed
        - price-changed
        - voucher-changed
        - idempotency-conflict
        - possible-duplicate
        - not-cancellable
        - invalid-transition
        - order-state-changed
        - condition-not-met
        - invalid-password
        - unavailable
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Câu tiếng Việt hiển thị thẳng (thông điệp theo PRD BR-AUTH-08, 17, 18, 19). Không chứa dữ liệu nhạy cảm; FE có thể dùng bản của mình theo `code`.
            retryAfterSeconds:
              type: integer
              minimum: 1
              description: Có khi `code` in (`rate-limited`, `code-locked`, `password-locked`).
            field:
              type: string
              description: Tên trường trong body (`email`, `code`, `firstName`, `lastName`, `birthDate`, `acceptedTerms`, `newPassword`) khi `code` in (`validation`, `underage`). Catalog (tên tham số query, gồm `sort`, `maxPrice`, `available`, `page`, `limit`, `q`, `ids`) (`sort`, `gender`, `page`, `pageSize`, `ids`, ...).
            quote:
              description: 'Slice 3: báo giá mới nhất, có ở `price-changed`, `voucher-changed`, `stock-changed` (đặt hàng).'
              $ref: '#/components/schemas/Quote'
            stockIssues:
              type: array
              description: 'Slice 3, `stock-changed`: mọi dòng thiếu. `available` = còn lại (0 = hết hàng hoặc ngừng bán).'
              items:
                type: object
                required: [variantId, available]
                additionalProperties: false
                properties:
                  variantId: { type: string, format: uuid }
                  available: { type: integer, minimum: 0 }
            removedVoucherCodes:
              type: array
              description: 'Slice 3, `voucher-changed`: các mã bị gỡ.'
              items: { type: string }
            existingOrderCode:
              description: 'Slice 3, `possible-duplicate`: mã đơn trước đó.'
              $ref: '#/components/schemas/OrderCode'
            currentStatus:
              description: 'Slice 4: trạng thái hiện tại của đơn, có ở `invalid-transition`, `order-state-changed`, `condition-not-met` (BR-ADM-13).'
              $ref: '#/components/schemas/OrderStatus'
            order:
              description: 'Slice 4: đơn hiện tại (dạng admin), luôn có ở `order-state-changed` để FE vẽ lại không gọi thêm (BR-ADM-14).'
              $ref: '#/components/schemas/AdminOrder'
    Category:
      type: string
      enum: [tops, bottoms, dresses, outerwear]
      description: Slug danh mục (khớp `Category` của FE).
    Moment:
      type: string
      enum: [work, dinner, event, weekend]
    Gender:
      type: string
      enum: [nam, nu]
      description: Sản phẩm unisex có cả hai giá trị.
    SortOrder:
      type: string
      enum: [featured, newest, price-asc, price-desc, bestselling]
      default: featured
    StockStatus:
      type: string
      enum: [OUT_OF_STOCK, LOW_STOCK, IN_STOCK]
      description: 'Suy từ `inventory` (BR-CAT-04): 0 -> OUT_OF_STOCK; 1..5 -> LOW_STOCK; >= 6 -> IN_STOCK.'
    Color:
      type: object
      required: [name, hex]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 50, examples: ['Đen'] }
        hex: { type: string, pattern: '^#[0-9a-fA-F]{6}$', examples: ['#242323'] }
    ProductVariant:
      type: object
      required: [id, sku, size, color, inventory, stockStatus]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: 'Ổn định qua các lần seed. Đổi từ dạng `01-0-S` của mock.' }
        sku: { type: string, maxLength: 64, examples: ['N2F-01-0-S'] }
        size: { type: string, enum: [S, M, L, XL] }
        color: { $ref: '#/components/schemas/Color' }
        inventory: { type: integer, minimum: 0, description: 'Tồn kho hiển thị, không phải giữ hàng (BR-CAT-11).' }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
    ProductFit:
      type: object
      required: [summary, model]
      additionalProperties: false
      properties:
        summary: { type: string }
        model: { type: string }
    StylingLook:
      type: object
      required: [time, moment, tip]
      additionalProperties: false
      properties:
        time: { type: string, examples: ['09:00'] }
        moment: { type: string, examples: ['At work'] }
        tip: { type: string }
    Product:
      type: object
      description: 'Khớp interface `Product` của FE (`frontend/src/app/features/catalog/models/product.ts`) trừ `id`, `variants[].id` (UUID) và `variants[].stockStatus` (mới). Không có `rating` (FE vốn để tuỳ chọn). Chuỗi / mảng nội dung thiếu là `""` / `[]`, không bao giờ `null` (BR-CAT-10); trường tuỳ chọn (`compareAtPrice`, `badge`, `colorMedia`) bị bỏ khi không có.'
      required: [id, slug, name, type, category, moments, genders, price, mediaId, gallery, variants, description, material, care, fit, looks, createdAt, salesRank]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, minLength: 1, maxLength: 120, description: 'Dòng loại dưới tên, ví dụ "Áo blazer · Dáng suông".' }
        category: { $ref: '#/components/schemas/Category' }
        moments: { type: array, items: { $ref: '#/components/schemas/Moment' }, minItems: 1 }
        genders: { type: array, items: { $ref: '#/components/schemas/Gender' }, minItems: 1 }
        price: { type: integer, minimum: 10000, maximum: 50000000, description: VND }
        compareAtPrice: { type: integer, description: 'Chỉ có khi > `price`.' }
        mediaId: { type: string, maxLength: 100, description: Ảnh bìa (khoá media manifest). }
        gallery: { type: array, items: { type: string }, minItems: 1 }
        colorMedia:
          type: object
          additionalProperties: { type: string }
          description: Ảnh bìa theo tên màu.
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' }, minItems: 1, description: 'Sắp theo màu (thứ tự seed) rồi S, M, L, XL.' }
        badge: { type: string, maxLength: 20 }
        description: { type: string }
        material: { type: string }
        care: { type: array, items: { type: string } }
        fit: { $ref: '#/components/schemas/ProductFit' }
        looks: { type: array, items: { $ref: '#/components/schemas/StylingLook' } }
        createdAt: { type: string, format: date, description: 'Ngày ISO `YYYY-MM-DD`, giữ như FE hiện có (C13).' }
        salesRank: { type: integer, minimum: 1, description: '1 = bán chạy nhất. Số lưu sẵn ở Slice 2.' }
    ProductPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' }, maxItems: 48 }
        total: { type: integer, minimum: 0, description: Số sản phẩm khớp toàn bộ bộ lọc. }
        page: { type: integer, minimum: 1, description: Trang đã dùng (echo). }
        limit: { type: integer, minimum: 1, maximum: 48, description: Kích thước trang đã dùng (echo). }
    SizeChartRow:
      type: object
      required: [size, values]
      additionalProperties: false
      properties:
        size: { type: string }
        values: { type: object, additionalProperties: { type: string }, description: 'Nhãn số đo -> giá trị (cm), ví dụ "82–86".' }
    SizeChart:
      type: object
      required: [body, garment, bodyColumns, garmentColumns]
      additionalProperties: false
      properties:
        body: { type: array, items: { $ref: '#/components/schemas/SizeChartRow' } }
        garment: { type: array, items: { $ref: '#/components/schemas/SizeChartRow' } }
        bodyColumns: { type: array, items: { type: string } }
        garmentColumns: { type: array, items: { type: string } }
    Location:
      type: object
      required: [code, name]
      additionalProperties: false
      description: Tỉnh / thành hoặc phường / xã (danh mục 2 cấp sau 01/07/2025; nguồn dữ liệu ghi ở plan mục 3).
      properties:
        code: { type: string, maxLength: 10, examples: ['79'] }
        name: { type: string, maxLength: 100, examples: ['Thành phố Hồ Chí Minh'] }
    OrderCodeInput:
      type: string
      minLength: 1
      maxLength: 20
      description: 'Mã đơn do khách gõ. Server trim, bỏ `#`, chuyển chữ hoa rồi mới kiểm `^N2F[0-9]{10}$`; sai dạng ở `lookup/*` vẫn đi theo luồng "không tìm thấy" (không 422) để không phân biệt (BR-CHK-26). Ở các đường dẫn `/orders/{orderCode}` sai dạng -> `404 not-found`.'
      examples: ['n2f2611040427', '#N2F2611040427']
    OrderCode:
      type: string
      pattern: '^N2F[0-9]{10}$'
      description: 'N2F + YYMMDD (giờ Việt Nam) + 4 số ngẫu nhiên, không đổi, không tái sử dụng (BR-CHK-17).'
      examples: ['N2F2611040427']
    VnPhone:
      type: string
      pattern: '^(\+84|0)(3|5|7|8|9)[0-9]{8}$'
      description: 'Di động Việt Nam. Server trim, bỏ khoảng trắng, đổi `+84` thành `0` rồi lưu / trả `0xxxxxxxxx` (BR-CHK-04).'
      examples: ['0912345678']
    QuoteItems:
      type: array
      minItems: 1
      maxItems: 30
      description: 'Mỗi `variantId` xuất hiện tối đa một lần (trùng -> `422 validation`, `field: items`).'
      items:
        type: object
        required: [variantId, quantity]
        additionalProperties: false
        properties:
          variantId: { type: string, format: uuid }
          quantity: { type: integer, minimum: 1, maximum: 99, description: 'Quá 5 hoặc quá tồn: `quote` cắt (xem `effectiveQuantity`); `POST /orders` với quantity > 5 -> `422 validation`.' }
    VoucherCodes:
      type: array
      maxItems: 2
      items: { type: string, minLength: 1, maxLength: 40 }
      description: 'Tối đa 1 mã giảm + 1 mã free-ship (BR-VOU-01). Quá 2 phần tử -> `422 validation`, `field: voucherCodes`.'
    QuoteAddress:
      type: object
      required: [provinceCode, wardCode]
      additionalProperties: false
      properties:
        provinceCode: { type: string, maxLength: 10 }
        wardCode: { type: string, maxLength: 10 }
    QuoteContact:
      type: object
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/VnPhone' }
    PaymentMethod:
      type: string
      enum: [cod, bank-transfer]
    QuoteRequest:
      type: object
      required: [items]
      additionalProperties: false
      description: Mọi trường giá / tổng gửi kèm bị bỏ qua (trường lạ bị loại).
      properties:
        items: { $ref: '#/components/schemas/QuoteItems' }
        voucherCodes: { $ref: '#/components/schemas/VoucherCodes' }
        address: { $ref: '#/components/schemas/QuoteAddress' }
        contact: { $ref: '#/components/schemas/QuoteContact' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
    Availability:
      type: string
      enum: [available, low-stock, out-of-stock, discontinued]
      description: '`low-stock` khi tồn 1..5; `out-of-stock` khi 0; `discontinued` khi sản phẩm không `ACTIVE` hoặc biến thể không tồn tại (BR-CART-08).'
    RefreshedLine:
      type: object
      required: [variantId, productId, slug, name, mediaId, color, size, unitPrice, requestedQuantity, maxQuantity, effectiveQuantity, availability, inventory]
      additionalProperties: false
      description: Một dòng đã làm tươi từ DB. Với dòng `discontinued` chỉ `variantId`, `requestedQuantity`, `availability`, `maxQuantity = 0`, `effectiveQuantity = 0` là bảo đảm có giá trị; các trường còn lại là `""` / `0`.
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        mediaId: { type: string }
        color: { type: string }
        size: { type: string }
        unitPrice: { type: integer, minimum: 0, description: Giá hiện tại sau khuyến mãi (đã gồm VAT). }
        compareAtPrice: { type: integer }
        requestedQuantity: { type: integer, minimum: 1 }
        maxQuantity: { type: integer, minimum: 0, description: 'min(5, tồn); 0 nếu hết / ngừng bán.' }
        effectiveQuantity: { type: integer, minimum: 0, description: 'min(requestedQuantity, maxQuantity).' }
        availability: { $ref: '#/components/schemas/Availability' }
        inventory: { type: integer, minimum: 0 }
        limitedBy:
          type: string
          enum: [stock, per-variant-limit]
          description: Có khi `effectiveQuantity < requestedQuantity`; `stock` -> câu "Chỉ còn N sản phẩm cho màu, size này.", `per-variant-limit` -> câu "Mỗi đơn mua tối đa 5 sản phẩm cùng màu, size...".
    Policy:
      type: object
      required: [maxPerVariant, maxItemsPerOrder, maxCartLines, shippingFee, freeShippingThreshold, codMaxTotal, bankHoldMinutes, bankTransferEnabled, cartRetentionDays]
      additionalProperties: false
      description: Tham số vận hành đọc từ DB (bảng `store_settings`), thay `store-policy.ts` của FE ở chế độ http.
      properties:
        maxPerVariant: { type: integer, examples: [5] }
        maxItemsPerOrder: { type: integer, examples: [20] }
        maxCartLines: { type: integer, examples: [30] }
        shippingFee: { type: integer, examples: [30000] }
        freeShippingThreshold: { type: integer, examples: [1000000] }
        codMaxTotal: { type: integer, examples: [5000000] }
        bankHoldMinutes: { type: integer, examples: [30] }
        bankTransferEnabled: { type: boolean, description: '`[giả định chờ Thắng]` false cho tới khi có dịch vụ đối soát.' }
        cartRetentionDays: { type: integer, examples: [30] }
    CartView:
      type: object
      required: [lines, policy, expiresAt]
      additionalProperties: false
      properties:
        lines:
          type: array
          maxItems: 30
          description: Sắp theo `updatedAt` giảm dần (dòng mới thêm / sửa lên đầu), hoà bằng `variantId`.
          items:
            allOf:
              - $ref: '#/components/schemas/RefreshedLine'
              - type: object
                required: [updatedAt]
                properties:
                  updatedAt: { type: string, format: date-time }
        policy: { $ref: '#/components/schemas/Policy' }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'Lần sửa cuối + 30 ngày; null khi giỏ rỗng.' }
    CartNotice:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, enum: [stock-limit, per-variant-limit, merged] }
        variantId: { type: string, format: uuid }
        adjustedTo: { type: integer, minimum: 1, description: Số lượng sau khi cắt. }
    VoucherKind:
      type: string
      enum: [discount, free-shipping]
      description: '`discount` (giảm theo % hoặc số tiền) hoặc `free-shipping`. Phân loại phía FE; loại %/số tiền là chi tiết nội bộ.'
    VoucherApplied:
      type: object
      required: [applied, code, kind, label, amount]
      additionalProperties: false
      properties:
        applied: { type: boolean, const: true }
        code: { type: string, description: 'Chữ hoa chuẩn.' }
        kind: { $ref: '#/components/schemas/VoucherKind' }
        label: { type: string, description: 'Tên hiển thị, ví dụ "Giảm 15% đơn đầu tiên".' }
        amount: { type: integer, minimum: 0, description: 'Tiền giảm hàng (`discount`); 0 với `free-shipping` (giảm phí nằm ở `pricing.shippingDiscount`).' }
    VoucherReason:
      type: string
      enum: [not-found, not-started, expired, exhausted, login-required, per-user-limit, first-order-only, category-mismatch, excluded-sale-items, min-spend, shipping-already-free]
      description: |
        Thứ tự kiểm BR-VOU-03; thông điệp FE (BR-VOU-04): not-found "Mã giảm giá không tồn tại."; not-started "Mã này áp dụng từ {startsAt}."; expired (hết hạn **hoặc** bị tắt) "Mã giảm giá đã hết hạn."; exhausted "Mã giảm giá đã hết lượt sử dụng."; login-required "Đăng nhập để dùng mã này."; per-user-limit "Bạn đã dùng mã này đủ số lần cho phép."; first-order-only "Mã chỉ áp dụng cho đơn hàng đầu tiên."; category-mismatch "Mã chỉ áp dụng cho {categoryName}." (Should); excluded-sale-items "Mã không áp dụng cho sản phẩm đang giảm giá." (Should); min-spend "Mua thêm {missingAmount}₫ để dùng mã này (đơn tối thiểu {minSubtotal}₫)."; shipping-already-free "Đơn của bạn đã được miễn phí giao hàng.".
    VoucherRejection:
      type: object
      required: [applied, code, reason]
      additionalProperties: false
      properties:
        applied: { type: boolean, const: false }
        code: { type: string, description: 'Đúng mã khách gõ (đã trim, chữ hoa) để FE giữ trong ô.' }
        reason: { $ref: '#/components/schemas/VoucherReason' }
        startsAt: { type: string, format: date-time, description: 'Có khi `not-started`.' }
        missingAmount: { type: integer, description: 'Có khi `min-spend`.' }
        minSubtotal: { type: integer, description: 'Có khi `min-spend`.' }
        categoryName: { type: string, description: 'Có khi `category-mismatch`.' }
    Pricing:
      type: object
      required: [subtotal, discount, shippingFee, shippingDiscount, total]
      additionalProperties: false
      description: 'Khớp `OrderPricing` của FE. `total = subtotal - discount + shippingFee - shippingDiscount` (BR-VOU-05). Miễn phí giao (ngưỡng hoặc mã) -> `shippingDiscount = shippingFee`.'
      properties:
        subtotal: { type: integer, minimum: 0 }
        discount: { type: integer, minimum: 0 }
        shippingFee: { type: integer, minimum: 0 }
        shippingDiscount: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    PaymentOption:
      type: object
      required: [method, available]
      additionalProperties: false
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        available: { type: boolean }
        reason:
          type: string
          enum: [over-limit, too-many-refusals, too-many-open-orders, not-enabled]
          description: 'Có khi `available = false`. `over-limit` = tổng > 5.000.000 ₫; `too-many-refusals` = SĐT có từ 2 đơn COD bị từ chối trong 6 tháng; `too-many-open-orders` = đang có 3 đơn COD chưa giao; `not-enabled` = QR chưa bật.'
    Quote:
      type: object
      required: [lines, pricing, vouchers, rejectedVouchers, shipping, estimatedDelivery, paymentMethods, policy]
      additionalProperties: false
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/RefreshedLine' } }
        lineDiscounts:
          type: array
          description: 'Phần giảm chia cho từng dòng (BR-VOU-06): theo tỷ lệ giá trị, làm tròn xuống đồng, phần dư vào dòng giá trị lớn nhất (hoà: `variantId` nhỏ nhất). Chỉ các dòng có phần giảm > 0.'
          items:
            type: object
            required: [variantId, amount]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              amount: { type: integer, minimum: 1 }
        pricing: { $ref: '#/components/schemas/Pricing' }
        vouchers: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/VoucherApplied' } }
        rejectedVouchers: { type: array, items: { $ref: '#/components/schemas/VoucherRejection' } }
        shipping:
          type: object
          required: [fee, freeReason, addressRequired]
          additionalProperties: false
          properties:
            fee: { type: integer, minimum: 0, description: 'Phí tiêu chuẩn (30.000), chưa trừ miễn phí.' }
            freeReason: { type: [string, 'null'], enum: [threshold, voucher, null], description: 'Lý do miễn phí để hiện "Miễn phí (đơn từ 1.000.000₫ / mã free-ship)". Ngưỡng thắng mã (BR-VOU-03 mục 9).' }
            addressRequired: { type: boolean, description: 'true khi request chưa có `address`.' }
        estimatedDelivery:
          type: object
          required: [from, to]
          additionalProperties: false
          description: 'Giả định đơn vào `to_ship` ngay lúc báo giá (BR-CHK-11). Ngày ISO `YYYY-MM-DD`.'
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        paymentMethods: { type: array, items: { $ref: '#/components/schemas/PaymentOption' } }
        policy: { $ref: '#/components/schemas/Policy' }
    Recipient:
      type: object
      required: [name, phone, email]
      additionalProperties: false
      description: '`name`/`phone` là của người nhận, `email` là của người đặt (BR-CHK-04, 05). Server trim; `name` 2-50 ký tự, có ít nhất 1 chữ cái; `email` <= 100 ký tự, lưu chữ thường.'
      properties:
        name: { type: string, minLength: 2, maxLength: 50 }
        phone: { $ref: '#/components/schemas/VnPhone' }
        email: { $ref: '#/components/schemas/Email' }
    OrderAddress:
      type: object
      required: [provinceCode, wardCode, street]
      additionalProperties: false
      properties:
        provinceCode: { type: string, maxLength: 10 }
        wardCode: { type: string, maxLength: 10, description: 'Phải thuộc `provinceCode`, sai -> `422 invalid-address`.' }
        street: { type: string, minLength: 5, maxLength: 200 }
    Invoice:
      type: object
      required: [companyName, taxCode, address, email]
      additionalProperties: false
      description: Hoá đơn công ty (BR-CHK-07); chỉ lưu, không sửa sau khi đặt.
      properties:
        companyName: { type: string, minLength: 2, maxLength: 200 }
        taxCode: { type: string, pattern: '^[0-9]{10}(-[0-9]{3})?$' }
        address: { type: string, minLength: 5, maxLength: 200 }
        email: { $ref: '#/components/schemas/Email' }
    ExpectedTotals:
      type: object
      required: [lines, pricing]
      additionalProperties: false
      description: 'Số khách đang thấy. Chỉ để đối chiếu (BR-CHK-12): khác bất kỳ giá dòng nào hoặc bất kỳ trường `pricing` nào -> `409 price-changed`.'
      properties:
        lines:
          type: array
          items:
            type: object
            required: [variantId, unitPrice]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              unitPrice: { type: integer, minimum: 0 }
        pricing: { $ref: '#/components/schemas/Pricing' }
    PlaceOrderRequest:
      type: object
      required: [items, contact, address, paymentMethod, invoice, acceptedTerms, expected]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          description: 'Mỗi `variantId` một lần; `quantity` 1..5; tổng quantity <= 20 (vượt -> `422 validation`, `field: items`).'
          items:
            type: object
            required: [variantId, quantity]
            additionalProperties: false
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 5 }
        voucherCodes: { $ref: '#/components/schemas/VoucherCodes' }
        contact: { $ref: '#/components/schemas/Recipient' }
        address: { $ref: '#/components/schemas/OrderAddress' }
        note: { type: string, maxLength: 250, description: Ghi chú cho shipper; trim; rỗng = không có. }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        invoice: { oneOf: [{ $ref: '#/components/schemas/Invoice' }, { type: 'null' }], description: 'null = hoá đơn cá nhân.' }
        acceptedTerms: { type: boolean, description: 'Phải `true`, nếu không `422 validation` `field: acceptedTerms`; máy chủ lưu thời điểm đồng ý (BR-CHK-08).' }
        expected: { $ref: '#/components/schemas/ExpectedTotals' }
        confirmDuplicate: { type: boolean, default: false, description: 'Should (BR-CHK-16): `true` khi khách đã xác nhận đặt tiếp sau `possible-duplicate`.' }
    OrderStatus:
      type: string
      enum: [to_pay, to_ship, to_receive, completed, cancel_requested, cancelled]
      description: 'Tên COMMON-01 `[giả định chờ Thắng]`. Ánh xạ FE: to_pay -> pending-payment; to_ship -> processing; to_receive -> shipping / delivering; completed -> completed; cancel_requested -> (FE thêm); cancelled -> cancelled.'
    PaymentStatus:
      type: string
      enum: [pending, paid, failed, refunded, partially_refunded]
    CancelledBy:
      type: string
      enum: [customer, shop, system]
    OrderLine:
      type: object
      required: [variantId, productSlug, name, color, size, sku, quantity, unitPrice, mediaId, lineDiscount]
      additionalProperties: false
      description: Bản chụp tại lúc đặt; đổi giá / tên sau đó không ảnh hưởng (BR-CHK-18).
      properties:
        variantId: { type: string, format: uuid }
        productSlug: { type: string }
        name: { type: string }
        color: { type: string }
        size: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 5 }
        unitPrice: { type: integer, minimum: 0 }
        compareAtPrice: { type: integer }
        mediaId: { type: string }
        lineDiscount: { type: integer, minimum: 0, description: 'Phần giảm voucher đã chia cho dòng này (BR-VOU-06).' }
    OrderTimelineEntry:
      type: object
      required: [at, title]
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
        title: { type: string }
        detail: { type: string, description: 'Slice 4: lý do đã được làm sạch cho khách (câu chuẩn hoặc lý do do chính khách nhập); đơn `to_receive` kèm đơn vị + mã vận đơn.' }
        actor: { type: string, enum: [customer, nine2fine], description: 'Slice 4. Người thực hiện: `customer` hiện "Khách", `nine2fine` cho nhân viên và hệ thống (không lộ tên nhân viên, BR-ADM-12). Dòng cũ (Slice 3) cũng được điền theo `actor` của sự kiện.' }
    Order:
      type: object
      required: [id, placedAt, status, paymentStatus, paymentMethod, items, pricing, vouchers, recipient, shippingAddress, estimatedDelivery, canCancel, timeline]
      additionalProperties: false
      description: 'Chi tiết đơn. Không có `userId`, UUID nội bộ hay dữ liệu thanh toán nhạy cảm. Nhất quán: `pricing` ở đây, ở email, ở trang thành công là cùng một bộ số.'
      properties:
        id: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentDueAt: { type: string, format: date-time, description: 'Chỉ khi `to_pay`.' }
        paidAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        pricing: { $ref: '#/components/schemas/Pricing' }
        vouchers:
          type: array
          items:
            type: object
            required: [code, kind, amount]
            additionalProperties: false
            properties:
              code: { type: string }
              kind: { $ref: '#/components/schemas/VoucherKind' }
              amount: { type: integer, minimum: 0 }
        recipient:
          type: object
          required: [name, phone, email]
          additionalProperties: false
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
        shippingAddress:
          type: object
          required: [street, ward, province]
          additionalProperties: false
          description: 'Tên tỉnh / phường chụp tại lúc đặt.'
          properties:
            street: { type: string }
            ward: { type: string }
            province: { type: string }
        note: { type: string }
        invoice: { $ref: '#/components/schemas/Invoice' }
        estimatedDelivery:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        cancelledBy: { $ref: '#/components/schemas/CancelledBy' }
        cancelledAt: { type: string, format: date-time }
        cancelReason: { type: string }
        canCancel: { type: boolean, description: 'true khi `status = to_pay`, hoặc `status = to_ship` và chưa từng gửi yêu cầu huỷ (Slice 4: ở `to_ship` là "gửi yêu cầu huỷ", xem `cancelMode`).' }
        cancelMode:
          type: string
          enum: [cancel, request]
          description: 'Slice 4. Có khi `canCancel = true`: `cancel` = huỷ ngay (`to_pay`); `request` = gửi yêu cầu huỷ chờ shop duyệt (`to_ship`, S4-Q1). FE đổi chữ nút theo trường này.'
        cancelRequest:
          type: object
          required: [requestedAt, outcome]
          additionalProperties: false
          description: 'Slice 4. Có khi khách đã gửi yêu cầu huỷ (đang chờ, hoặc đã bị từ chối). Yêu cầu được duyệt thì đơn `cancelled`. Khi `outcome = rejected` khách không gửi lại được (S4-Q6): FE hướng dẫn gọi hotline.'
          properties:
            requestedAt: { type: string, format: date-time }
            outcome: { type: string, enum: [pending, rejected, approved] }
            rejectReason: { type: string, description: 'Lý do shop từ chối (cũng có trong email); chỉ khi `outcome = rejected`.' }
        shipment:
          type: object
          required: [carrier, trackingNumber, handedOverAt]
          additionalProperties: false
          description: 'Slice 4. Có từ khi bàn giao vận chuyển (`to_receive`, `completed`, và `cancelled` từ `to_receive`). Không có tên nhân viên.'
          properties:
            carrier: { type: string }
            trackingNumber: { type: string }
            handedOverAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, description: 'Slice 4. Thời điểm giao xong / thu tiền; chỉ khi `completed`.' }
        willCallToConfirm: { type: boolean, description: 'COD cần CSKH gọi xác nhận trong 2 giờ làm việc (BR-CHK-20): false với thành viên đã có đơn `completed` và đơn < 1.000.000 ₫. Chỉ có ở đơn COD `to_ship`.' }
        timeline: { type: array, items: { $ref: '#/components/schemas/OrderTimelineEntry' }, description: 'Cũ nhất trước (khác timeline admin là mới nhất trước, chủ ý); mỗi lần đổi trạng thái một dòng (BR-CHK-22). Slice 4: chỉ các lần đổi trạng thái (không có lần gọi, xác nhận, ghi chú, hàng hoàn), người = `nine2fine` hoặc `customer` (BR-ADM-12).' }
    OrderReceipt:
      type: object
      required: [order]
      additionalProperties: false
      properties:
        order: { $ref: '#/components/schemas/Order' }
    OrderPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' }, maxItems: 50 }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
    PaymentSession:
      type: object
      required: [orderId, amount, status, expiresAt, transferContent, account, qrImageUrl]
      additionalProperties: false
      description: '`[giả định chờ Thắng]` cần dịch vụ đối soát. `paidAt` có khi `status = paid`.'
      properties:
        orderId: { $ref: '#/components/schemas/OrderCode' }
        amount: { type: integer, minimum: 1, description: Số tiền chính xác phải chuyển (= `pricing.total`). }
        status: { type: string, enum: [awaiting, paid, expired] }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        transferContent: { type: string, description: 'Nội dung chuyển khoản = mã đơn.' }
        account:
          type: object
          required: [bank, accountName, accountNumber]
          additionalProperties: false
          properties:
            bank: { type: string }
            accountName: { type: string }
            accountNumber: { type: string }
        qrImageUrl: { type: string, description: 'URL ảnh VietQR đã nhúng số tiền và nội dung.' }
        shortfall: { type: integer, minimum: 1, description: 'Số còn thiếu khi đã chuyển thiếu (CHK-PAY-10).' }
    AdminOrderTab:
      type: string
      enum: [all, pending-payment, to-confirm, to-fulfil, in-transit, cancel-requests, returning, completed, cancelled]
      description: 'Slice 4, BR-ADM-07. Mỗi đơn thuộc đúng một tab trừ `all`. FE ánh xạ sang nhãn "Chờ xác nhận" (`to-confirm`), "Đang chuẩn bị" (`to-fulfil`), "Đang vận chuyển" (`in-transit`), "Chờ duyệt huỷ" (`cancel-requests`)...'
    AdminOrderBucket:
      type: string
      enum: [pending-payment, to-confirm, to-fulfil, in-transit, cancel-requests, returning, completed, cancelled]
      description: 'Tab mà đơn thuộc về (`AdminOrderTab` bỏ `all`).'
    AdminOrderCounts:
      type: object
      required: [all, pending-payment, to-confirm, to-fulfil, in-transit, cancel-requests, returning, completed, cancelled]
      additionalProperties: false
      description: 'Slice 4. `all` = tổng 8 tab con.'
      properties:
        all: { type: integer, minimum: 0 }
        pending-payment: { type: integer, minimum: 0 }
        to-confirm: { type: integer, minimum: 0 }
        to-fulfil: { type: integer, minimum: 0 }
        in-transit: { type: integer, minimum: 0 }
        cancel-requests: { type: integer, minimum: 0 }
        returning: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    AdminOverdueFlag:
      type: string
      enum: [confirm-call, cancel-request, delivery]
      description: 'Should (BR-ADM-40; S4-Q3). `confirm-call`: cần gọi quá 2 giờ làm việc kể từ lúc đặt (08:00-18:00, thứ Hai-thứ Bảy); `cancel-request`: `cancel_requested` quá 24 giờ chưa quyết định; `delivery`: `to_receive` quá ngày giao dự kiến muộn nhất. Chỉ là cờ, không tự đổi trạng thái.'
    AdminOrderAction:
      type: string
      enum:
        - call-attempt
        - confirm
        - ship
        - deliver
        - cancel-unreachable
        - cancel-declined-on-call
        - cancel-customer-request
        - cancel-refused
        - cancel-undeliverable
        - cancel-other
        - restock
        - write-off
        - approve-cancel
        - reject-cancel
        - add-note
        - print-slip
      description: |
        Hành động hợp lệ ngay lúc này cho **đúng người đang gọi** (vai trò + trạng thái + điều kiện), BR-ADM-04. Ánh xạ: `call-attempt` -> `POST .../call-attempts`; `confirm` -> `.../confirm`; `ship` -> `.../ship`; `deliver` -> `.../deliver`; `cancel-<reason>` -> `.../cancel` với `reason` tương ứng (`cancel-declined-on-call` = `declined_on_call`, `cancel-customer-request` = `customer_request`); `restock`, `write-off` -> `.../returned-stock` (`decision` `restocked` / `written_off`); `approve-cancel`, `reject-cancel` -> `.../cancel-request/*`; `add-note` -> `.../notes`. `print-slip` (Should, BR-ADM-39) không có endpoint: FE in từ dữ liệu đơn (`to_ship` / `to_receive`).
        Chính xác theo điều kiện: `ship` chỉ có khi đơn không cần gọi hoặc đã xác nhận; `cancel-unreachable` chỉ có khi có 3 lần gọi liên tiếp trong một cửa sổ 24 giờ 00 phút; `cancel-customer-request` có ở mọi đơn `to_ship` cho staff và admin; `cancel-other` chỉ có với admin.
    StaffRef:
      type: object
      required: [name, role]
      additionalProperties: false
      description: 'Nhân viên thực hiện (tên và vai trò chụp tại lúc làm). Không có mã người dùng.'
      properties:
        name: { type: string }
        role: { type: string, enum: [staff, admin] }
    AdminActor:
      type: object
      required: [type]
      additionalProperties: false
      description: 'Người thực hiện sự kiện. `staff` luôn có `name` + `role`; `customer` hiện "Khách"; `system` hiện "Hệ thống" (hết hạn thanh toán). Sự kiện Slice 3 sẵn có chỉ là `customer` / `system` (K11).'
      properties:
        type: { type: string, enum: [customer, system, staff] }
        name: { type: string }
        role: { type: string, enum: [staff, admin] }
    AdminEventKind:
      type: string
      enum: [placed, payment_received, call_attempt, confirmed, shipped, delivered, cancel_requested, cancel_approved, cancel_rejected, cancelled, stock_restocked, stock_written_off, note]
    AdminTimelineEntry:
      type: object
      required: [at, kind, toStatus, paymentStatus, actor, title]
      additionalProperties: false
      description: 'Một sự kiện đơn (BR-ADM-10). Mỗi thao tác thành công đúng 1 dòng, kể cả thao tác không đổi trạng thái (`fromStatus = toStatus`). Chỉ thêm, không sửa / xoá được. `AdminOrder.timeline` sắp **mới nhất trước** (khác `Order.timeline` của khách: cũ nhất trước; chủ ý).'
      properties:
        at: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/AdminEventKind' }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/OrderStatus' }, { type: 'null' }], description: 'null ở sự kiện đặt hàng.' }
        toStatus: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        actor: { $ref: '#/components/schemas/AdminActor' }
        title: { type: string, description: 'Tiêu đề tiếng Việt, ví dụ "Ghi nhận không liên lạc được", "Bàn giao vận chuyển".' }
        detail: { type: string, description: 'Phần khách cũng thấy (câu chuẩn lý do huỷ, lý do khách nhập, đơn vị + mã vận đơn, lý do từ chối yêu cầu huỷ).' }
        reasonCode: { type: string, description: 'Mã lý do huỷ (`unreachable`, `declined_on_call`, `customer_request`, `refused`, `undeliverable`, `other`) hoặc quyết định hàng hoàn (`restocked`, `written_off`).' }
        note: { type: string, description: 'Ghi chú nội bộ (tối đa 500 ký tự). Không bao giờ có ở API khách.' }
    AdminOrderSummary:
      type: object
      required: [id, placedAt, status, paymentStatus, paymentMethod, recipientName, total, itemCount, needsCall, hasCancelRequest, tab, overdue]
      additionalProperties: false
      description: 'Dòng của danh sách (BR-ADM-05).'
      properties:
        id: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        recipientName: { type: string }
        total: { type: integer, minimum: 0 }
        itemCount: { type: integer, minimum: 1, description: 'Tổng số lượng sản phẩm.' }
        needsCall: { type: boolean, description: 'Cờ "cần gọi": COD `to_ship`, cần xác nhận, chưa xác nhận.' }
        hasCancelRequest: { type: boolean, description: 'Cờ "có yêu cầu huỷ": `status = cancel_requested`.' }
        tab: { $ref: '#/components/schemas/AdminOrderBucket' }
        overdue: { type: array, items: { $ref: '#/components/schemas/AdminOverdueFlag' }, description: 'Should (BR-ADM-40). Rỗng nếu trong hạn.' }
    AdminOrderPage:
      type: object
      required: [items, total, page, limit]
      additionalProperties: false
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminOrderSummary' }, maxItems: 50 }
        total: { type: integer, minimum: 0, description: 'Tổng số đơn khớp bộ lọc (mọi trang).' }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 50 }
    AdminOrder:
      type: object
      required: [id, placedAt, status, paymentStatus, paymentMethod, items, pricing, vouchers, recipient, shippingAddress, estimatedDelivery, tab, needsCall, callAttempts, overdue, allowedActions, timeline]
      additionalProperties: false
      description: 'Chi tiết đơn cho staff / admin (BR-ADM-09). Không có UUID nội bộ hay mã người dùng. SĐT và email đầy đủ.'
      properties:
        id: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentDueAt: { type: string, format: date-time, description: 'Chỉ khi `to_pay`.' }
        paidAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, description: 'Chỉ khi `completed`.' }
        items: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        pricing: { $ref: '#/components/schemas/Pricing' }
        vouchers:
          type: array
          items:
            type: object
            required: [code, kind, amount]
            additionalProperties: false
            properties:
              code: { type: string }
              kind: { $ref: '#/components/schemas/VoucherKind' }
              amount: { type: integer, minimum: 0 }
        recipient:
          type: object
          required: [name, phone, email]
          additionalProperties: false
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
        shippingAddress:
          type: object
          required: [street, ward, province]
          additionalProperties: false
          properties:
            street: { type: string }
            ward: { type: string }
            province: { type: string }
        note: { type: string, description: 'Ghi chú giao hàng của khách.' }
        invoice: { $ref: '#/components/schemas/Invoice' }
        estimatedDelivery:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        tab: { $ref: '#/components/schemas/AdminOrderBucket' }
        needsCall: { type: boolean, description: 'Cần gọi xác nhận (COD `to_ship`, `needsConfirmCall`, chưa xác nhận).' }
        confirmation:
          type: object
          required: [confirmedAt, confirmedBy]
          additionalProperties: false
          description: 'Có sau khi khách xác nhận (BR-ADM-17).'
          properties:
            confirmedAt: { type: string, format: date-time }
            confirmedBy: { $ref: '#/components/schemas/StaffRef' }
        callAttempts:
          type: object
          required: [total, inFirstDay]
          additionalProperties: false
          description: 'Đếm "không liên lạc được" (BR-ADM-16, 18). `inFirstDay` (tên giữ để tương thích FE) = số lần lớn nhất nằm trong một cửa sổ 24 giờ 00 phút bất kỳ (lần cuối trừ lần đầu <= 24 giờ); huỷ `unreachable` cần `inFirstDay >= 3`.'
          properties:
            total: { type: integer, minimum: 0 }
            inFirstDay: { type: integer, minimum: 0 }
            firstAt: { type: string, format: date-time }
            lastAt: { type: string, format: date-time }
        shipment:
          type: object
          required: [carrier, trackingNumber, handedOverAt, handedOverBy]
          additionalProperties: false
          properties:
            carrier: { type: string }
            trackingNumber: { type: string }
            handedOverAt: { type: string, format: date-time }
            handedOverBy: { $ref: '#/components/schemas/StaffRef' }
        cancellation:
          type: object
          required: [by, at]
          additionalProperties: false
          description: 'Chỉ khi `cancelled`.'
          properties:
            by: { $ref: '#/components/schemas/CancelledBy' }
            at: { type: string, format: date-time }
            reasonCode: { type: string, enum: [unreachable, declined_on_call, customer_request, refused, undeliverable, other], description: 'Chỉ khi huỷ qua `.../cancel`: `by = shop`, trừ `customer_request` (`by = customer`).' }
            reason: { type: string, description: 'Câu hiển thị cho khách (= `Order.cancelReason`).' }
            note: { type: string, description: 'Ghi chú nội bộ (bắt buộc với `other`).' }
        cancelRequest:
          type: object
          required: [requestedAt, outcome]
          additionalProperties: false
          description: 'Có khi khách đã gửi yêu cầu huỷ (BR-ADM-29..31).'
          properties:
            requestedAt: { type: string, format: date-time }
            reason: { type: string, description: 'Lý do khách nhập (tuỳ chọn).' }
            outcome: { type: string, enum: [pending, approved, rejected] }
            decidedAt: { type: string, format: date-time }
            decidedBy: { $ref: '#/components/schemas/StaffRef' }
            rejectReason: { type: string }
        returnHandling:
          type: object
          required: [state]
          additionalProperties: false
          description: 'Chỉ có với đơn `cancelled` từ `to_receive` (BR-ADM-26, 27; S4-Q2). `pending` = tab `returning`.'
          properties:
            state: { type: string, enum: [pending, restocked, written_off] }
            decidedAt: { type: string, format: date-time }
            decidedBy: { $ref: '#/components/schemas/StaffRef' }
            note: { type: string }
        stockRestoredAt: { type: string, format: date-time, description: 'Dấu "đã cộng lại tồn" (đúng một lần). Không có nghĩa là hết hiệu lực khi huỷ từ `to_receive` và `written_off`.' }
        deliveryRefusedAt: { type: string, format: date-time, description: 'Có khi huỷ `refused`; nguồn của giới hạn COD (BR-CHK-19).' }
        overdue: { type: array, items: { $ref: '#/components/schemas/AdminOverdueFlag' } }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AdminOrderAction' } }
        timeline: { type: array, items: { $ref: '#/components/schemas/AdminTimelineEntry' }, description: 'Mới nhất trước (BR-ADM-10).' }
    AdminExpectedStatusRequest:
      type: object
      required: [expectedStatus]
      additionalProperties: false
      properties:
        expectedStatus:
          $ref: '#/components/schemas/OrderStatus'
          description: 'Trạng thái đơn người thao tác đang thấy; khác trạng thái hiện tại -> `409 order-state-changed`. Thiếu / sai giá trị -> `422 validation`, `field: expectedStatus`.'
    AdminCallAttemptRequest:
      type: object
      required: [expectedStatus]
      additionalProperties: false
      properties:
        expectedStatus: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: string, maxLength: 250, description: 'Ghi chú nội bộ tuỳ chọn; trim; > 250 -> `422`, `field: note`.' }
    AdminShipRequest:
      type: object
      required: [expectedStatus, carrier, trackingNumber]
      additionalProperties: false
      properties:
        expectedStatus: { $ref: '#/components/schemas/OrderStatus' }
        carrier: { type: string, minLength: 2, maxLength: 50, description: 'Đơn vị vận chuyển (trim); nhập tự do (S4-Q5).', examples: ['GHTK'] }
        trackingNumber: { type: string, minLength: 4, maxLength: 40, pattern: '^[A-Za-z0-9-]+$', description: 'Server trim, lưu chữ hoa.', examples: ['ghtk-12345'] }
    AdminCancelReason:
      type: string
      enum: [unreachable, declined_on_call, customer_request, refused, undeliverable, other]
    AdminCancelRequest:
      type: object
      required: [expectedStatus, reason]
      additionalProperties: false
      properties:
        expectedStatus: { $ref: '#/components/schemas/OrderStatus' }
        reason: { $ref: '#/components/schemas/AdminCancelReason' }
        note: { type: string, maxLength: 250, description: 'Ghi chú nội bộ; bắt buộc 5-250 ký tự (sau trim) khi `reason` = `other` hoặc `customer_request`, tuỳ chọn <= 250 ở các lý do còn lại. Không bao giờ gửi cho khách.' }
    AdminReturnedStockRequest:
      type: object
      required: [expectedStatus, decision]
      additionalProperties: false
      properties:
        expectedStatus:
          $ref: '#/components/schemas/OrderStatus'
          description: 'Luôn `cancelled`.'
        decision: { type: string, enum: [restocked, written_off] }
        note: { type: string, maxLength: 250, description: 'Bắt buộc 5-250 ký tự khi `written_off`; tuỳ chọn khi `restocked`.' }
    AdminRejectCancelRequest:
      type: object
      required: [expectedStatus, reason]
      additionalProperties: false
      properties:
        expectedStatus:
          $ref: '#/components/schemas/OrderStatus'
          description: 'Luôn `cancel_requested`.'
        reason: { type: string, minLength: 5, maxLength: 250, description: 'Sau trim. Hiển thị cho khách.' }
    AdminNoteRequest:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { type: string, minLength: 1, maxLength: 500, description: 'Sau trim.' }
    AccountProfile:
      type: object
      required: [email, firstName, lastName, birthDate, phone, hasPassword]
      additionalProperties: false
      properties:
        email: { type: string }
        firstName: { type: string, description: 'Tên (vd. "Minh").' }
        lastName: { type: string, description: 'Họ và tên đệm (vd. "Nguyễn Văn"). FE hiện "Họ và tên" = lastName + " " + firstName.' }
        birthDate: { type: [string, 'null'], format: date }
        phone: { type: [string, 'null'], pattern: '^0(3|5|7|8|9)[0-9]{8}$' }
        hasPassword: { type: boolean }
    AccountProfileUpdate:
      type: object
      minProperties: 1
      properties:
        birthDate: { type: [string, 'null'], format: date }
        phone: { type: [string, 'null'] }
    AccountPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: [string, 'null'], maxLength: 128 }
        newPassword: { type: string, minLength: 8, maxLength: 64 }
    AddressInput:
      type: object
      required: [recipient, phone, provinceCode, wardCode, street]
      properties:
        recipient: { type: string, minLength: 1, maxLength: 100, description: 'NFC, trim, gộp khoảng trắng.' }
        phone: { type: string, description: 'BR-CHK-04.' }
        provinceCode: { type: string, maxLength: 10 }
        wardCode: { type: string, maxLength: 10 }
        street: { type: string, minLength: 5, maxLength: 200 }
        isDefault: { type: boolean, default: false }
        isReturn: { type: boolean, description: 'Bỏ qua (Won''t, PRD Slice 5 K5).' }
    Address:
      type: object
      required: [id, recipient, phone, province, ward, street, isDefault, isReturn]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        recipient: { type: string }
        phone: { type: string }
        province: { $ref: '#/components/schemas/Location' }
        ward: { $ref: '#/components/schemas/Location' }
        street: { type: string }
        isDefault: { type: boolean }
        isReturn: { type: boolean, const: false }
    Membership:
      type: object
      required: [tier, spent, nextTierAt, reviewDate]
      additionalProperties: false
      properties:
        tier: { type: string, enum: [bronze, silver, gold] }
        spent: { type: integer, minimum: 0 }
        nextTierAt: { type: [integer, 'null'] }
        reviewDate: { type: string, format: date }
    MemberVoucher:
      type: object
      required: [id, code, headline, subline, conditions, expiresAt]
      additionalProperties: false
      properties:
        id: { type: string }
        code: { type: string }
        headline: { type: string, examples: ['Giảm 15%'] }
        subline: { type: string, examples: ['tối đa 200.000 ₫'] }
        conditions: { type: string, examples: ['Đơn từ 500.000 ₫ · Chỉ thành viên'] }
        expiresAt: { type: [string, 'null'], format: date-time }
