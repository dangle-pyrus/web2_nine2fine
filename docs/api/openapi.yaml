        Staff + admin (`returns.process`). `approved` -> `received`. `lines` PHẢI có đúng một phần tử cho MỖI dòng đã yêu cầu (`variantId`; thiếu / thừa / trùng / lạ -> `422`, `field: lines`): `acceptedQuantity` 0..số lượng yêu cầu; `disposition` (`restock` nhập lại kho bán | `writeoff` hỏng, không nhập) BẮT BUỘC khi `acceptedQuantity > 0` (bỏ qua khi 0). Có dòng đạt < yêu cầu -> `note` BẮT BUỘC 5..250 (`field: note`). Không có ô sửa số tiền: `amount` chốt = công thức BR-RET-30 trên số lượng ĐẠT, lưu lại (đổi cài đặt / `line_discount` sau đó không đổi số chốt).
        Một giao dịch: mỗi dòng `restock` với `q > 0` cộng đúng `q` vào tồn của biến thể (kể cả biến thể ẩn / sản phẩm lưu trữ) và ghi ĐÚNG 1 dòng `inventory_adjustments` (`reason = return`, `delta = +q`, ghi chú `Trả hàng #<mã đơn>`, người + vai trò lúc đó); `writeoff` không đổi tồn, không dòng điều chỉnh (lưu `disposition`). Cộng đúng MỘT lần: lần hai / 20 yêu cầu song song -> đúng 1 thành công, còn lại `409 invalid-transition`.
        **Đóng thẳng:** tổng đạt = 0 hoặc `amount` chốt <= 0 -> yêu cầu sang `rejected` (không đổi tồn, tiền, `payment_status`; xoá số tài khoản đầy đủ; `note` bắt buộc; hàng gửi lại khách do nhân viên sắp xếp ngoài hệ thống); phản hồi `200` có `state = rejected`. Sự kiện `return_received` (hoặc `return_rejected` khi đóng thẳng); Should: email "Đã nhận hàng trả về".
