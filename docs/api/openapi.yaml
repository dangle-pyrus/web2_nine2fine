info:
  title: nine2fine API - Auth (Slice 1) + Catalog (Slice 2) + Cart & Checkout (Slice 3) + Admin đơn hàng (Slice 4, locked 2026-11-08) + Account (Slice 5, locked 2026-11-08)
  version: 0.1.0
  description: |
    status: locked (2026-11-07, Orchestrator)

    Hợp đồng auth duy nhất cho storefront (Angular) và backend (Express 5 + Prisma). BR/AC tham chiếu `docs/product/PRD.md` Slice 1.
    Khi chuyển `locked`, chỉ đổi qua quy trình: đề xuất trong `docs/handoff.md` -> Orchestrator duyệt -> cập nhật file này + `docs/decisions.md`.

    ## Quy ước chung
    - Mọi đường dẫn nằm sau `/api`. JSON UTF-8, `camelCase`, thời gian ISO 8601 UTC.
    - **Chuẩn hoá đầu vào (server làm trước khi validate):** `email` trim + lowercase (BR-AUTH-01); `code` bỏ khoảng trắng và dấu `-` (Should); `firstName`/`lastName` trim, gộp khoảng trắng, chuẩn hoá Unicode NFC (BR-AUTH-10). `password` giữ nguyên văn (BR-AUTH-17). Trường lạ trong body bị bỏ qua (ví dụ `role` khi đăng ký không có tác dụng, AC-AUTH-83).
    - Mọi lỗi 4xx do dữ liệu (kể cả JSON hỏng, body > 16 KB) trả `422 validation`. Không dùng 400.

    ## Cơ chế phiên (BR-AUTH-23..29, 35)
    - **Phiên phía máy chủ, token mờ (opaque), không dùng JWT.** Đăng nhập thành công tạo 1 dòng `sessions`; token là 32 byte ngẫu nhiên (CSPRNG) mã hoá base64url, CSDL chỉ lưu SHA-256 của token. Thu hồi phiên có hiệu lực ngay (BR-AUTH-29), đăng xuất chỉ thu hồi đúng 1 dòng (BR-AUTH-27).
    - **Cookie:** `HttpOnly; SameSite=Lax; Secure` (Secure bật khi `NODE_ENV=production`), `Max-Age` = thời gian còn lại tới hạn tuyệt đối. Hai cookie tách biệt: storefront `n2f_sid` (`Path=/api`), admin `n2f_asid` (`Path=/api/admin`). Cookie storefront không có giá trị ở `/api/admin/**` và ngược lại. Không trả token trong body, không có header `Authorization`.
    - **Hạn phiên:** member 30 ngày không hoạt động / tối đa 90 ngày; staff, admin 8 giờ / 24 giờ (BR-AUTH-24). Hạn không-hoạt-động trượt theo mỗi yêu cầu có xác thực (ghi `lastUsedAt` tối đa 1 lần/phút). Tối đa 10 phiên còn hạn mỗi tài khoản (BR-AUTH-28).
    - **Vai trò đọc từ bảng `users` ở mỗi yêu cầu** (không sao chép vào phiên), nên vô hiệu hoá / đổi vai trò có hiệu lực ngay; đồng thời vẫn thu hồi phiên theo BR-AUTH-29.
    - **Chống CSRF (3 lớp):** (1) `SameSite=Lax`; (2) mọi yêu cầu không phải GET/HEAD/OPTIONS phải có header `Origin` thuộc `CORS_ALLOWED_ORIGINS`, thiếu hoặc sai -> `403 origin-not-allowed`; (3) mọi yêu cầu ghi phải có header `X-Requested-With: n2f` (buộc preflight) và `Content-Type: application/json`. GET không bao giờ đổi trạng thái.
    - **CORS:** allowlist `CORS_ALLOWED_ORIGINS` (không dùng `*`), `Access-Control-Allow-Credentials: true`, cho phép header `Content-Type`, `X-Requested-With`. FE phải gọi với `withCredentials: true` (đã có).

    ## Phân quyền cho các module khác
    - Không có cookie hợp lệ -> `401 unauthenticated`. Có phiên nhưng thiếu quyền -> `403 forbidden` (BR-AUTH-34). Ma trận quyền ở slice Admin.

    ## Giới hạn tần suất
    Mọi `429` có header `Retry-After` (giây) và `error.retryAfterSeconds`. Ngưỡng chi tiết ở từng endpoint (BR-AUTH-02, 06, 08, 18).

    ## Chống dò email (BR-AUTH-03)
    Ngoài `POST /auth/lookup`, các endpoint trả cùng mã trạng thái, cấu trúc và thông điệp cho email có / không tồn tại. Việc gửi thư chạy nền (không chờ) và luôn thực hiện một phép so sánh băm giả khi không có bản ghi, để chênh lệch thời gian trung vị <= 300 ms.

    ## Khác biệt so với FE hiện tại (giữ tên cũ khi hợp lý)
    Giữ nguyên: đường dẫn `lookup`, `codes`, `login/code`, `login/password`, `register`, `password/reset`; `camelCase`; `withCredentials`; purpose `reset-password`; `AuthUser`. Đổi: (1) body lỗi dạng `{error:{code,message,...}}` và FE map theo `error.code` thay vì theo HTTP status (lý do: 422/400 hiện bị trộn, BR-AUTH-36); `AuthErrorCode` mở rộng; (2) `AuthUser` thêm `role` (BR-AUTH-25); (3) thêm `GET /auth/me`, `POST /auth/logout`; (4) `ResetPasswordRequest` giữ `{email, code, newPassword}`, không có `confirmPassword`; (5) FE thêm header `X-Requested-With: n2f` bằng 1 interceptor; (6) admin: lỗi đổi từ `{code,message,fields}` sang `{error:{code,message,field}}` (một schema duy nhất), `fields` map thành một `field` mỗi lỗi; `AdminUser` = `AuthUser` với `role` in (`staff`,`admin`).

    ---
    # Catalog (Slice 2, chỉ đọc)

    **status: locked** (2026-11-07, Orchestrator). Phần catalog (tag `catalog`, schema `Product*`, `SizeChart*`, `Catalog*`) đã đối chiếu với PRD Slice 2; phần auth ở trên vẫn **locked**. Ngoại lệ đã được duyệt: thêm mã `not-found` vào `ErrorCode` (decisions 2026-11-07). BR/AC: `docs/product/PRD.md` mục "Slice 2: Catalog" (BR-CAT-01..23, AC-CAT-01..53); khi mâu thuẫn, PRD thắng. Kế hoạch triển khai: `docs/api/catalog-implementation-plan.md`.

    - **Công khai, chỉ đọc (BR-CAT-18):** không cần cookie, không cần `X-Requested-With`. Cookie phiên (`n2f_sid`, `n2f_asid`) gửi kèm dù sai, đã thu hồi hay hết hạn đều bị bỏ qua: không bao giờ `401`, không `Set-Cookie`, phản hồi không phụ thuộc người dùng nên cache dùng chung được (AC-CAT-44, 45). `POST/PUT/PATCH/DELETE` trên `/products*`, `/size-charts*` -> `404 not-found`, kể cả khi thiếu `Origin` (AC-CAT-46).
    - **Chỉ sản phẩm `ACTIVE`** (BR-CAT-02): `DRAFT`/`ARCHIVED` không xuất hiện ở danh sách, `total`, tìm kiếm, `ids`; chi tiết -> `404 not-found`.
    - **Tiền:** số nguyên VND (không phần lẻ). **Ảnh:** API trả `mediaId` (khoá trong `frontend/src/media/media-manifest.ts`), không trả URL.
    - **Tham số lọc:** `gender`, `category`, `moment`, `size`, `color`, `maxPrice`, `available`, `q`, `sort`, `page`, `limit`, `ids`. Tên trùng `CatalogQuery` của FE trừ hai chỗ FE phải ánh xạ ở `HttpCatalogApi.list`: `search` -> `q`, và thêm `limit`/`page`/`ids`.
    - **Dung sai (BR-CAT-06, C3):** tham số rỗng / vắng = không lọc; `maxPrice=0` và `available=false` = không lọc. Giá trị lạ của `gender`, `category`, `moment`, `size`, `color` -> `200` danh sách rỗng (không lỗi). `sort`, `maxPrice`, `available`, `page`, `limit`, `q`, `ids` sai dạng / ngoài khoảng, hoặc tham số lặp -> `422 validation` kèm `field` là tên tham số. Tham số không khai báo bị bỏ qua.
    - **Sắp xếp ổn định (BR-CAT-07):** mọi `sort` đều hoà bằng `slug` tăng dần.
    - **Cache:** `GET /products` và `GET /products/{slug}`: `Cache-Control: public, max-age=10` + `ETag`, để giá / tồn kho phản ánh DB sau <= 30 giây (BR-CAT-11). `GET /size-charts/{category}`: `public, max-age=3600`. Phản hồi lỗi: `Cache-Control: no-store`.
    - **Giới hạn (BR-CAT-19):** 120 yêu cầu catalog / 60 giây / IP, bộ đếm riêng khỏi auth; vượt -> `429 rate-limited`, `Retry-After` và `retryAfterSeconds` trong 1..60. `limit` mặc định 24, tối đa 48. `ids` tối đa 48. `q` tối đa 100 ký tự sau chuẩn hoá.
    - **Đánh giá (BR-CAT-17):** `GET /products/{productId}/reviews` luôn `200 []`. Không có `rating` trong sản phẩm. Các đường dẫn đánh giá khác (`eligibility`, tạo đánh giá) và `/stock-alerts` không tồn tại ở slice này (`404 not-found`); FE chế độ HTTP không gọi chúng. Wishlist lưu ở FE; BE chỉ cung cấp `ids`.

    ---
    # Cart & Checkout (Slice 3)

    **status: locked (2026-11-07)**: contract Slice 3 được chốt cùng tài liệu `docs/api/cart-checkout-implementation-plan.md`; phần auth và catalog ở trên không đổi (chỉ thêm mã lỗi và thuộc tính tuỳ chọn của `ErrorResponse`, xem `ErrorCode`). BR/AC: `docs/product/PRD.md` mục "Slice 3: Cart & Checkout" (BR-CART, BR-CHK, BR-VOU; AC-CART, AC-CHK, AC-VOU); khi mâu thuẫn, PRD thắng. Nguồn nghiệp vụ: `docs/product/cart-checkout-business-rules.md`.

    **Giả định chờ Thắng (đánh dấu `[giả định chờ Thắng]`, đổi thì sửa theo quy trình contract locked):**
    1. COMMON-01..06 không có nội dung: tên trạng thái đơn / thanh toán theo danh sách nêu trong CHK-PAY-14; mã giảm % làm tròn **xuống** tới 1.000 ₫; tra cứu đơn khách bằng OTP theo thông số BR-AUTH-04..09 (8 số, 10 phút, gửi lại sau 60 giây), quyền xem đơn sau OTP 30 phút.
    2. Chuyển khoản QR tự đối soát (SePay hoặc tương đương) chưa có tài khoản nhận: khi `bankTransferEnabled = false` thì `bank-transfer` bị khoá trong `paymentMethods`, `POST /orders` với `bank-transfer` -> `422 validation` (`field: paymentMethod`), `GET /orders/{orderCode}/payment` -> `404 not-found`. Webhook đối soát là điểm mở rộng phía máy chủ (plan mục 4.8), chưa thuộc contract này.
    3. Địa giới: toàn quốc, 34 tỉnh/thành và phường/xã sau 01/07/2025.
    4. Khách tự huỷ đơn `to_ship` thẳng (`cancelledBy = customer`) cho tới khi có slice Admin; khi đó `to_ship` chuyển sang `cancel_requested` (đổi hành vi, cần quy trình contract).

    ## Quy ước Slice 3
    - **Tiền** là số nguyên VND. **Ngày giao** là ngày ISO `YYYY-MM-DD` theo giờ Việt Nam (Asia/Ho_Chi_Minh); thời điểm khác là ISO 8601 UTC. Tổng luôn `subtotal - discount + shippingFee - shippingDiscount = total` do máy chủ tính; mọi giá / tổng gửi từ trình duyệt chỉ để **đối chiếu** (`expected`), không bao giờ được tin.
    - **Người dùng:** `quote`, `vouchers/check`, `POST /orders`, `locations` dùng được khi chưa đăng nhập. Cookie `n2f_sid` sai / hết hạn / bị thu hồi ở các endpoint này bị coi như khách, **không** `401` (BR-CHK-02); staff / admin không gắn đơn. `/cart/**` và `GET /orders` bắt buộc phiên storefront (`401 unauthenticated`). Giỏ khách lưu ở trình duyệt, không gọi `/cart/**` (BR-CART-09); giá / tồn của giỏ khách được làm tươi bằng `POST /checkout/quote`.
    - **Tên trạng thái:** đơn `to_pay`, `to_ship`, `to_receive`, `completed`, `cancel_requested`, `cancelled`; thanh toán `pending`, `paid`, `failed`, `refunded`, `partially_refunded`. FE ánh xạ sang `OrderStatus` hiện có (plan mục 8).
    - **Định danh đơn:** `Order.id` là mã đơn `N2F` + `YYMMDD` + 4 số (vd. `N2F2611040427`); mọi `{orderCode}` chấp nhận chữ thường và dấu `#`, server chuẩn hoá. Không lộ UUID nội bộ hay `userId`.
    - **Quyền xem đơn:** (a) phiên storefront là chủ đơn; hoặc (b) cookie `n2f_oa` do `POST /orders/lookup/verify` cấp, gắn đúng 1 đơn, 30 phút. Không có (a) và (b) hợp lệ -> `401 unauthenticated`; có nhưng không đúng đơn -> `404 not-found` (không phân biệt "không tồn tại" và "của người khác").
    - **Idempotency (BR-CHK-15):** `POST /orders` và `POST /cart/merge` bắt buộc header `Idempotency-Key` (16-64 ký tự `A-Za-z0-9-`; thiếu / sai -> `422 validation`, `field: Idempotency-Key`). Cùng khoá + cùng nội dung trong 24 giờ -> trả lại đúng kết quả đầu tiên (`200`, header `Idempotency-Replayed: true`; không trừ kho, lượt voucher, không gửi thư lại). Cùng khoá khác nội dung -> `409 idempotency-conflict`. Lỗi `4xx/5xx` không lưu khoá (gửi lại cùng khoá được xử lý lại từ đầu). Sau 24 giờ khoá hết hiệu lực.
    - **Thứ tự kiểm khi đặt hàng (CHK-CF-01):** `422 validation` -> `422 invalid-address` -> `422 validation` (`paymentMethod`) -> `409 stock-changed` -> `409 voucher-changed` -> `409 price-changed` -> `409 possible-duplicate` -> `201`. Mọi `409` mang theo `quote` mới nhất để FE hiện số cũ / mới mà không gọi thêm.
    - **Giới hạn tần suất theo IP** (bộ đếm riêng từng nhóm, tách khỏi auth và catalog; mọi `429` có `Retry-After`): giỏ + báo giá + kiểm mã 120 / 60 giây; `POST /orders` 10 / 10 phút; tra cứu đơn khách (`lookup/codes` + `lookup/verify`) 10 / 15 phút; kiểm mã voucher: 10 mã không tồn tại trong 15 phút thì khoá kiểm mã 15 phút (BR-VOU-09).
    - **Cache:** mọi endpoint giỏ, báo giá, đơn: `Cache-Control: no-store`. `locations`: `public, max-age=86400`.

    ---
    # Admin đơn hàng (Slice 4)

    **status: locked (2026-11-08)**: Slice 4 admin-orders locked 2026-11-08, Orchestrator. Phần Slice 4 (tag `admin-orders`, schema `Admin*`, ba mã lỗi mới, hai thuộc tính mới của `ErrorResponse`, và các thay đổi cộng thêm / đổi hành vi của phần Slice 3 liệt kê ở "Thay đổi phần Slice 3" dưới đây) đã chốt; auth, catalog, phần còn lại của Slice 3 không đổi. BR/AC: `docs/product/PRD.md` mục "Slice 4: Admin đơn hàng" (BR-ADM-01..41, AC-ADM-01..50); khi mâu thuẫn, PRD thắng. Kế hoạch triển khai: `docs/api/admin-orders-implementation-plan.md`.

    **Câu hỏi đã trả lời (2026-11-08, Thắng nhận mặc định PO; `docs/decisions.md`):** S4-Q1 khách ở `to_ship` chỉ gửi yêu cầu huỷ (phát hành `toShipCancelMode = 'request'` cùng lát 4.5); S4-Q2 đơn bị từ chối nhận / giao không thành: huỷ ngay, cộng tồn ở bước "xử lý hàng hoàn" riêng; S4-Q3 giờ làm việc 08:00-18:00 thứ Hai-thứ Bảy, duyệt huỷ trong 24 giờ (chỉ cờ); S4-Q4 staff huỷ 5 lý do cố định (gồm `customer_request`), chỉ admin huỷ lý do `other`; S4-Q5 đơn vị vận chuyển nhập tự do 2-50 ký tự; S4-Q6 mỗi đơn khách chỉ gửi một yêu cầu huỷ; S4-Q7 chữ email và câu lý do theo PRD (Thắng sửa chữ sau khi đọc thư thật); S4-Q9 `declined_on_call`, cửa sổ 24 giờ của `unreachable`, mã vận đơn không trùng, staff thấy đủ SĐT / email. Các điểm lật nằm ở `backend/src/config/assumptions.ts` (xem plan mục 0); đổi thì theo quy trình contract locked. **Còn mở:** S4-Q8 (nội dung COMMON-01..03; bảng chuyển trạng thái do PO suy ra từ CHK-PAY-14, không chặn).

    ## Quy ước Slice 4
    - **Xác thực:** mọi `/admin/orders/**` dùng cookie admin `n2f_asid` (scheme `adminSession`, cùng cơ chế phiên Slice 1). Không có cookie, hết hạn, thu hồi, hoặc chỉ có `n2f_sid` -> `401 unauthenticated`, không có dữ liệu đơn; tài khoản bị vô hiệu -> `401` và xoá cookie (BR-ADM-03). Vai trò và `is_active` đọc lại từ bảng `users` ở **mọi** yêu cầu. Mọi phản hồi (kể cả `401`, `403`, `404`, `409`, `422`) có `Cache-Control: no-store` (BR-ADM-01).
    - **CSRF:** yêu cầu ghi (`POST`) dùng đúng quy tắc hiện có: `Origin` thuộc allowlist + `X-Requested-With: n2f` + `Content-Type: application/json` (`403 origin-not-allowed`). `GET` không đổi trạng thái.
    - **Phân quyền (BR-ADM-02, S4-Q4):** `staff` và `admin`: xem, ghi cuộc gọi, xác nhận, bàn giao, giao xong, huỷ lý do `unreachable` / `declined_on_call` / `customer_request` / `refused` / `undeliverable`, xử lý hàng hoàn, duyệt / từ chối yêu cầu huỷ, ghi chú. Chỉ `admin`: huỷ lý do `other`. Thiếu quyền -> `403 forbidden`, đơn không đổi, không có sự kiện. `member` không có phiên admin nên luôn `401`. **Vai trò đọc lại từ `users` ở mỗi yêu cầu (AC-ADM-03):** hạ vai trò bằng SQL có hiệu lực ngay ở yêu cầu kế tiếp (hành động chỉ admin -> `403 forbidden`, `GET` vẫn `200`); `is_active = false` -> `401 unauthenticated` ở yêu cầu kế tiếp. Slice 4 **không** thu hồi dòng `sessions` (thuộc slice Admin người dùng, AC-AUTH-75).
    - **Thứ tự kiểm ở yêu cầu ghi:** `401` -> `403 origin-not-allowed` -> `429` -> `403 forbidden` (theo vai trò và `reason`, không cần đọc đơn) -> `422 validation` (định dạng body) -> `404 not-found` (mã đơn) -> khoá dòng đơn rồi `409 order-state-changed` (`expectedStatus` khác trạng thái hiện tại) -> `409 invalid-transition` -> `409 condition-not-met` -> `200`.
    - **Chống hai người giẫm nhau (BR-ADM-14, 15):** mọi hành động trừ `notes` mang `expectedStatus` = trạng thái đơn mà người thao tác đang thấy. Máy chủ khoá dòng đơn (`SELECT ... FOR UPDATE`), so sánh, rồi mới thực hiện toàn bộ thay đổi + đúng 1 sự kiện trong **một** giao dịch. Khác -> `409 order-state-changed` kèm `order` (đơn hiện tại) và `currentStatus`; không đổi gì, không sự kiện, không thư. Khi hai yêu cầu cùng đơn chạy đồng thời đúng một yêu cầu thành công. `expectedStatus` chỉ phát hiện đổi **trạng thái**; hành động hợp lệ theo trạng thái nhưng không hợp lệ theo điều kiện (đã xác nhận, đã xử lý hàng hoàn...) -> `409 invalid-transition`.
    - **Idempotency (tuỳ chọn):** header `Idempotency-Key` (16-64 ký tự `A-Za-z0-9-`) ở mọi `POST` hành động. Cùng khoá + cùng người + cùng đường dẫn + cùng body trong 24 giờ -> `200` với đúng kết quả lần đầu, header `Idempotency-Replayed: true`, không tác dụng phụ; cùng khoá khác nội dung -> `409 idempotency-conflict`. Lỗi `4xx/5xx` không lưu khoá. Không có header thì chỉ có `expectedStatus` bảo vệ (đủ cho BR-ADM-14; FE "Thử lại" luôn tải lại đơn trước, AC-ADM-17).
    - **Phân trang:** `page` (>= 1, mặc định 1), `limit` (1..50, mặc định 20; cùng tên tham số với Slice 3, không dùng `pageSize`); sai -> `422 validation`, `field: limit` / `page`. Trang quá cuối -> `items` rỗng, `total` đúng. Sắp `placedAt` giảm dần, hoà bằng mã đơn giảm dần. Phản hồi trả `page` và `limit` đã áp dụng.
    - **Tab (`view`) [BR-ADM-07]:** mỗi đơn thuộc đúng một tab (trừ `all`): `pending-payment` = `to_pay`; `to-confirm` = đơn COD `to_ship`, `needsConfirmCall`, chưa xác nhận ("cần gọi"); `to-fulfil` = `to_ship` còn lại; `in-transit` = `to_receive`; `cancel-requests` = `cancel_requested`; `returning` = `cancelled` từ `to_receive` mà hàng hoàn chưa xử lý; `completed`; `cancelled` = `cancelled` còn lại. Tổng 8 tab con = `all`.
    - **Timeline admin:** **mới nhất trước** (BR-ADM-10); mỗi dòng có người thực hiện (`staff` kèm tên + vai trò, `customer`, `system`), trạng thái trước / sau, ghi chú nội bộ. Sự kiện chỉ thêm, API không có `PUT` / `DELETE` sự kiện (`404`). Timeline phía khách (`Order.timeline`, **cũ nhất trước** như Slice 3; hai API khác thứ tự là chủ ý) chỉ gồm các lần đổi trạng thái, người = `nine2fine` hoặc `customer`, không có tên nhân viên, ghi chú nội bộ, lần gọi, lý do nội bộ, mã người dùng (BR-ADM-12).
    - **`allowedActions`** do máy chủ tính theo vai trò + trạng thái + điều kiện (đã xác nhận chưa, đủ 3 lần gọi chưa, hàng hoàn đã xử lý chưa); FE chỉ hiện nút có trong danh sách (BR-ADM-04). Ghi chú nội bộ (`add-note`) luôn có.
    - **Giới hạn tần suất (Should, BR-ADM-41):** theo tài khoản admin / staff: đọc (`GET`) 120 / 60 giây, ghi (`POST`) 60 / 60 giây, bộ đếm riêng; vượt -> `429 rate-limited` + `Retry-After`.
    - **Mã lỗi mới:** `invalid-transition` (409), `order-state-changed` (409), `condition-not-met` (409). Tái dùng: `unauthenticated`, `forbidden`, `origin-not-allowed`, `not-found`, `validation`, `idempotency-conflict`, `rate-limited`, `not-cancellable` (phía khách), `unavailable`.

    ## Thay đổi phần Slice 3 (locked cùng Slice 4 ngày 2026-11-08; cộng thêm trừ mục 1)
    1. **Đổi hành vi** `POST /orders/{orderCode}/cancel` ở `to_ship`: tạo `cancel_requested` thay vì huỷ ngay (S4-Q1 đã chốt; thay giả định chờ Thắng số 4 của Slice 3). `to_pay` vẫn huỷ thẳng. Phát hành cùng lát có màn duyệt (lát 4.5) với `toShipCancelMode = 'request'`.
    2. `Order` thêm tuỳ chọn: `shipment`, `deliveredAt`, `cancelRequest`, `cancelMode`; `canCancel` mở rộng nghĩa; `OrderTimelineEntry` thêm tuỳ chọn `actor`. `OrderStatus.cancel_requested` nay có thể xuất hiện.
    3. `ErrorCode` thêm 3 mã; `ErrorResponse.error` thêm `currentStatus`, `order`.
    4. `Order.cancelReason` của đơn huỷ do shop là **câu chuẩn cho khách** (BR-ADM-28), không phải ghi chú nội bộ.
    ---
    # Account (Slice 5)

    **status: locked (2026-11-08)**: tag `account`, schema `Account*`, `Membership`, `MemberVoucher`, `Address*`, mã lỗi mới `invalid-password`. Các phần trước không đổi. BR/AC: `docs/product/PRD.md` mục "Slice 5: Account" (BR-ACC-01..18, AC-ACC-01..26); khi mâu thuẫn, PRD thắng. Kế hoạch: `docs/api/account-implementation-plan.md`.

    ## Quy ước Slice 5
    - **Xác thực:** mọi `/account/**` dùng cookie storefront `n2f_sid` (scheme `storefrontSession`). Không có / hết hạn / thu hồi / chỉ có `n2f_asid` -> `401 unauthenticated`. Dữ liệu luôn là của chính người gọi; không có tham số người dùng. Mọi phản hồi `Cache-Control: no-store`.
    - **CSRF:** yêu cầu ghi như các module khác (`Origin` + `X-Requested-With: n2f` + `Content-Type: application/json`).
    - **Giới hạn tần suất theo tài khoản:** đọc 120 / 60 giây, ghi 30 / 60 giây -> `429 rate-limited` + `Retry-After`.
    - **Thứ tự kiểm ở yêu cầu ghi:** `403 origin-not-allowed` -> `401` -> `429` -> `422 validation` -> `404 not-found` -> `422 invalid-address` / `invalid-password` / `password-locked` -> thành công.
    - **Mã lỗi mới:** `invalid-password` (422, mật khẩu hiện tại sai khi đổi mật khẩu, `field: currentPassword`). Tái dùng: `validation`, `underage`, `password-locked`, `invalid-address`, `not-found`, `rate-limited`, `unauthenticated`, `unavailable`.
